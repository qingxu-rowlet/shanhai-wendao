<!-- 山海问道 © 2026 qingxu-rowlet · CC BY-NC-SA 4.0 (no commercial use) · https://github.com/qingxu-rowlet/shanhai-wendao -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: full-screen pixel world on a canvas; Stardew-style wooden panels float over it (clock top-right,
   realm + quest top-left, tool bar bottom, energy/health bars bottom-right). One warm, single-theme look by choice. */
:root{
  color-scheme: dark;
  --wood:#b5682e; --wood-d:#7a3f17; --wood-dd:#4a230b; --parch:#fbe6b8; --parch-d:#ecc888; --ink:#4a2a12; --ink-soft:#8a5a30;
  --leaf:#5fa83f; --jade:#3fb39a; --gold:#f2c14e; --cinnabar:#c8413b; --night:#141a2e; --sky:#3d6b8a;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --f-head:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Pixelify Sans",ui-monospace,monospace;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:#1b2a1c;color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
canvas#cv{position:fixed;inset:0;display:block;touch-action:none}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wood{background:var(--parch);border:4px solid var(--wood);border-radius:8px;
  box-shadow:0 0 0 3px var(--wood-dd), inset 0 0 0 2px var(--parch-d), inset 0 -6px 0 rgba(180,120,60,.18), 0 6px 0 3px rgba(0,0,0,.28)}
.btn{height:44px;padding:0 16px;border-radius:8px;background:var(--parch-d);color:var(--ink);font-family:var(--f-head);font-size:18px;
  box-shadow:0 0 0 3px var(--wood-d), inset 0 -4px 0 rgba(120,70,20,.25)}
.btn.main{background:var(--cinnabar);color:#fff3dc;box-shadow:0 0 0 3px #6e1f1b, inset 0 -4px 0 rgba(0,0,0,.25)}
.btn.mini{height:34px;padding:0 10px;font-size:15px;white-space:nowrap}
.btn:disabled{opacity:.45}
.muted{color:var(--ink-soft);font-size:13px;line-height:1.5}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#hud > *{pointer-events:auto}
.hud-tl{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:min(320px,58vw)}
.realm{padding:8px 12px 10px;min-width:150px}
.realm b{font-family:var(--f-head);font-size:20px;font-weight:400;display:block;margin-bottom:4px}
.xbar,.realm .bar{height:8px;border-radius:4px;background:#d9b47a;box-shadow:inset 0 0 0 1px var(--wood-d);overflow:hidden}
.xbar i,.realm .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jade),#8de6cf);transition:width .4s}
.quest{padding:6px 8px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:4px;min-width:200px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qhead b{font-family:var(--f-head);font-weight:400;font-size:16px;color:var(--ink)}
.qall{font-size:12px;color:var(--ink-soft);padding:2px 6px;border-radius:4px;background:var(--parch-d)}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 6px;border-radius:6px;background:#f6dca8;cursor:pointer;box-shadow:inset 0 0 0 2px transparent}
.qrow.on{background:#fff2c8;box-shadow:inset 0 0 0 2px var(--cinnabar)}
.qrow .qt{min-width:0;display:flex;flex-direction:column}
.qrow .qt b{font-family:var(--f-head);font-weight:400;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qt span{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qk.side{background:var(--wood)!important} .qk.avail{background:#7a8a5a!important}
.quest .qk{font-size:11px;background:var(--cinnabar);color:#fff3dc;padding:0 6px;border-radius:3px}
.quest .qgo{height:30px;padding:0 10px;border-radius:6px;background:var(--cinnabar);color:#fff3dc;font-family:var(--f-head);font-size:14px;box-shadow:0 2px 0 #6e1f1b}
.quest b{display:block;font-family:var(--f-head);font-weight:400;font-size:14px;color:var(--cinnabar)}
.quest span{color:var(--ink-soft);font-size:12px}
.quest:empty{display:none}
.hud-tr{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.clock{position:relative;padding:6px 10px 8px;min-width:112px;text-align:right;box-sizing:border-box}
.minibox{padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;width:140px;box-sizing:border-box}
@media (max-width:420px){ .minibox{width:112px} .quest{min-width:0} }
.minibox canvas{width:100%;height:auto;max-height:90px;object-fit:contain;border-radius:3px;background:#3a5a2a}
.minibox span{font-family:var(--f-head);font-size:12px;color:var(--ink-soft);line-height:1}
.clock #hDay{font-family:var(--f-head);font-size:16px}
.clock #hTime{font-family:var(--f-num);font-size:15px;font-weight:700;margin-top:2px}
.clock .stones{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:4px;padding-top:4px;border-top:2px solid var(--parch-d)}
.clock .stones b{font-family:var(--f-num);font-size:17px;color:#2f5f96}
.gem{width:12px;height:14px;background:linear-gradient(135deg,#bfe9ff,#5b8fd6 60%,#2f4a75);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%)}
.sun{position:absolute;left:10px;top:10px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff3a0,#f2a73a);box-shadow:0 0 0 2px var(--wood-d)}
.sun.moon{background:radial-gradient(circle at 60% 40%,#f4f1d8,#c9c39a);box-shadow:0 0 0 2px var(--wood-d), inset -5px -2px 0 #a39e7a}
.vitals{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));padding:8px 10px;display:flex;flex-direction:column;gap:6px;width:min(220px,40vw);box-sizing:border-box}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.vrow span{font-family:var(--f-head);font-size:15px}
.vrow em{font-style:normal;font-family:var(--f-num);font-size:13px;min-width:46px;text-align:right}
.hbar{height:14px;border-radius:7px;background:#3a2a1a;box-shadow:inset 0 0 0 2px var(--wood-d);overflow:hidden}
.hbar i{display:block;height:100%;width:0;transition:width .3s}
.hbar.hp i{background:linear-gradient(#ff8a7a,#c8413b)} .hbar.mp i{background:linear-gradient(#9fd8ff,#4a7fd0)}
@media (max-width:420px){ .vitals{bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 74px)} }
.bars-old{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:flex-end}
.vbar{width:16px;height:110px;padding:3px;display:flex;align-items:flex-end;position:relative}
.vbar i{display:block;width:100%;border-radius:3px;transition:height .3s}
.vbar.en i{background:linear-gradient(#9be86a,#4caa3a)} .vbar.hp i{background:linear-gradient(#ff8a7a,#c8413b)}
.vbar::after{content:attr(data-l);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:var(--f-head);font-size:13px;color:#fff3dc;text-shadow:0 1px 0 #000,0 0 3px #000}
.hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;max-width:calc(100vw - 110px);overflow-x:auto}
.slot{width:58px;height:58px;flex:none;border-radius:6px;background:#f3d49a;box-shadow:inset 0 0 0 2px var(--parch-d);position:relative;display:grid;place-items:center}
.slot img{width:44px;height:44px}
.slot.on{background:#fff2c8;box-shadow:inset 0 0 0 3px var(--cinnabar)}
.slot b{position:absolute;right:3px;bottom:1px;font-family:var(--f-num);font-size:13px;color:var(--ink);text-shadow:0 1px 0 #fff}
.slot kbd{position:absolute;left:3px;top:1px;font-family:var(--f-num);font-size:10px;color:var(--ink-soft)}
@media (pointer:coarse){ .slot kbd{display:none} }
#menuB{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:52px;height:52px;font-family:var(--f-head);font-size:20px;display:grid;place-items:center}
#toast{position:fixed;left:50%;top:max(84px,calc(env(safe-area-inset-top,0px) + 84px));transform:translate(-50%,-10px);opacity:0;padding:6px 14px;font-family:var(--f-head);font-size:16px;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.wfloat{position:fixed;transform:translate(-50%,0);font-family:var(--f-head);font-size:16px;color:#fff3dc;text-shadow:0 2px 0 #000,0 0 4px #000;pointer-events:none;animation:wf 1.2s ease-out forwards;z-index:15;white-space:nowrap}
@keyframes wf{to{transform:translate(-50%,-40px);opacity:0}}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:var(--f-brush);font-size:clamp(40px,11vw,72px);color:#fff3c4;text-shadow:0 0 12px #f2c14e,0 4px 0 #6e3b12;opacity:0;pointer-events:none;z-index:30}
#banner.on{animation:bn 2.4s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
#mapname{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-brush);font-size:clamp(30px,8vw,48px);color:#fff3dc;text-shadow:0 3px 0 #000,0 0 10px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:12;white-space:nowrap}
#mapname.on{animation:mn 2s ease-out}
@keyframes mn{0%{opacity:0}20%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 max(10px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.dlg{max-width:760px;margin:0 auto;display:flex;gap:12px;padding:12px;min-height:104px;position:relative;cursor:pointer}
.port{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.port canvas{width:76px;height:76px;background:#f0cf94;border-radius:6px;box-shadow:inset 0 0 0 2px var(--wood-d)}
.port span{font-family:var(--f-head);font-size:15px;background:var(--wood);color:#fff3dc;padding:1px 8px;border-radius:4px;white-space:nowrap}
.dtext{flex:1;min-width:0;font-size:17px;line-height:1.6}
.dtext p{margin:0}
.dtext.narr{font-style:normal;color:#6b4320}
.dtext .who{font-family:var(--f-head);color:var(--cinnabar);margin-right:6px}
.more{position:absolute;right:12px;bottom:6px;font-style:normal;color:var(--wood);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices button{text-align:left;padding:10px 12px;border-radius:8px;background:#f3d49a;box-shadow:inset 0 0 0 2px var(--parch-d);font-size:16px}
.choices button:hover,.choices button:focus-visible{background:#fff2c8;box-shadow:inset 0 0 0 3px var(--cinnabar)}

/* ---------- panels ---------- */
#panel{position:fixed;inset:0;z-index:22;background:rgba(10,10,20,.45);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pwin{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-sizing:border-box}
.ptitle{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:3px solid var(--parch-d)}
.ptitle h2{margin:0;font-family:var(--f-head);font-weight:400;font-size:22px}
.ptitle .x{width:36px;height:36px;font-size:24px;border-radius:6px;background:var(--parch-d)}
.pbody{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border-radius:6px 6px 0 0;background:var(--parch-d);font-family:var(--f-head);font-size:16px}
.tabs button.on{background:var(--wood);color:#fff3dc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;border-radius:6px;background:#f3d49a;box-shadow:inset 0 0 0 2px var(--parch-d);position:relative;display:grid;place-items:center}
.cell img{width:70%}
.cell b{position:absolute;right:4px;bottom:2px;font-family:var(--f-num);font-size:13px}
.idesc{background:#f6dca8;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.5;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:#f6dca8;border-radius:6px;padding:8px}
.row img{width:36px;height:36px}
.row b{font-family:var(--f-head);font-weight:400;font-size:16px}
.row small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.4}
.row .have{color:#2f7a3a} .row .lack{color:var(--cinnabar)}
.greet{margin:0;font-size:15px}
.cult{display:flex;flex-direction:column;gap:8px}
.realm-big{font-family:var(--f-brush);font-size:40px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.stats span{background:#f6dca8;border-radius:6px;padding:6px 8px;font-size:13px;display:flex;justify-content:space-between}
.stats b{font-family:var(--f-num)}
.tip{font-size:14px;line-height:1.6;margin:0;background:#f6dca8;border-radius:6px;padding:8px 10px}
.book{display:flex;flex-direction:column;gap:8px}
.bk{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;background:#f6dca8;border-radius:6px;padding:8px;align-items:start}
.bk img{width:56px}
.bk.unk img{filter:brightness(0) opacity(.35)}
.bk p{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--ink-soft)}
.bk b{font-family:var(--f-head);font-weight:400;font-size:17px}
.qcur{background:#f6dca8;border-radius:6px;padding:10px}
.qcur b{font-family:var(--f-head);font-weight:400;font-size:18px;color:var(--cinnabar)}
.qcur p{margin:4px 0 0;font-size:14px;line-height:1.5}
.qdone{margin:0;padding-left:4px;list-style:none;font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px}
.set{display:flex;flex-direction:column;gap:10px}

/* ---------- battle ---------- */
#battle{position:fixed;inset:0;z-index:24;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 38%,#3f6a4a 0%,#22392a 55%,#141f18 100%);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#battle.boss{background:radial-gradient(ellipse at 50% 38%,#6a3f3f 0%,#3a2222 55%,#1a1010 100%)}
#battle.shake{animation:shk .3s}
@keyframes shk{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}
.b-top{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.b-name{font-family:var(--f-head);font-size:24px;color:#fff3dc;text-shadow:0 2px 0 #000}
.b-name small{font-size:14px;margin-left:8px;background:var(--cinnabar);padding:1px 8px;border-radius:4px;vertical-align:middle}
.hpbar{height:12px;border-radius:6px;background:#2a1a12;box-shadow:0 0 0 2px #000;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a7a,#c8413b);transition:width .35s}
.hpbar.me i{background:linear-gradient(#9be86a,#4caa3a)} .hpbar.mp i{background:linear-gradient(#9fd8ff,#4a7fd0)}
.b-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#bEnemy{max-width:80vw;max-height:42vh;object-fit:contain;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35));animation:idle 2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-6px)}}
#bEnemy.hit{animation:hitf .35s}
@keyframes hitf{20%{filter:brightness(3);transform:translateX(8px)}60%{transform:translateX(-6px)}}
#bEnemy.gone{animation:none;opacity:.25;transition:opacity .6s;filter:grayscale(1)}
.b-intent{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:var(--parch);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:14px;box-shadow:0 0 0 2px var(--wood-d);white-space:nowrap}
.b-intent.warn{background:#ffd9a8;color:#8c2a2a;box-shadow:0 0 0 2px var(--cinnabar);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
.b-floats{position:absolute;inset:0;pointer-events:none}
.b-float{position:absolute;left:50%;top:40%;font-family:var(--f-num);font-weight:700;font-size:34px;color:#fff;text-shadow:0 3px 0 #8c2a2a,0 0 6px #000;animation:bf .9s ease-out forwards}
.b-float.me{top:auto;bottom:4%;color:#ffd0c8}
@keyframes bf{to{transform:translateY(-50px);opacity:0}}
.b-log{max-width:520px;width:100%;margin:0 auto 10px;color:#fff3dc;font-size:15px;min-height:22px;text-align:center;text-shadow:0 1px 0 #000}
.b-panel{max-width:520px;width:100%;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.b-me{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.b-me b{grid-column:1/-1;font-family:var(--f-head);font-weight:400;font-size:16px}
.b-me em{font-style:normal;font-family:var(--f-num);font-size:13px}
.b-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b-acts button{height:52px;border-radius:8px;background:#f3d49a;box-shadow:inset 0 0 0 2px var(--parch-d),0 3px 0 var(--wood-d);font-family:var(--f-head);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.b-acts button small{font-family:var(--f-body);font-size:11px;color:var(--ink-soft)}
.b-acts button img{width:22px;height:22px}
.b-acts button:disabled{opacity:.4}
.b-result{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
.b-result b{font-family:var(--f-brush);font-size:40px;color:var(--cinnabar)}
.b-result span{font-size:15px}
.b-result .btn{margin-top:6px;width:100%}

/* ---------- fx / title ---------- */

#cg.go #cgHer{animation-delay:.25s}
@keyframes cgIn{from{opacity:0;transform:translateY(30px)}}
.cg-title{position:absolute;top:max(18px,env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cg-title small{font-family:var(--f-head);font-size:14px;letter-spacing:.2em;color:#ffd0dc}
.cg-title b{font-family:var(--f-brush);font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1.1}
#cg.go .cg-title{animation:inkIn 1.4s ease-out both}
#cgHer.bust{height:min(34vh,280px)!important}
#cgMe{height:min(26vh,220px)!important}
#cgHer.pop{animation:cgPop .35s ease-out}
@keyframes cgPop{40%{transform:translateY(-6px)}}
#cg.swap #cgBg{animation:cgSwap .8s ease-out}
@keyframes cgSwap{from{opacity:0}}
.mails{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.mailrow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:2px solid #b89a6a;border-radius:6px;background:#fbf3e4;font:inherit;cursor:pointer}
.mailrow.new{border-color:#c8413b;background:#fff0e0}
.mailrow.new b::before{content:'● ';color:#c8413b}
.letter{background:#f8ecd0;border:2px solid #c8a870;padding:16px 18px;border-radius:4px;line-height:1.9;font-size:16px;box-shadow:inset 0 0 30px rgba(160,120,60,.25)}
.lgift{margin:10px 0;color:#7a5a2a}
.tabs.sub button{font-size:14px;padding:4px 10px}
.goldstar{font-size:12px;color:#b8862d;background:#fff0b0;padding:0 5px;border-radius:3px}
.bk.qy{align-items:center}.bk.qy .qyt{flex:none;width:42px;text-align:center;font-family:var(--f-head);font-size:13px;padding:6px 0;border-radius:4px;background:#d9c9a8;color:#5a4630}
.bk.qy.t-rare .qyt{background:#c9b8f5;color:#3a2a6a}.bk.qy.t-legend .qyt{background:#f2c14e;color:#5a3a10}.bk.qy.t-legend:not(.unk){box-shadow:0 0 0 2px #f2c14e inset}
.bounty h4{margin:14px 0 6px;font-family:var(--f-head);font-weight:400}
.blist{display:flex;flex-direction:column;gap:8px}
.bnote{background:#fbf3e4;border:2px solid #c8a870;border-radius:4px;padding:8px 10px;box-shadow:2px 2px 0 rgba(90,60,30,.18);display:flex;flex-direction:column;gap:3px}
.bnote small{color:#8a6a4a}.bnote b{font-weight:400;line-height:1.5}
.bnote.ready{border-color:#3f8f6a;background:#eef8ec}.bnote.done{opacity:.55}
.brow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}.brow .bpay{color:#b8862d;margin-left:auto}
.bshop{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.bitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:2px solid #c8a870;border-radius:4px;background:#fbf3e4;font:inherit;font-size:13px;cursor:pointer}
.bitem img{width:28px;height:28px}.bitem em{font-style:normal;color:#8b5bc5;font-size:12px}.bitem:disabled{opacity:.45;cursor:default}
.rare{font-size:11px;color:#7a5ad0;letter-spacing:-1px}
.bk.king{background:linear-gradient(90deg,#fff0b0,#f6dca8)}
.kingfish h3{color:var(--cinnabar);animation:pulse .6s infinite}
.cgb{height:26px!important;font-size:12px!important;padding:0 8px!important;margin:2px 2px 0 0}
.lock{font-size:11px;color:#a89070;margin-right:4px}
.copyright{margin:6px 0 0;font-size:11px;color:rgba(255,243,220,.7);text-shadow:0 1px 0 rgba(0,0,0,.5)}
#selftest{position:fixed;inset:0;z-index:60;background:rgba(10,10,20,.7);display:grid;place-items:center;padding:16px}
.st-box{width:min(560px,100%);max-height:90vh;overflow:auto;padding:14px;color:var(--ink);box-sizing:border-box}
.st-box h3{margin:0 0 8px;font-family:var(--f-head);font-weight:400;font-size:22px}
.st-box.ok h3{color:#2f7a3a} .st-box.bad h3{color:var(--cinnabar)}
.st-box ol{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
.st-box li.ok{color:#2f5a1f} .st-box li.bad{color:var(--cinnabar);font-weight:600}
.rp-ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brush);font-size:30px;background:#e9c487;color:var(--wood-dd)}
.bk.unk .rp-ico{background:#d9cbb0;color:#a89070}
.bk .btn.mini{margin-top:6px}
#reviewNote{position:fixed;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top,0px));z-index:45;width:min(520px,calc(100vw - 24px));padding:10px 12px;box-sizing:border-box;color:var(--ink);background:#e9f2ff}
#reviewNote b{font-family:var(--f-head);font-weight:400;font-size:17px;color:#2f4a75}
#reviewNote p{margin:4px 0 6px;font-size:14px;line-height:1.5}
.rn-btns{display:flex;gap:6px;flex-wrap:wrap}
#reviewHub{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.6);display:grid;place-items:center;padding:12px}
.rh-box{width:min(640px,100%);max-height:92vh;overflow:auto;padding:14px;box-sizing:border-box;color:var(--ink)}
.rh-box h3{margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:24px}
.rh-box h4{margin:12px 0 6px;font-family:var(--f-head);font-weight:400;font-size:18px;color:var(--cinnabar)}
.rh-list{display:flex;flex-direction:column;gap:6px}
.rh-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border-radius:8px;background:#f6dca8;color:var(--ink);text-decoration:none}
.rh-item:hover,.rh-item:focus-visible{box-shadow:inset 0 0 0 2px var(--cinnabar)}
.rh-item b{font-family:var(--f-head);font-weight:400;font-size:16px}
.rh-item span{grid-column:1;font-size:12px;color:var(--ink-soft);line-height:1.4}
.rh-item code{grid-column:2;grid-row:1/3;align-self:center;font-size:12px;color:#2f4a75}
.rh-box .rn-btns{margin-top:12px}
.musicb{padding:4px 10px;font-family:var(--f-head);font-size:14px;color:var(--ink)}
.musicb.off{color:#a89070;text-decoration:line-through}
#reviewPill{position:fixed;left:50%;transform:translateX(-50%);top:max(6px,env(safe-area-inset-top,0px));z-index:45;padding:4px 12px;font-family:var(--f-head);font-size:14px;color:#2f4a75;background:#e9f2ff}

/* ---------- cultivation ---------- */
const NUM = ['','一','二','三','四','五','六','七','八','九'];
function realmName(L){ return L===0 ? '凡人' : L<=9 ? `炼气${NUM[L]}层` : L===10 ? '筑基初期' : L===11 ? '筑基中期' : '筑基后期'; }
function expNeed(L){ return L===0 ? 20 : L<9 ? 40+L*25 : L===9 ? 320 : 400+(L-10)*150; }
function statsFor(L){
  const z=L>=10?1:0;
  return {hp:Math.round(50+15*L+z*60), mp:Math.round(16+4*L+z*12), atk:Math.round(6+2.2*L+z*5), def:Math.round(1+0.8*L+z*2)};
}

function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  const t=f<0?0:255, k=Math.abs(f); r=Math.round(r+(t-r)*k); g=Math.round(g+(t-g)*k); b=Math.round(b+(t-b)*k);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function mix(a,b,t){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16); const c=i=>Math.round(((A>>i)&255)*(1-t)+((B>>i)&255)*t);
  return '#'+((1<<24)|(c(16)<<16)|(c(8)<<8)|c(0)).toString(16).slice(1); }
function lookPalette(look){
  const skin=LOOK.skins[look.skin], hair=LOOK.hairs[look.hairColor], cloth=LOOK.cloths[look.cloth];
  const light=parseInt(hair.slice(1,3),16)>150;
  const lower = look.style==='jin' ? '#3a3048' : look.style==='qun' ? shade(cloth,.18) : cloth;
  const sash = look.style==='jin' ? '#5e3a20' : look.style==='qun' ? (look.cloth===1?'#d9708a':'#fbf3e4') : (look.cloth===7?'#c8413b':'#e0aa3e');
  return { S:skin, s:shade(skin,-.13), E:'#2b2533', e:'#ffffff', L:look.g==='f'?'#2b2533':skin, M:mix(skin,'#ff7a8a',.35), m:'#b5534a',
    W:look.cloth===1?'#c9b48a':'#fbf3e4', C:cloth, c:shade(cloth,-.25), A:sash, P:lower, p:shade(lower,-.22), F:'#4a2a1a',
    H:hair, h:light?shade(hair,-.12):shade(hair,.12), Y:'#e8b84a', R:'#d84a4a' };
}
function composeRows(dir, look, frame){
  const rows=BODY[dir].map(r=>r.split(''));
  // girls' dresses flare at the hem
  if(look.style==='qun'){ for(const y of [17,18]){ if(dir==='side'){ rows[y][3]='P'; rows[y][11]='P'; } else { rows[y][2]='P'; rows[y][13]='P'; } } }
  rows[19]=FEET[dir][frame%4].split('');
  const st=LOOK.hairstyles[look.hair].id;
  const put=(y,line)=>{ if(y>=rows.length) return; for(let x=0;x<16;x++){ const ch=line[x]; if(ch&&ch!=='.') rows[y][x]=ch; } };
  if(dir==='down') HAIR_CAP.down[st].forEach((l,y)=>put(y,l));
  else { HAIR_CAP[dir].base.forEach((l,y)=>put(y,l)); const ex=HAIR_CAP[dir][st]; for(const y in ex) put(+y,ex[y]); }
  return rows.map(r=>r.join(''));
}
const LOOKC={};
function lookSprite(look, dir, frame){
  const key=JSON.stringify(look)+dir+frame; if(LOOKC[key]) return LOOKC[key];
  const rows=composeRows(dir,look,frame), pal=lookPalette(look), h=rows.length, w=16;
  const c=document.createElement('canvas'); c.width=w+2; c.height=h+2; const g=c.getContext('2d');
  const filled=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rows[y][x]!=='.';
  g.fillStyle='#2a1e1a';
  for(let y=-1;y<=h;y++) for(let x=-1;x<=w;x++){ if(filled(x,y)) continue; if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1)) g.fillRect(x+1,y+1,1,1); }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const ch=rows[y][x]; if(ch==='.') continue; g.fillStyle=pal[ch]||'#f0f'; g.fillRect(x+1,y+1,1,1); }
  c.bottom=h+1; return LOOKC[key]=c;
}

/* ---------- sprite & tile caches ---------- */
const SPRC = {};
function sprite(key, color){
  const ck = key+(color||''); if(SPRC[ck]) return SPRC[ck];

  const c=document.createElement('canvas'); c.width=w+2; c.height=h+2; const g=c.getContext('2d');
  const filled=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rows[y][x]&&rows[y][x]!=='.';
  // outline first, then pixels
  g.fillStyle=PAL.k;
  for(let y=-1;y<=h;y++) for(let x=-1;x<=w;x++){ if(filled(x,y)) continue;
    if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1)) g.fillRect(x+1,y+1,1,1); }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const ch=rows[y][x]; if(!ch||ch==='.') continue;
    g.fillStyle = ch==='X' ? (color||'#fff') : (PAL[ch]||'#f0f'); g.fillRect(x+1,y+1,1,1); }

  let bottom=h-1; while(bottom>0 && !rows[bottom].replace(/\./g,'')) bottom--;

}
function rng(seed){ let s=seed>>>0||1; return ()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0, ((s^s>>>14)>>>0)%10000)/10000); }

function tileCanvas(ch, v, frame){

  const c=document.createElement('canvas'); c.width=c.height=TILE; const g=c.getContext('2d'), R=rng(ch.charCodeAt(0)*977+v*131+(frame||0)*7);

    for(let i=0;i<22;i++) px(R()*16|0,R()*16|0, R()<.5?'#5fae43':'#83cf5c');

    case '=': g.fillStyle='#d4ae78'; g.fillRect(0,0,16,16); for(let i=0;i<14;i++) px(R()*16|0,R()*16|0, R()<.5?'#c49c66':'#e0bd88');

    case '#': { g.fillStyle='#9a8c74'; g.fillRect(0,0,16,16);

    case 'F': g.fillStyle='#b98b5a'; g.fillRect(0,0,16,16); for(let i=0;i<14;i++) px(R()*16|0,R()*16|0,R()<.5?'#a87c4e':'#c99a68'); break;

/* ---------- maps ---------- */
function tileAt(x,y){ const m=RT.map; if(x<0||y<0||x>=m.w||y>=m.h) return 'W'; return m.ground[y][x]||'.'; }
function farmKey(x,y){ return S.map+':'+x+','+y; }
function enterMap(id, x, y){
  RT.mapId=id; RT.map=MAPS[id]; S.map=id; S.x=x; S.y=y; RT.fx=x; RT.fy=y; RT.path=[]; RT.pending=null; RT.moving=false; RT.tileKey=id+x+','+y; RT.navPath=[]; RT.navT=0;
  if(id==='forest') Hooks.placeQiyu();
  Sect.syncLooks();
  const m=RT.map; RT.solid=[...Array(m.h)].map((_,yy)=>[...Array(m.w)].map((_,xx)=>'W~f'.includes(tileAt(xx,yy))));
  RT.ents=[];
  for(const o of m.objects){
    if(o.type==='building'){ for(let yy=o.y;yy<o.y+o.h;yy++) for(let xx=o.x;xx<o.x+o.w;xx++) RT.solid[yy][xx]=true; }
    else if(o.cond && !o.cond(S)) continue;
    else if(o.type==='gather'){ if(S.gathered[id+':'+o.x+','+o.y]===S.day) continue; RT.solid[o.y][o.x]=true; }
    else RT.solid[o.y][o.x]=true;
    RT.ents.push(o);
  }
  spawnBeasts();
  UI.mapName(m.name); UI.miniReset&&UI.miniReset(); Music.play(areaTheme());
}
function spawnBeasts(){
  RT.beasts=[]; const m=RT.map; if(!m.spawns) return;
  const now=S.day*1440+S.min, killed=(S.killed[S.day+':'+RT.mapId]||[]).filter(k=>typeof k==='number'||now-k.t<240).map(k=>typeof k==='number'?k:k.i); let idx=0;
  const R=rng(S.day*31+RT.mapId.length);
  for(const sp of m.spawns){
    for(let k=0;k<sp.n;k++,idx++){
      if(killed.includes(idx)) continue;
      if(sp.minRealm && S.L<sp.minRealm) continue;
      for(let tries=0;tries<40;tries++){
        const x=sp.area[0]+(R()*(sp.area[2]-sp.area[0]+1)|0), y=sp.area[1]+(R()*(sp.area[3]-sp.area[1]+1)|0);
        if(!RT.solid[y][x] && tileAt(x,y)!=='=' && Math.abs(x-S.x)+Math.abs(y-S.y)>5){ RT.beasts.push({kind:sp.kind, idx, x, y, fx:x, fy:y, area:sp.area, t:R()*2, stun:0}); break; }
      }
    }
  }
}
function blockedForWalk(x,y){ if(x<0||y<0||x>=RT.map.w||y>=RT.map.h) return true; return RT.solid[y][x]; }

/* ---------- pathfinding ---------- */
function bfs(sx,sy, goal){ // goal(x,y) → true when reached
  const m=RT.map, prev=new Map(), q=[[sx,sy]], k=(x,y)=>y*m.w+x; prev.set(k(sx,sy),null);
  while(q.length){ const [x,y]=q.shift(); if(goal(x,y)){ const path=[]; let c=k(x,y); while(c!=null && c!==k(sx,sy)){ path.unshift([c%m.w,(c/m.w)|0]); c=prev.get(c); } return path; }
    for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){ const nx=x+dx, ny=y+dy; if(blockedForWalk(nx,ny)||prev.has(k(nx,ny))) continue; prev.set(k(nx,ny),k(x,y)); q.push([nx,ny]); } }
  return null;
}

/* ---------- interaction ---------- */
function entAt(x,y){
  for(const o of RT.ents){
    if(o.type==='building'){ if(x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h) return o; if(o.door&&o.door[0]===x&&o.door[1]===y&&o.act) return o; }
    else if(o.x===x&&o.y===y) return o;
  }
  return null;
}
function setPath(path){ if(!path) return false; if(Math.hypot(RT.fx-S.x,RT.fy-S.y)>0.05) path.unshift([S.x,S.y]); RT.path=path; return true; }
function tapWorld(tx,ty){
  if(RT.paused) return; RT.autoNav=false;
  const o=entAt(tx,ty), isFarm=tileAt(tx,ty)==='F';
  if(S.sel==='rod' && tileAt(tx,ty)==='~'){ goAndDo((x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1, ()=>{ face(tx,ty); Mini.fish(tx,ty); }); return; }
  if(o && (o.act||o.type==='npc'||o.type==='gather'||o.type==='sign'||o.type==='building')){
    const reach=o.type==='building' ? (x,y)=>o.door&&x===o.door[0]&&y===o.door[1] : (x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1;
    goAndDo(reach, ()=>{ face(tx, o.type==='building'?y0(o):ty); interact(o); });
    return;
  }
  if(isFarm){ goAndDo((x,y)=>Math.max(Math.abs(x-tx),Math.abs(y-ty))<=1, ()=>{ face(tx,ty); farmAct(tx,ty); }); return; }
  const path=bfs(S.x,S.y,(x,y)=>x===tx&&y===ty); if(path){ setPath(path); RT.pending=null; }
}
function y0(o){ return o.y+o.h-1; }
function goAndDo(reach, fn){
  if(reach(S.x,S.y)){ RT.path=[]; fn(); return; }
  const path=bfs(S.x,S.y,reach); if(path){ setPath(path); RT.pending=fn; } else UI.toast('过不去');
}
function face(tx,ty){ const dx=tx-S.x, dy=ty-S.y; if(Math.abs(dx)>Math.abs(dy)) RT.dir=dx>0?'right':'left'; else if(dy) RT.dir=dy>0?'down':'up'; }
function facedTile(){ const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[RT.dir]; return [S.x+d[0], S.y+d[1]]; }
function interactFacing(){
  if(RT.prompt){ const p=RT.prompt; if(p.o){ face(p.x,p.y); return interact(p.o); } if(p.fish){ face(p.x,p.y); return Mini.fish(p.x,p.y); } }
  const [x,y]=facedTile(); const o=entAt(x,y);
  if(o){ interact(o); return; }
  if(S.sel==='rod' && tileAt(x,y)==='~'){ Mini.fish(x,y); return; }
  if(tileAt(x,y)==='F') farmAct(x,y); else if(tileAt(S.x,S.y)==='F') farmAct(S.x,S.y);
}
function interact(o){
  if(o.type==='npc') return Story.talk(o.id);
  if(o.type==='gather') return gather(o);
  if(o.type==='sign') return UI.say([['旁白', o.text]]);
  switch(o.act){
    case 'sleep': return UI.confirm('回洞府休息，结束今天？', ()=>sleep(false));
    case 'meditate': return meditate();
    case 'alchemy': return UI.alchemy();
    case 'shop': return UI.shop();
    case 'chest': if(!S.flags.chest){ S.flags.chest=true; addItem('huichun',2); S.stones+=20; Sound.coin(); return UI.say([['旁白','箱子里有云游子留下的两颗回春丹和二十块灵石。']]); }
      return UI.say([['旁白','空空的木箱。']]);
    case 'shrine': return Story.shrine();
    case 'mail': return Mail.open();
    case 'board': return Bounty.open();
    case 'altar': return Sect.altar();
    case 'puppet': return Life.puppetMenu();
    case 'qiyu': return Hooks.qiyu(o);
  }
  if(o.type==='building' && o.label) UI.toast(o.label);
}
function useEnergy(n){ return true; } // energy was retired; kept so older calls still work

function farmAct(x,y){
  const k=farmKey(x,y), p=S.farm[k], sel=S.sel, item=ITEMS[sel];
  if(p&&p.crop&&p.stage>=3){ const c=CROPS[p.crop]; addItem(c.yield[0],c.yield[1]); S.st.harvested++; delete p.crop; p.stage=0; p.days=0; Sound.pick();
    UI.float(x,y,`+${c.yield[1]} ${ITEMS[c.yield[0]].name}`); Story.check(); return; }
  if(sel==='hoe'){ if(p&&p.tilled) return UI.toast('已经翻过土了'); if(!useEnergy(2)) return; S.farm[k]={tilled:1,water:0,stage:0,days:0}; Sound.dig(); return; }
  if(sel==='can'){ if(!p||!p.tilled) return UI.toast('先用锄头翻土'); if(p.water) return UI.toast('今天已经浇过水了'); if(!useEnergy(2)) return; p.water=1; S.st.watered++; Sound.water(); Story.check(); return; }
  if(item&&item.seed){ if(!p||!p.tilled) return UI.toast('先用锄头翻土'); if(p.crop) return UI.toast('这里已经种了'+CROPS[p.crop].name);
    if(!S.inv[sel]) return; addItem(sel,-1); p.crop=item.seed; p.stage=0; p.days=0; S.st.planted++; Sound.dig(); Story.check(); return; }
  if(p&&p.crop) return UI.toast(`${CROPS[p.crop].name}：还要 ${Math.max(1,CROPS[p.crop].days-p.days)} 天${p.water?'':'（今天还没浇水）'}`);
  UI.toast('选择锄头、水壶或种子来照料灵田');
}
function gather(o){
  if(!o.free && !useEnergy(1)) return;
  S.gathered[RT.mapId+':'+o.x+','+o.y]=S.day; RT.ents=RT.ents.filter(e=>e!==o); RT.solid[o.y][o.x]=false;
  const n=o.free?1:1+(Math.random()<.35?1:0); addItem(o.item,n); Sound.pick(); UI.float(o.x,o.y,`+${n} ${ITEMS[o.item].name}`);
  if(!ITEMS[o.item].quest){ S.st.gathered=(S.st.gathered||0)+1; const C=Life.col(), r=C.crops[o.item]=C.crops[o.item]||{n:0}; r.n++; Life.checkSets(); }
  Story.check();
}

/* ---------- cultivation ---------- */
function gainExp(n){
  S.exp+=n; let up=false;
  while(true){
    const need=expNeed(S.L);
    if(S.L===9){ S.exp=Math.min(S.exp,need); break; }
    if(S.L>=12){ S.exp=Math.min(S.exp,need); break; }
    if(S.exp<need) break;
    S.exp-=need; S.L++; up=true;
  }
  if(up){ const st=stats(); S.hp=st.hp; S.mp=st.mp; Sound.levelup(); UI.banner('突破！'+realmName(S.L)); }
  UI.hud(); Story.check();
}
function meditate(){ Med.open(); }  // the 闭关 panel lives in med.js
// the calendar turns over (bed, midnight or a long 闭关); the player stays where they are
function passDay(){
  S.day++;
  for(const k in S.killed) if(!k.startsWith(S.day+':')) delete S.killed[k];
  Hooks.newDay();
}
function sleep(passedOut){
  // going to bed before midnight sleeps through to the next morning; after midnight the day has already turned
  if(S.min>=DAY_START) passDay(); S.min=DAY_START; S.energy=maxEnergy(); const st=stats(); S.hp=st.hp; S.mp=st.mp;
  if(passedOut){ const lost=Math.floor(S.stones*0.1); S.stones-=lost; S.energy=Math.round(maxEnergy()*0.6); }
  for(const k in S.farm){ const p=S.farm[k]; if(p.crop&&p.water){ p.days++; const c=CROPS[p.crop]; p.stage=p.days>=c.days?3:Math.max(1,Math.min(2,Math.floor(p.days/c.days*3))); } p.water=0; }
  enterMap('home', 11, 5); RT.dir='down';
  save();
  UI.dayCard(passedOut);
}

/* ---------- main loop ---------- */
function update(dt){
  RT.t+=dt;
  if(RT.fadeTo){ RT.fade=Math.min(1,RT.fade+dt*4); if(RT.fade>=1){ const f=RT.fadeTo; RT.fadeTo=null; f(); } }
  else if(RT.fade>0) RT.fade=Math.max(0,RT.fade-dt*4);
  if(RT.paused) return;
  // clock
  S.min+=dt/MIN_SEC; if(Math.floor(S.min)%10===0){ UI.clock(); Music.play(areaTheme()); }
  { const st=stats(); if(S.hp<st.hp) S.hp=Math.min(st.hp, S.hp+dt/MIN_SEC*st.hp/240); } // wounds heal over ~4 game hours
  if(S.min>=24*60){ S.min-=24*60; passDay(); UI.toast(`子时已过，第 ${S.day} 天了`); }
  // movement: keys walk freely (diagonals, slide around corners); taps follow a path without stopping per tile
  const kv=keyVector(), want=false;
  RT.running = want && !RT.winded && RT.stamina>0;
  if(RT.running){ RT.stamina=Math.max(0,RT.stamina-26*dt); if(RT.stamina<=0){ RT.winded=true; UI.toast('跑不动了，歇一歇……'); } }
  else { RT.stamina=Math.min(100,RT.stamina+(kv||RT.path.length?16:30)*dt); if(RT.winded&&RT.stamina>=35) RT.winded=false; }
  const SPEED=6;
  if(kv){ RT.path=[]; RT.pending=null; RT.autoNav=false; moveFree(kv[0]*SPEED*dt, kv[1]*SPEED*dt); RT.moving=true; }
  else if(RT.path.length){ followPath(SPEED*dt); RT.moving=true; }
  else RT.moving=false;
  if(RT.moving){ RT.trail=RT.trail||[]; RT.trail.push([RT.fx,RT.fy]); if(RT.trail.length>40) RT.trail.shift(); }
  if(RT.paused) return;
  if(!RT.path.length && RT.pending && !kv){ const f=RT.pending; RT.pending=null; f(); }
  else if(!RT.path.length && RT.autoNav && !kv && !RT.fadeTo) Nav.arrive();
  Nav.tick(dt);
  updateBeasts(dt);
}
function keyVector(){
  if(!RT.keys.length||RT.paused) return null;
  let dx=0, dy=0; for(const k of RT.keys){ if(k==='left') dx--; if(k==='right') dx++; if(k==='up') dy--; if(k==='down') dy++; }
  if(!dx&&!dy) return null; const last=RT.keys[RT.keys.length-1];
  RT.dir = (last==='left'&&dx<0)||(last==='right'&&dx>0)||(last==='up'&&dy<0)||(last==='down'&&dy>0) ? last : (dx? (dx>0?'right':'left') : (dy>0?'down':'up'));
  const n=Math.hypot(dx,dy); return [dx/n, dy/n];
}
function hitsAt(x,y){ // feet hitbox inside the player's tile
  const l=x+0.22, r=x+0.78, top=y+0.5, bot=y+0.96;
  for(const [cx,cy] of [[l,top],[r,top],[l,bot],[r,bot]]) if(blockedForWalk(Math.floor(cx),Math.floor(cy))) return true;
  return false;
}
function moveFree(dx,dy){
  if(dx){ if(!hitsAt(RT.fx+dx,RT.fy)) RT.fx+=dx; else if(!dy){ const c=Math.round(RT.fy), d=c-RT.fy; if(Math.abs(d)<0.5&&Math.abs(d)>0.01&&!hitsAt(RT.fx+dx,c)) RT.fy+=Math.sign(d)*Math.min(Math.abs(d),Math.abs(dx)); } }
  if(dy){ if(!hitsAt(RT.fx,RT.fy+dy)) RT.fy+=dy; else if(!dx){ const c=Math.round(RT.fx), d=c-RT.fx; if(Math.abs(d)<0.5&&Math.abs(d)>0.01&&!hitsAt(c,RT.fy+dy)) RT.fx+=Math.sign(d)*Math.min(Math.abs(d),Math.abs(dy)); } }
  RT.walk+=Math.hypot(dx,dy); onTile();
}
function followPath(dist){
  while(dist>0 && RT.path.length && !RT.paused){
    const [tx,ty]=RT.path[0]; if(blockedForWalk(tx,ty)){ RT.path=[]; RT.pending=null; break; }
    const dx=tx-RT.fx, dy=ty-RT.fy, d=Math.hypot(dx,dy);
    if(Math.abs(dx)>0.01||Math.abs(dy)>0.01){ if(Math.abs(dx)>Math.abs(dy)) RT.dir=dx>0?'right':'left'; else RT.dir=dy>0?'down':'up'; }
    if(d<=dist){ RT.fx=tx; RT.fy=ty; dist-=d; RT.walk+=d; RT.path.shift(); onTile(); }
    else { RT.fx+=dx/d*dist; RT.fy+=dy/d*dist; RT.walk+=dist; dist=0; onTile(); }
  }
}
function onTile(){
  const nx=Math.floor(RT.fx+0.5), ny=Math.floor(RT.fy+0.75), k=RT.mapId+nx+','+ny;
  if(k===RT.tileKey) return; RT.tileKey=k; S.x=nx; S.y=ny;
  const ex=RT.map.exits.find(e=>e.x===S.x&&e.y===S.y);
  if(ex){ RT.path=[]; RT.pending=null; RT.keys=[]; RT.paused=true; RT.fadeTo=()=>{ enterMap(ex.to,ex.tx,ex.ty); RT.paused=false; UI.sync(); save(); Story.check(); if(RT.autoNav) Nav.go(true); }; Sound.step(); }
}
function updateBeasts(dt){
  for(const b of RT.beasts){
    b.stun=Math.max(0,b.stun-dt); b.t-=dt;
    if(b.t<=0 && b.stun<=0){
      const near=Math.abs(b.x-S.x)+Math.abs(b.y-S.y)<=4;
      let opts=[[0,1],[1,0],[0,-1],[-1,0]];
      if(near) opts.sort((a,c)=>(Math.abs(b.x+a[0]-S.x)+Math.abs(b.y+a[1]-S.y))-(Math.abs(b.x+c[0]-S.x)+Math.abs(b.y+c[1]-S.y)));
      else opts.sort(()=>Math.random()-.5);
      for(const [dx,dy] of opts){ const nx=b.x+dx, ny=b.y+dy;
        if(nx<b.area[0]-2||ny<b.area[1]-2||nx>b.area[2]+2||ny>b.area[3]+2) continue;
        if(blockedForWalk(nx,ny)||RT.beasts.some(o=>o!==b&&o.x===nx&&o.y===ny)) continue;
        b.x=nx; b.y=ny; break; }
      b.t=near?0.45:0.8+Math.random()*1.4;
    }
    const sp=(Math.abs(b.x-S.x)+Math.abs(b.y-S.y)<=4?4:2.2)*dt, dx=b.x-b.fx, dy=b.y-b.fy, d=Math.hypot(dx,dy);
    if(d<=sp){ b.fx=b.x; b.fy=b.y; } else { b.fx+=dx/d*sp; b.fy+=dy/d*sp; }
    if(b.stun<=0 && Math.hypot(b.fx-RT.fx,b.fy-RT.fy)<0.7){ startWildBattle(b); return; }
  }
}
function startWildBattle(b){
  RT.path=[]; RT.pending=null; RT.keys=[]; RT.autoNav=false;
  Battle.start(b.kind, result=>{
    if(result==='win'){ Sect.tame(b.kind); const key=S.day+':'+RT.mapId; (S.killed[key]=S.killed[key]||[]).push({i:b.idx, t:S.day*1440+S.min}); RT.beasts=RT.beasts.filter(o=>o!==b); S.st.kills++; S.st.kb=S.st.kb||{}; S.st.kb[b.kind]=(S.st.kb[b.kind]||0)+1; Story.check(); }
    else if(result==='flee'){ b.stun=3; }
    else if(result==='lose'){ UI.say([['旁白','你眼前一黑……醒来时已躺在洞府里。']], ()=>sleep(true)); }
  });
}

/* ---------- rendering ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){
  RT.dpr=Math.min(3,window.devicePixelRatio||1);
  const w=innerWidth, h=innerHeight; cv.width=Math.round(w*RT.dpr); cv.height=Math.round(h*RT.dpr);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  RT.scale=Math.max(2, Math.min(5, Math.floor(Math.min(w,h)/(TILE*11))));
}
addEventListener('resize',resize);
function render(){
  const g=ctx, Z=RT.scale*RT.dpr, m=RT.map; g.imageSmoothingEnabled=false;
  g.fillStyle='#1b2a1c'; g.fillRect(0,0,cv.width,cv.height);
  if(!m) return;
  const vw=cv.width/Z, vh=cv.height/Z;
  // camera
  let cx=RT.fx*TILE+8-vw/2, cy=RT.fy*TILE+8-vh/2;
  cx = m.w*TILE<=vw ? (m.w*TILE-vw)/2 : Math.max(0,Math.min(m.w*TILE-vw,cx));
  cy = m.h*TILE<=vh ? (m.h*TILE-vh)/2 : Math.max(0,Math.min(m.h*TILE-vh,cy));
  RT.cam.x=cx; RT.cam.y=cy;
  const ox=Math.round(-cx*Z), oy=Math.round(-cy*Z), T=TILE*Z;
  const x0=Math.max(0,Math.floor(cx/TILE)), y0=Math.max(0,Math.floor(cy/TILE)), x1=Math.min(m.w-1,Math.ceil((cx+vw)/TILE)), y1=Math.min(m.h-1,Math.ceil((cy+vh)/TILE));
  drawGround(g, ox, oy, T, Z);
  Life.drawGround(g, ox, oy, T, Z);
  // y-sorted drawables
  const list=[];
  for(const o of m.objects===undefined?[]:RT.ents){
    if(o.type==='building') list.push({y:o.y+o.h, draw:()=>{ const c=building(o); g.fillStyle='rgba(20,40,20,.25)'; g.beginPath(); g.ellipse(ox+(o.x+o.w/2)*T, oy+(o.y+o.h)*T-Z, o.w*T*.52, 3*Z, 0, 0, 7); g.fill(); g.drawImage(c, ox+o.x*T, oy+(o.y+o.h)*T-c.height*Z, c.width*Z, c.height*Z); }});
    else if(o.look){ list.push({y:o.y+0.99, draw:()=>{ drawObjShadow(g, {type:'npc',x:o.x,y:o.y}, ox, oy, T, Z); const c=lookSprite(o.look,'down',Math.floor(RT.t*1.5+o.x)%2?0:2); const w=c.width*Z,h=c.height*Z; g.drawImage(c, Math.round(ox+o.x*T+(T-w)/2), Math.round(oy+o.y*T+T-c.bottom*Z), w, h); }}); }
    else { const key=objSprite(o); if(!SPR[key]) continue;
      list.push({y:o.y+0.99, draw:()=>(drawObjShadow(g, o, ox, oy, T, Z), drawSprite(key, ox+o.x*T, oy+o.y*T, Z, o.type==='npc'?Math.sin(RT.t*2+o.x)*0.4:0))}); }
  }
  for(const k in S.farm){ if(!k.startsWith(RT.mapId+':')) continue; const p=S.farm[k]; if(!p.crop) continue;
    const [x,y]=k.split(':')[1].split(',').map(Number); const key=CROPS[p.crop].stages[p.stage];
    list.push({y:y+0.5, draw:()=>{ drawSprite(key, ox+x*T, oy+y*T, Z, 0); if(p.stage>=3){ g.fillStyle='rgba(255,240,150,'+(0.35+0.25*Math.sin(RT.t*4))+')'; g.fillRect(ox+x*T+7*Z, oy+y*T-2*Z, 2*Z, 2*Z); } }}); }
  for(const b of RT.beasts){ list.push({y:b.fy+0.99, draw:()=>{ drawShadow(ox+b.fx*T, oy+b.fy*T, Z); drawSprite(BEASTS[b.kind].spr, ox+b.fx*T, oy+b.fy*T, Z, Math.abs(Math.sin(RT.t*6+b.idx))*-1, b.fx>b.x); }}); }
  list.push({y:RT.fy+0.99, draw:()=>drawPlayer(ox+RT.fx*T, oy+RT.fy*T, Z)});
  if(S.pet){ const tr=RT.trail||[], p=tr.length>16?tr[tr.length-16]:[RT.fx-.9,RT.fy+.1];
    list.push({y:p[1]+0.98, draw:()=>{ drawShadow(ox+p[0]*T, oy+p[1]*T, Z); drawSprite(BEASTS[S.pet.kind].spr, ox+p[0]*T, oy+p[1]*T, Z, RT.moving?-Math.abs(Math.sin(RT.t*9))*1.5:0, p[0]>RT.fx); }}); }
  list.sort((a,b)=>a.y-b.y).forEach(d=>d.draw());
  Nav.drawWorld(g, ox, oy, T, Z);
  drawPrompt(g, ox, oy, T, Z); Mail.drawFlag(g, ox, oy, T, Z);
  // path marker
  if(RT.path.length){ const [tx,ty]=RT.path[RT.path.length-1]; g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=Z; g.strokeRect(ox+tx*T+2*Z, oy+ty*T+2*Z, T-4*Z, T-4*Z); }
  drawNight(g, ox, oy, T, Z);
  drawAtmosphere(g, Z);
  if(RT.stamina<100){ const px=ox+(RT.fx+.95)*T, py=oy+(RT.fy-.15)*T, r=3.2*Z;
    g.lineWidth=1.6*Z; g.strokeStyle='rgba(40,25,10,.6)'; g.beginPath(); g.arc(px,py,r,0,7); g.stroke();
    g.strokeStyle=RT.winded?((Math.floor(RT.t*6)%2)?'#e0402e':'#ff9a7a'):RT.stamina>40?'#7be05a':'#f2c14e'; g.beginPath(); g.arc(px,py,r,-Math.PI/2,-Math.PI/2+Math.PI*2*RT.stamina/100); g.stroke(); }
  Nav.drawArrow(g, ox, oy, T, Z);
  if(RT.fade>0){ g.fillStyle=`rgba(10,8,6,${RT.fade})`; g.fillRect(0,0,cv.width,cv.height); }
}
function drawShadow(x,y,Z){ ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x+8*Z, y+15*Z, 6*Z, 2*Z, 0, 0, 7); ctx.fill(); }
function drawSprite(key, x, y, Z, bob, flip){
  const c=sprite(key); const w=c.width*Z, h=c.height*Z;
  const dx=Math.round(x+(TILE*Z-w)/2), dy=Math.round(y+TILE*Z-c.bottom*Z+(bob||0)*Z);
  if(flip){ ctx.save(); ctx.translate(dx+w,dy); ctx.scale(-1,1); ctx.drawImage(c,0,0,w,h); ctx.restore(); }
  else ctx.drawImage(c,dx,dy,w,h);
}
function drawPlayer(x,y,Z){
  drawShadow(x,y,Z);
  const d=RT.dir==='up'?'up':RT.dir==='down'?'down':'side', f=RT.moving?Math.floor(RT.walk*3.2)%4:0;
  const c=lookSprite(S.look,d,f), w=c.width*Z, h=c.height*Z, bob=(f===1||f===3)?-Z:0;
  const dx=Math.round(x+(TILE*Z-w)/2), dy=Math.round(y+TILE*Z-c.bottom*Z+bob);
  if(RT.dir==='left'){ ctx.save(); ctx.translate(dx+w,dy); ctx.scale(-1,1); ctx.drawImage(c,0,0,w,h); ctx.restore(); } else ctx.drawImage(c,dx,dy,w,h);
  if(S.sel==='rod' && S.inv.rod) drawRod(dx, dy, w, Z);
}
// the fishing rod in hand; while fishing it reaches out over the water with a line and a bobber
function drawRod(dx, dy, w, Z){

   山海问道 · 美术 — the world art.
   Each map's ground is painted once into one picture: patchy grass, paths and ponds with soft wobbly edges,
   sandy shores, deep water, shade under cliffs. Trees are painted with light and shade.
   Every frame adds water glints, drifting cloud shadows, petals / leaves / fireflies and an evening glow.

    const u=tx*tx*(3-2*tx), v=ty*ty*(3-2*ty), a=H(ix,iy,s), b=H(ix+1,iy,s), c=H(ix,iy+1,s), d=H(ix+1,iy+1,s);

  const near=(px,py,r,fn)=>{ for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const x=px+dx,y=py+dy; if(x<0||y<0||x>=W||y>=H) continue; if(fn(type[y*W+x])) return true; } return false; };

    if(t===','){ for(let k=0;k<4;k++){ const x=X+2+R()*12|0, y=Y+2+R()*12|0, fc=['#fff3a8','#f5a3c0','#ffffff','#b9a3f5','#f2c14e'][R()*5|0]; px(x,y+1,'#3f8432'); px(x-1,y,fc); px(x+1,y,fc); px(x,y-1,fc); px(x,y,'#e8b84a'); } }

/* ---------- trees with light and shade ---------- */
function paintTree(kind, seed){
  const R=rng(seed*7919+kind.length), W=kind==='bush'?20:30, Hh=kind==='bush'?16:kind==='pine'?40:38;
  const c=document.createElement('canvas'); c.width=W; c.height=Hh; const g=c.getContext('2d');
  const mask=new Uint8Array(W*Hh), shade=new Float32Array(W*Hh);
  const ball=(cx,cy,r)=>{ for(let y=Math.floor(cy-r);y<=cy+r;y++) for(let x=Math.floor(cx-r);x<=cx+r;x++){ if(x<0||y<0||x>=W||y>=Hh) continue; const dx=x+.5-cx, dy=y+.5-cy, d=Math.hypot(dx,dy)/r; if(d>1) continue;
      const i=y*W+x; const lit=(-dx*.6-dy*.8)/r*.5+.5-d*.25; if(!mask[i]||lit>shade[i]) shade[i]=lit; mask[i]=1; } };
  const leafTones = kind==='pine' ? ['#1d4a32','#285f3e','#33764a','#4a9158','#6aad6a'] : ['#2b5e33','#3a7a3d','#4f9a47','#6cb755','#93d26c'];
  if(kind==='tree'){
    // trunk
    g.fillStyle='#4a2e1a'; g.fillRect(13,24,5,13); g.fillStyle='#6b4428'; g.fillRect(13,24,3,13); g.fillStyle='#8a5a36'; g.fillRect(14,25,1,10);
    g.fillStyle='#4a2e1a'; g.fillRect(11,35,9,2); g.fillRect(10,36,2,1); g.fillRect(19,36,2,1);
    const n=7+R()*3|0; for(let k=0;k<n;k++){ const a=k/n*Math.PI*2, rr=4+R()*3; ball(15+Math.cos(a)*rr*1.1, 13+Math.sin(a)*rr*.85, 6+R()*2.5); } ball(15,12,8);
  } else if(kind==='pine'){
    g.fillStyle='#4a2e1a'; g.fillRect(13,32,4,7); g.fillStyle='#6b4428'; g.fillRect(13,32,2,7);
    for(let k=0;k<4;k++){ const top=3+k*7, bot=top+12, half=4+k*2.6;
      for(let y=top;y<bot;y++){ const w=(y-top)/(bot-top)*half; for(let x=Math.floor(15-w);x<=15+w;x++){ if(x<0||x>=W) continue; const i=y*W+x; const lit=.75-(x-15+w)/(2*w+1)*.6-(y-top)/(bot-top)*.25; if(!mask[i]||lit>shade[i]) shade[i]=lit; mask[i]=1; } } }
  } else {
    ball(7,9,5.5); ball(12,8,6); ball(10,6,4.5);
  }
  // shade the canopy: four tones, a little dither, a dark rim and a few bright leaves
  for(let y=0;y<Hh;y++) for(let x=0;x<W;x++){ const i=y*W+x; if(!mask[i]) continue;
    let s=shade[i]+(ART.hash(x,y,seed)-.5)*.18; const tone=Math.max(0,Math.min(4,Math.floor(s*5)));
    g.fillStyle=leafTones[tone]; g.fillRect(x,y,1,1); }
  g.fillStyle='#16301e'; for(let y=0;y<Hh;y++) for(let x=0;x<W;x++){ const i=y*W+x; if(mask[i]) continue; if((x>0&&mask[i-1])||(x<W-1&&mask[i+1])||(y>0&&mask[i-W])||(y<Hh-1&&mask[i+W])) g.fillRect(x,y,1,1); }
  for(let k=0;k<(kind==='bush'?3:8);k++){ const x=R()*W|0, y=R()*Hh*.5|0; if(mask[y*W+x]&&shade[y*W+x]>.6){ g.fillStyle=leafTones[4]; g.fillRect(x,y,2,1); } }
  if(kind==='tree'&&R()<.5) for(let k=0;k<4;k++){ const x=6+R()*18|0, y=6+R()*14|0; if(mask[y*W+x]){ g.fillStyle=R()<.5?'#f5b3c8':'#fff3c4'; g.fillRect(x,y,1,1); } }  // blossoms
  if(kind==='bush') for(let k=0;k<3;k++){ const x=4+R()*12|0, y=4+R()*6|0; if(mask[y*W+x]){ g.fillStyle='#d8413b'; g.fillRect(x,y,1,1); } }       // berries
  c.bottom=kind==='bush'?Hh-2:Hh-1; return c;
}
for(const kind of ['tree','pine','bush']) for(let v=0;v<3;v++){ SPR[kind+v]=SPR[kind]; SPRC[kind+v]=paintTree(kind, v+1); }
const TREE_KINDS={tree:1,pine:1,bush:1};
function objSprite(o){ const k=o.spr||o.type; return TREE_KINDS[k]? k+((o.x*7+o.y*3)%3) : k; }
function drawObjShadow(g, o, ox, oy, T, Z){
  const k=o.spr||o.type, r={tree:9,pine:7,bush:7,rock:6,well:8,lantern:4,shrine:10,futon:6,furnace:7,chest:6,sign:5,npc:6,gather:0,mailbox:4}[o.type==='npc'?'npc':k]; if(!r) return;

/* ---------- atmosphere ---------- */
const AMB={parts:[], map:null};
function drawAtmosphere(g, Z){
  const w=cv.width, h=cv.height, hr=S.min/60, day=hr>=6&&hr<18.5, night=hr>=19.5||hr<5, t=RT.t;
  if(AMB.map!==RT.mapId){ AMB.map=RT.mapId; AMB.parts=[]; }
  // drifting cloud shadows in daylight
  if(day){ for(let k=0;k<3;k++){ const s=w*.5, x=((t*12*Z*(1+k*.3)+k*w*.7)%(w+s*2))-s, y=h*(.2+k*.3)+Math.sin(t*.1+k)*h*.05;
      const gr=g.createRadialGradient(x,y,0,x,y,s*.6); gr.addColorStop(0,'rgba(20,30,50,.10)'); gr.addColorStop(1,'rgba(20,30,50,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,s*.6,s*.32,0,0,7); g.fill(); } }
  // particles: petals in the village, leaves in the forest, fireflies at night
  const kind = night ? 'firefly' : RT.mapId==='forest' ? 'leaf' : 'petal', want = kind==='firefly'?26:14, P=AMB.parts;
  while(P.length<want) P.push({x:Math.random()*w, y:Math.random()*h, s:Math.random(), k:kind});
  for(const p of P){ if(p.k!==kind){ p.k=kind; }
    if(kind==='firefly'){ p.x+=Math.sin(t*.8+p.s*20)*.4*Z; p.y+=Math.cos(t*.6+p.s*13)*.3*Z; const a=.3+.7*Math.max(0,Math.sin(t*2.2+p.s*30));
      const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,5*Z); gr.addColorStop(0,`rgba(230,255,150,${a*.8})`); gr.addColorStop(1,'rgba(230,255,150,0)'); g.fillStyle=gr; g.fillRect(p.x-5*Z,p.y-5*Z,10*Z,10*Z);
      g.fillStyle=`rgba(255,255,210,${a})`; g.fillRect(p.x-.5*Z,p.y-.5*Z,Z,Z); }
    else { p.y+=(.25+p.s*.3)*Z; p.x+=(Math.sin(t*1.3+p.s*12)*.35-.15)*Z; if(p.y>h+10||p.x<-10){ p.y=-10; p.x=Math.random()*w*1.2; }
      g.save(); g.translate(p.x,p.y); g.rotate(t*(1+p.s)+p.s*9); g.fillStyle=kind==='petal'?`rgba(248,180,200,${.55+p.s*.4})`:`rgba(${120+p.s*90|0},${150+p.s*40|0},60,.8)`;
      g.fillRect(-1.5*Z,-.75*Z,3*Z,1.5*Z); g.restore(); } }
  // evening glow and a soft vignette
  if(hr>=16&&hr<19.5){ const a=hr<18?(hr-16)/2*.16:(19.5-hr)/1.5*.16; g.fillStyle=`rgba(255,140,60,${a})`; g.globalCompositeOperation='soft-light'; g.fillRect(0,0,w,h); g.globalCompositeOperation='source-over';
    g.fillStyle=`rgba(255,170,90,${a*.5})`; g.fillRect(0,0,w,h); }
  if(!AMB.vig||AMB.vig.width!==w||AMB.vig.height!==h){ const v=AMB.vig=document.createElement('canvas'); v.width=w; v.height=h; const vg=v.getContext('2d'), gr=vg.createRadialGradient(w/2,h/2,Math.min(w,h)*.45,w/2,h/2,Math.max(w,h)*.75); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(10,15,10,.28)'); vg.fillStyle=gr; vg.fillRect(0,0,w,h); }
  g.drawImage(AMB.vig,0,0);
}

/* ---------- sound ---------- */
const Sound = (()=>{
  let ac=null;
  const ok=()=>{ if(S&&S.mute) return null; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ return null; } return ac; };
  const tone=(f,dur,type='triangle',vol=.15,slide=0,delay=0)=>{ const a=ok(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02); };
  return { unlock(){ ok(); }, tick(){ tone(880,.04,'square',.04); }, coin(){ tone(988,.08,'square',.06); tone(1319,.15,'square',.06,0,.07); },
    pick(){ tone(660,.08); tone(990,.12,'triangle',.12,0,.06); }, dig(){ tone(160,.12,'sawtooth',.08,.6); }, water(){ tone(500,.25,'sine',.08,.5); },
    step(){ tone(300,.06,'sine',.05); }, hit(){ tone(220,.12,'square',.12,.5); }, hurt(){ tone(140,.2,'sawtooth',.12,.6); },
    magic(){ tone(520,.25,'sine',.12,2); tone(780,.3,'triangle',.08,1.5,.05); }, guard(){ tone(330,.2,'triangle',.1,1.2); },
    levelup(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,0,i*.1)); }, talk(){ tone(600+Math.random()*120,.03,'square',.025); } };
})();

/* ---------- story & quests ---------- */
const Story = {
  quest(){ return QUESTS[S.quest]; },
  check(){
    if(typeof Replay!=='undefined'&&Replay.active) return;
    if(UI.busy()) { Story._pending=true; return; }
    Story._pending=false;
    const q=Story.quest(); if(!q) return;
    if(S.questStarted!==S.quest){ S.questStarted=S.quest; UI.hud(); if(q.start){ UI.say(SCRIPTS[q.start]); return; } }
    if(q.check(S)){
      if(q.id==='sect'&&S.questBack!=null){ S.quest=S.questBack; delete S.questBack; } else S.quest++; UI.hud(); UI.toast('完成：'+q.title); save();
      if(q.done) UI.say(SCRIPTS[q.done]); else Story.check();
    }
  },
  talk(id){
    const q=Story.quest()?.id;
    if(id==='qian'){ if(Story.side('qian', ()=>UI.shop())) return; return Social.menu('qian'); }
    if(id==='tang'||id==='ge'){ if(Story.side(id)) return; return Social.menu(id); }
    if(id==='ahe'){
      if(q==='q3'&&!S.flags.met_ahe) return UI.say(SCRIPTS.ahe_q3);
      if(Story.side('ahe')) return;
      if(S.flags.qiongqi_done&&!S.flags.ahe_gift){ S.flags.ahe_gift=true; return UI.say(SCRIPTS.talk_ahe_after); }
      return Social.menu('ahe');
    }
    if(id==='yunyou'){ if(Story.side('yunyou')) return; return Social.menu('yunyou'); }
    if(Story.side(id)) return;            // sect masters and anyone else: their side quest first,
    if(NPCS[id]) return Social.menu(id);  // then chat / gifts
  },
  shrine(){
    const q=Story.quest()?.id;
    const off=SIDES.find(x=>x.id==='offering'); if(S.side.offering==='active' && sideReady(S,off)) return Story.finishSide(off);
    if(q==='q6'&&!S.flags.qiongqi_done) return UI.say(SCRIPTS.qiongqi_meet);
    if(q==='q8') return UI.say(SCRIPTS.huli_meet);
    UI.say([['旁白', S.flags.huli_friend?'狐祠里飘着淡淡的狐火，暖暖的。':'青丘狐祠。香炉里还有余温。']]);
  }
};

          <span>灵力</span><div class="hpbar mp"><i id="bPmp"></i></div><em id="bPmpT"></em></div>
        <div class="b-acts">${Battle.actsHTML(B)}</div>
      </div>`;
    const c=$('#bEnemy'), sp=B.self?lookSprite(S.look,'down',0):sprite(B.spr); c.width=sp.width; c.height=sp.height; c.getContext('2d').drawImage(sp,0,0);

    if(B.boss && typeof SCENES!=='undefined' && SCENES[kind]) BossBg.start(kind); else Music.play(B.self?'qiongqi':'battle');
    Battle.log(B.self?'另一个你冷冷地看着你。':`${B.name}出现了！`); Battle.ui(); UI.sync();
  },
  intent(){ const s=Battle.s; return s.moves[s.i%s.moves.length]; },
  ui(){
    const s=Battle.s, st=stats();
    $('#bEhp').style.width=Math.max(0,s.hp/s.max*100)+'%';
    $('#bPhp').style.width=Math.max(0,S.hp/st.hp*100)+'%'; $('#bPhpT').textContent=`${Math.max(0,Math.ceil(S.hp))}/${st.hp}`;
    $('#bPmp').style.width=Math.max(0,S.mp/st.mp*100)+'%'; $('#bPmpT').textContent=`${S.mp}/${st.mp}`;
    const it=Battle.intent(), a=s.B.atk;
    const txt={atk:`攻击 · 约 ${Math.max(1,a-st.def)}`, double:`连击 ×2`, charge:'蓄力中……', big:`重击！约 ${Math.round(a*2.4)}（快护体）`, roar:'怒吼（震散灵力）',
      charm:'魅惑（护体可抵挡）', fire:`狐火 · 约 ${Math.round(a*1.6)}`, wind:`风刃 · 约 ${Math.round(a*1.3)}（护体只挡一半）`}[it];

  hitFx(){ const en=$('#bEnemy'); en.classList.remove('hit'); void en.offsetWidth; en.classList.add('hit'); },
  act(a){
    const s=Battle.s; if(!s||s.over||s.busy) return; const st=stats(); s.guard=false;
    if(s.charmed){ s.charmed=false; Battle.log('你被魅惑，心神恍惚，这一回合什么也做不了……'); return Battle.enemyTurn(); }
    if(a==='pill') return Battle.pillMenu();

    else if(a==='sect'){ const sc=SECTS[S.sect]; if(!sc||S.mp<sc.skill.mp) return; S.mp-=sc.skill.mp; Sound.magic();
      if(S.sect==='jian'){ dmg=st.atk*3*Sect.spellMul()*rnd()-def/4; msg='万剑归宗！漫天剑雨倾泻而下！'; BossBg.flash('rgba(170,210,255,.55)'); }
      if(S.sect==='dan'){ dmg=st.atk*1.6*Sect.spellMul()*rnd(); s.burn=3; msg='丹火！敌人被金色的火焰缠住了。'; BossBg.flash('rgba(255,170,60,.45)'); }
      if(S.sect==='shou'){ dmg=(S.pet?st.atk*(1+(S.pet.lv-1)*.15):st.atk)*2.4*rnd()-def/3; msg=S.pet?`兽魂共鸣！${BEASTS[S.pet.kind].name}全力扑了上去！`:'没有灵宠……你学着野兽的样子扑了上去！'; }
      if(S.sect==='tianji'){ const ok=!s.B.boss||Math.random()<.65; dmg=st.atk*1.8*Sect.spellMul()*rnd()-def/4; if(ok){ s.stun=1; msg='定身符！敌人动弹不得。'; } else msg='定身符被一股妖力震碎了！'; BossBg.flash('rgba(200,160,255,.45)'); } }
    else { dmg=st.atk*rnd()-def/2; Sound.hit(); msg='你挥剑斩去。'; }
    const crit=Math.random()<Sect.crit(); if(crit){ dmg*=1.8; msg+=' 暴击！'; }
    dmg=Math.max(1,Math.round(dmg)); s.hp-=dmg; Battle.float((crit?'暴击 ':'')+'-'+dmg, crit?'crit':''); Battle.hitFx();
    if(S.pet && s.hp>0){ const pd=Sect.petAtk(); s.hp-=pd; msg+=` ${BEASTS[S.pet.kind].name}追加攻击 ${pd}。`; setTimeout(()=>Battle.float('-'+pd,'pet'),260); }

  phaseCheck(){ const s=Battle.s, p=s.B.phase2; if(p && !s.phase2 && s.hp>0 && s.hp<=s.max*p.at){ s.phase2=true; s.moves=p.moves; s.i=0;
    BossBg.flash('rgba(255,255,255,.75)'); Music.stinger('boss'); const n=$('#battle .b-name'); if(n) n.classList.add('enraged'); setTimeout(()=>{ if(Battle.s===s) Battle.log(p.line); },500); } },
  pillMenu(){

    if(!pills.length){ Battle.log('身上没有能用的丹药。'); return; }

    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const p=b.dataset.p; Battle.restoreActs(); if(!p) return;
      addItem(p,-1); const st=stats(), heal=Math.round(60*(S.sect==='dan'?1.5:1));

  },
  restoreActs(){ const box=$('#battle .b-acts'); box.innerHTML=Battle.actsHTML(Battle.s.B); box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>Battle.act(b.dataset.a)); Battle.ui(); },
  enemyTurn(){
    const s=Battle.s; s.busy=true; Battle.ui();
    setTimeout(()=>{
      if(Battle.s!==s) return; // battle ended meanwhile
      const st=stats(), it=Battle.intent(), a=s.B.atk; let dmg=0, msg='';
      const hurt=(raw,pierce,guardMul=.35)=>{ let d=Math.max(1,Math.round(raw*(0.9+Math.random()*.2)-(pierce?0:st.def))); if(s.guard) d=Math.max(1,Math.round(d*guardMul)); return d; };

      else {
        if(it==='atk'){ dmg=hurt(a); msg=`${s.B.name}扑了过来！`; }
        if(it==='double'){ dmg=hurt(a*.65)+hurt(a*.65); msg=`${s.B.name}连续抓挠！`; }

        if(it==='big'){ dmg=hurt(a*2.4); msg=s.guard?`${s.B.name}猛扑！被你的护体挡下大半。`:`${s.B.name}全力猛扑！`; if(s.B.boss) BossBg.flash('rgba(255,60,40,.35)'); }
        if(it==='roar'){ S.mp=Math.max(0,S.mp-6); msg=`${s.B.name}一声怒吼，震散了你 6 点灵力！`; }
        if(it==='charm'){ if(s.guard) msg=`${s.B.name}眼波流转……你守住了心神。`; else { s.charmed=true; msg=`${s.B.name}眼波流转……你心神一荡！（下回合无法行动）`; } }
        if(it==='fire'){ dmg=hurt(a*1.6,true); msg='幽蓝的狐火扑面而来！'; if(s.B.boss) BossBg.flash('rgba(120,170,255,.35)'); }
        if(it==='wind'){ dmg=hurt(a*1.3,false,.6); msg='风刃呼啸而来！'; if(s.B.boss) BossBg.flash('rgba(230,240,230,.35)'); }
        s.i++;
      }
      if(dmg){ S.hp-=dmg; Sound.hurt(); $('#battle').classList.remove('shake'); void $('#battle').offsetWidth; $('#battle').classList.add('shake'); Battle.float('-'+dmg,'me'); }
      let tail='';
      if(s.burn>0 && s.hp>0){ const bd=Math.max(1,Math.round(st.atk*.6)); s.hp-=bd; s.burn--; tail=` 丹火灼烧 ${bd}。`; setTimeout(()=>Battle.float('-'+bd,'burn'),200); }
      Battle.log(msg+(dmg?`（-${dmg}）`:'')+tail); s.busy=false; Battle.phaseCheck(); Battle.ui();
      if(s.hp<=0){ s.busy=true; s.dead=true; return setTimeout(()=>Battle.end('win'),500); }
      if(S.hp<=0){ S.hp=0; setTimeout(()=>Battle.end('lose'),600); }
    },650);
  },
  end(result){
    const s=Battle.s; if(!s||s.over) return; s.over=true; const B=s.B; const lines=[];
    if(result==='win'){
      S.seen[s.kind]=2; Music.stinger('win');
      const stones=Math.round((B.stones[0]+Math.floor(Math.random()*(B.stones[1]-B.stones[0]+1)))*Sect.stoneMul()); S.stones+=stones; Sound.coin();
      lines.push(`击败了${B.name}！`, `修为 +${B.exp}`); if(stones) lines.push(`灵石 +${stones}`);
      if(B.drop&&Math.random()<B.drop[1]){ addItem(B.drop[0]); lines.push(`获得 ${ITEMS[B.drop[0]].name}`); }
      if(S.pet&&!B.self) Sect.petXp();
    }
    const el=$('#battle');
    if(result==='win'){
      el.querySelector('.b-panel').innerHTML=`<div class="b-result"><b>胜利</b>${lines.slice(1).map(l=>`<span>${l}</span>`).join('')}<button class="btn main" id="bOk">继续</button></div>`;
      $('#bOk').onclick=()=>{ Battle.close(); if(B.exp) gainExp(B.exp); s.cb&&s.cb('win'); };
      $('#bEnemy').classList.add('gone');
    } else { if(result==='lose'){ const st=stats(); S.hp=Math.round(st.hp*.5); } Battle.close(); s.cb&&s.cb(result); }
  },
  close(){ $('#battle').hidden=true; Battle.s=null; BossBg.stop(); Music.play(areaTheme()); UI.sync(); UI.hud(); }
};

  /* dialogue runner */
  say(steps, cb){ UI.dlgQ={steps:[...steps], i:0, cb}; $('#dlg').hidden=false; UI.sync(); UI.next(); },
  next(){
    const q=UI.dlgQ; if(!q) return;
    while(q.i<q.steps.length){
      const st=q.steps[q.i++];
      if(Array.isArray(st)) return UI.line(st[0],st[1]);
      if(CG.replaying && (st.give||st.love||st.flag||st.exp||st.stones)) continue;
      if(st.cg){ CG.open(st.cg, st.who, st.title); continue; }
      if(st.face){ CG.setFace(st.face); continue; }
      if(st.cgscene){ CG.setScene(st.cgscene); continue; }
      if(st.cgend){ CG.close(); CG.replaying=false; continue; }
      if(st.love){ for(const k in st.love) Social.add(k, st.love[k]); Sound.pick(); continue; }
      if(st.give||st.stones||st.exp){
        const got=[]; let s2=st;
        while(true){
          if(s2.give){ for(const k in s2.give){ addItem(k,s2.give[k]); got.push(`${ITEMS[k].name} ×${s2.give[k]}`); } }
          if(s2.stones){ S.stones+=s2.stones; got.push(`灵石 ×${s2.stones}`); }
          if(s2.exp){ gainExp(s2.exp); got.push(`修为 +${s2.exp}`); }
          const nx=q.steps[q.i]; if(nx&&!Array.isArray(nx)&&(nx.give||nx.stones||nx.exp)&&!CG.replaying){ s2=nx; q.i++; } else break;
        }
        Sound.coin(); UI.hud(); return UI.line('获得', '✦ '+got.join('　✦ '));
      }
      if(st.flag){ S.flags[st.flag]=true; continue; }
      if(st.run){ if(!CG.replaying) st.run(); continue; }
      if(st.go){ q.steps=[...SCRIPTS[st.go]]; q.i=0; continue; }
      if(st.end){ q.i=q.steps.length; break; }
      if(st.roottest){ $('#dlg').hidden=true; Sect.rootTest(()=>{ $('#dlg').hidden=false; UI.sync(); UI.next(); }); return; }
      if(st.cine){ $('#dlg').hidden=true; Cine.play(st.cine, ()=>{ $('#dlg').hidden=false; UI.sync(); UI.next(); }); return; }
      if(st.choice) return UI.choice(st);
      if(st.battle){ const after=st; $('#dlg').hidden=true; UI.dlgQ=null; Battle.start(st.battle, r=>{ const id=r==='win'?after.win:after.lose; const fin=()=>{ if(r==='lose') sleep(true); q.cb&&q.cb(); }; if(id) UI.say(SCRIPTS[id], fin); else fin(); }); return; }
    }
    UI.closeDlg(true);
  },

  onKey(e){
    if(!$('#dlg').hidden && (e.code==='Space'||e.code==='Enter'||e.code==='KeyE')){ e.preventDefault(); const d=$('#dlg'); if(d.onclick) d.onclick(); return true; }

function sideCountNow(s,c){ s.st.kb=s.st.kb||{}; s.st.crafted=s.st.crafted||{};
  return c.type==='meditated'?s.st.meditated:c.type==='kill'?(s.st.kb[c.key]||0):c.type==='killall'?s.st.kills:c.type==='grade'?(s.st.topGrade||0):c.type==='pet'?(s.pet?1:0):(s.st.crafted[c.key]||0); }
function sideProgress(s,q){
  if(q.need) return Object.entries(q.need).map(([k,n])=>`${ITEMS[k].name} ${Math.min(count(s,k),n)}/${n}`).join(' · ');
  if(q.count){ const c=q.count, done=sideCountNow(s,c)-(s.side[q.id+'_base']||0);
    const label={meditated:'打坐',killall:'击败妖兽',grade:'上品丹',pet:'收服灵宠'}[c.type]||(c.type==='kill'?'击败'+BEASTS[c.key].name:'炼成'+ITEMS[c.key].name);
    return `${label} ${Math.min(c.n,done)}/${c.n}`; }
  return '';
}
function sideReady(s,q){
  if(q.need) return Object.entries(q.need).every(([k,n])=>count(s,k)>=n);
  if(q.count) return sideCountNow(s,q.count)-(s.side[q.id+'_base']||0)>=q.count.n;
  return false;
}

/* ---------- friendship ---------- */
const Social = {
  rel(id){ S.rel=S.rel||{}; return S.rel[id]=S.rel[id]||{pts:0, talked:0, gifted:0, known:{}, ev:{}}; },
  hearts(id){ return Math.min(10, Math.floor(Social.rel(id).pts/100)); },
  tier(id){ const h=Social.hearts(id); return h>=6?3:h>=4?2:h>=2?1:0; },
  add(id,n){ const r=Social.rel(id), before=Social.hearts(id); r.pts=Math.max(0,Math.min(1000,r.pts+n)); const after=Social.hearts(id);
    if(after>before) UI.toast(`${NPCS[id].name} 好感 ${'♥'.repeat(after)}`); },
  menu(id){
    const n=NPCS[id]; if(!n) return;
    const opts=[];
    if(id==='qian') opts.push({text:'买卖', fn:()=>UI.shop()});
    if(id==='yunyou') opts.push({text:'请教', fn:()=>{ const q=Story.quest(); UI.say(q&&q.id!=='end'?[['云游子','眼下要做的事——'+q.title+'：'+q.desc]]:SCRIPTS.talk_yunyou); }});
    opts.push({text:'聊天', fn:()=>Social.chat(id)},{text:'送礼', fn:()=>Social.giftPick(id)},{text:'离开', fn:()=>{}});
    UI.say([{choice:`${n.name}　${'♥'.repeat(Social.hearts(id))}${'♡'.repeat(Math.max(0,(n.romance?10:8)-Social.hearts(id)))}${Social.rel(id).gifted===S.day?'　（今天已送过礼）':''}`, options:opts}]);
  },
  chat(id){
    const r=Social.rel(id), n=NPCS[id], h=Social.hearts(id);
    const ev=HEART_EVENTS[id]; if(ev) for(const lv of [2,4]) if(h>=lv && !r.ev[lv]){ r.ev[lv]=true; Sound.levelup(); UI.say(ev[lv]); return; }
    let pool=TALK[id][Social.tier(id)];
    if(id==='tang'&&S.flags.tang_sect) pool=pool.concat(S.sect==='dan'?['{名}，我们是同门呢！药尘长老说，你的火候比我稳。','今天长老教我认了三十种灵药，你要不要听我背一遍？']:['药王谷的功课好多……不过我很开心！','你在宗门里过得好吗？要是受了伤，记得来找我。']);
    const line=pool[Math.floor(Math.random()*pool.length)];
    if(r.talked!==S.day){ r.talked=S.day; Social.add(id,20); }
    UI.say([[n.name,line]]);
  },
  giftPick(id){
    const r=Social.rel(id), n=NPCS[id];
    if(r.gifted===S.day) return UI.say([[n.name,'今天已经收过你的礼物啦。']]);
    const ids=Object.keys(S.inv).filter(k=>S.inv[k]>0&&!ITEMS[k].tool&&k!=='slip');
    UI.panel(`送礼给 ${n.name}`, ids.length?`<p class="muted">每人每天可以送一份礼物。送过的礼物，会记下对方的喜好。</p><div class="grid">${ids.map(k=>`<button class="cell" data-g="${k}" aria-label="${ITEMS[k].name}">${itemIcon(k)}<b>${S.inv[k]}</b>${r.known[k]?`<i class="pref ${r.known[k]}">${{love:'最爱',like:'喜欢',neutral:'一般',hate:'讨厌'}[r.known[k]]}</i>`:''}</button>`).join('')}</div>`:'<p class="muted">行囊里没有可以送的东西。</p>', b=>{
      b.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{ UI.closePanel(); Social.give(id,x.dataset.g); }); });
  },
  give(id,item){
    const r=Social.rel(id), n=NPCS[id];
    const kind=n.loves.includes(item)?'love':n.likes.includes(item)?'like':n.hates.includes(item)?'hate':'neutral';
    if(item==='chicken'&&S.side.chick==='active'&&id==='ahe') return Story.side('ahe');
    addItem(item,-1); r.gifted=S.day; r.known[item]=kind;
    Social.add(id,{love:80,like:45,neutral:20,hate:-30}[kind]); Sound[kind==='hate'?'hurt':'coin']();
    UI.say([[n.name,GIFT_LINES[kind][id]]]);
  },
};

/* ---------- ink-wash painter ---------- */
const Ink = {
  layers:{},
  bake(kind, w, h){
    const key=kind+w+'x'+h; if(Ink.layers[key]) return Ink.layers[key];
    const sc=SCENES[kind], c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
    const sky=g.createLinearGradient(0,0,0,h); sc.sky.forEach((col,i)=>sky.addColorStop(i/(sc.sky.length-1),col)); g.fillStyle=sky; g.fillRect(0,0,w,h);
    // moon with a soft halo
    const mx=w*.72, my=h*.2, mr=Math.min(w,h)*.08, halo=g.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);
    halo.addColorStop(0,sc.moon+'88'); halo.addColorStop(1,sc.moon+'00'); g.fillStyle=halo; g.fillRect(0,0,w,h);
    g.fillStyle=sc.moon; g.beginPath(); g.arc(mx,my,mr,0,7); g.fill();
    // mountain ridges, back to front, painted with several soft passes like a wet brush
    const R=rng(kind.length*977+13);
    sc.hills.forEach((col,li)=>{
      const base=h*(.42+li*.13), amp=h*(.16-li*.025), f1=1.5+R()*2, f2=4+R()*5, ph=R()*9;
      const ridge=x=>base-amp*(.55*Math.sin(x/w*Math.PI*f1+ph)+.3*Math.sin(x/w*Math.PI*f2+ph*2)+.15*Math.sin(x/w*Math.PI*17+ph));
      for(let pass=0;pass<5;pass++){
        g.globalAlpha=pass===4?1:.18; g.fillStyle=col; g.beginPath(); g.moveTo(0,h);
        for(let x=0;x<=w;x+=4) g.lineTo(x, ridge(x)+(4-pass)*3*(R()-.3));
        g.lineTo(w,h); g.closePath(); g.fill();
      }
      g.globalAlpha=1;
      // mist at the foot of each ridge
      const mist=g.createLinearGradient(0,base-amp*.2,0,base+h*.12); mist.addColorStop(0,'rgba(255,255,255,0)'); mist.addColorStop(.6,`rgba(230,230,225,${.10+li*.03})`); mist.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=mist; g.fillRect(0,base-amp*.2,w,h*.3);
      // a few ink pines on the nearer ridges
      if(li>=2) for(let i=0;i<7;i++){ const x=R()*w, y=ridge(x); g.fillStyle=sc.ink; g.globalAlpha=.75;
        for(let k=0;k<4;k++){ g.beginPath(); g.ellipse(x+(R()-.5)*6, y-6-k*7, 10-k*2, 3.5, (R()-.5)*.3, 0, 7); g.fill(); } g.fillRect(x-1,y-6,2,10); g.globalAlpha=1; }
    });
    // paper grain
    for(let i=0;i<w*h/90;i++){ g.fillStyle=`rgba(255,255,255,${R()*.035})`; g.fillRect(R()*w,R()*h,1+R()*2,1); }
    return Ink.layers[key]=c;
  },
  parts:[],
  frame(cv, kind, t, dt){
    const g=cv.getContext('2d'), w=cv.width, h=cv.height, sc=SCENES[kind];
    g.drawImage(Ink.bake(kind,w,h),0,0);
    // drifting mist bands
    for(let i=0;i<3;i++){ const y=h*(.5+i*.14), x=((t*14*(i+1))%(w*1.6))-w*.3; const m=g.createRadialGradient(x,y,0,x,y,w*.35);
      m.addColorStop(0,'rgba(240,240,235,.10)'); m.addColorStop(1,'rgba(240,240,235,0)'); g.fillStyle=m; g.fillRect(0,0,w,h); }
    // particles
    const P=Ink.parts, want=sc.fx==='wind'?40:sc.fx==='foxfire'?34:50;
    while(P.length<want) P.push({x:Math.random()*w, y:Math.random()*h, v:.5+Math.random(), s:Math.random(), life:Math.random()});
    for(const p of P){
      if(sc.fx==='wind'){ p.x+=dt*w*.9*p.v; p.y+=Math.sin(t*2+p.s*9)*dt*20; if(p.x>w+60){ p.x=-60; p.y=Math.random()*h; }
        g.strokeStyle=`rgba(240,240,230,${.12+.2*p.s})`; g.lineWidth=1+p.s*1.5; g.beginPath(); g.moveTo(p.x,p.y); g.quadraticCurveTo(p.x-30,p.y-6,p.x-70*p.v,p.y+2); g.stroke(); }
      if(sc.fx==='foxfire'){ p.y-=dt*h*.05*p.v; p.x+=Math.sin(t*1.5+p.s*7)*dt*14; if(p.y<-20){ p.y=h+10; p.x=Math.random()*w; }
        const r=3+p.s*5, gl=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4); gl.addColorStop(0,p.s>.5?'rgba(140,200,255,.85)':'rgba(255,180,220,.7)'); gl.addColorStop(1,'rgba(120,160,255,0)');
        g.fillStyle=gl; g.fillRect(p.x-r*4,p.y-r*4,r*8,r*8); }
      if(sc.fx==='embers'){ p.y-=dt*h*.12*p.v; p.x+=Math.sin(t*3+p.s*5)*dt*30; if(p.y<-10){ p.y=h+10; p.x=Math.random()*w; }
        g.fillStyle=`rgba(255,${120+p.s*100|0},40,${.4+.5*Math.abs(Math.sin(t*4+p.s*9))})`; g.fillRect(p.x,p.y,2+p.s*2,2+p.s*2); }
    }
    if(sc.fx==='wind'&&Math.sin(t*.7)>.985){ g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(0,0,w,h); }
  },
};

/* ============================================================
   山海问道 · 躲弹幕 — turn-based fights where the enemy's turn is a few seconds of dodging.

const Dodge = {
  auto:false,   // the self-test plays fast: no dodging, one hit
  on(s){ return !!(s && DODGE[s.kind] && !S.dodgeOff); },
  pattern(s){ const it=Battle.intent(); return DODGE[s.kind] && DODGE[s.kind][it] ? DODGE[s.kind][it] : null; },
  perHit(s,pat){ const st=stats(); let d=Math.max(1,Math.round(s.B.atk*pat.hit-st.def*.5)); if(s.guard) d=Math.max(1,Math.round(d*.5)); return d; },
  run(pat, s, done){
    if(Dodge.auto) return setTimeout(()=>done(1),60);
    const m=(s.phase2?1.22:1)*(s.guard?.8:1);
    const ov=document.createElement('div'); ov.className='dodge';
    ov.innerHTML=`<div class="dg-head"><b>${pat.name}</b><span>${FINE_POINTER?'WASD / 方向键 移动灵珠':'按住屏幕任意处拖动灵珠'}${s.guard?'　·　护体：弹幕变慢、伤害减半':''}</span></div><canvas></canvas><div class="dg-time"><i></i></div>`;
    $('#battle').appendChild(ov);
    const cv2=ov.querySelector('canvas'), g=cv2.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
    const L=Math.min(320, innerWidth*.84, innerHeight*.42); cv2.style.width=cv2.style.height=L+'px'; cv2.width=cv2.height=Math.round(L*dpr);
    const K=cv2.width/100;
    const P={ me:{x:50,y:70}, list:[], timers:{}, fired:{}, hits:0, inv:0, flash:0,
      add(b){ b.t=0; P.list.push(b); },
      every(id,iv,fn){ P.timers[id]=(P.timers[id]??iv*.5)-P.dt; if(P.timers[id]<=0){ P.timers[id]+=iv; fn(); } },
      once(id,cond,fn){ if(cond&&!P.fired[id]){ P.fired[id]=1; fn(); } } };
    const keys={}; const kd=e=>{ const k={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'}[e.code]; if(k){ keys[k]=1; e.preventDefault(); e.stopPropagation(); } };
    const ku=e=>{ const k={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'}[e.code]; if(k) keys[k]=0; };
    addEventListener('keydown',kd,true); addEventListener('keyup',ku);
    // touch: drag anywhere on the overlay; the bead follows the finger's movement (not its position) so it stays visible
    let drag=null; const scale=100/L*1.15;
    ov.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; ov.setPointerCapture(e.pointerId); e.preventDefault(); });
    ov.addEventListener('pointermove',e=>{ if(!drag) return; P.me.x+=(e.clientX-drag.x)*scale; P.me.y+=(e.clientY-drag.y)*scale; drag={x:e.clientX,y:e.clientY}; });

    const kd=e=>{ if(e.code==='Space'||e.code==='KeyE'){ e.preventDefault(); set(true); } }, ku=e=>{ if(e.code==='Space'||e.code==='KeyE') set(false); };

  /* ---------- 炼丹：keep the heat inside the moving sweet spot ---------- */
  alchemy(recipe, done){

      <button class="btn main big" id="alcBtn">鼓风（按住）</button></div>`);
    let h=.3, v=0, t=-1.2, inside=0, holding=false; const unbind=Mini.hold($('#alcBtn'), x=>holding=x);
    Mini.run(dt=>{
      t+=dt; v+=(holding?1.5:-1.05)*dt; v*=.92; h=Math.max(0,Math.min(1,h+v*dt*2.2)); if(h===0||h===1) v=0;
      const c=.5+.22*Math.sin(t*.95)+.06*Math.sin(t*2.3);

      $('#alcZone').style.bottom=((c-wide)*100)+'%'; $('#alcZone').style.height=(wide*200)+'%';
      $('#alcNeedle').style.bottom=(h*100)+'%'; $('#alcFlame').style.transform=`scale(${.5+h*.9})`; $('#alcFlame').style.opacity=.5+h*.5;
      $('#alcProg').style.width=Math.max(0,t/total*100)+'%';
      if(t<0) $('#alcTip').textContent='准备……';
      else if(Math.abs(h-c)<wide) $('#alcTip').textContent='火候正好！'; else $('#alcTip').textContent=h>c?'火太旺了！':'火太弱了！';
      if(t>=total){ unbind(); Mini.stop(); const r=inside/total, grade=r>=.58?'top':r>=.35?'mid':r>=.15?'low':'fail';
