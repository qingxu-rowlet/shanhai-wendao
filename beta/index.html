/* ============================================================
   山海问道 · 躲弹幕 — turn-based fights where the enemy's turn is a few seconds of dodging.
   You still choose 剑击 / 御剑术 / 护体 / 丹药 on your turn; on the enemy's turn a box opens and you steer
   your 灵珠 (jade bead) through its attack pattern. Every hit costs a little life; a clean dodge costs nothing.
   护体 slows the bullets and halves the damage. Keyboard: WASD / arrows. Touch: drag anywhere.
   Beasts opt in with a DODGE table (穷奇 first); settings can switch back to classic turns.
   ============================================================ */
// box coordinates are 0..100 in both directions
const DODGE = {
  qiongqi:{
    atk:   {name:'羽刃散射', hit:.45, dur:4.2, spawn(P,t,dt,m){ P.every('f',.2/m,()=>P.add({k:'feather', x:5+Math.random()*90, y:-4, vx:(Math.random()-.5)*12, vy:(34+Math.random()*16)*m, r:2.2})); }},
    double:{name:'双爪撕裂', hit:.7, dur:4.4, spawn(P,t,dt,m){ for(const at of m>1?[.3,1.3,2.3,3.2]:[.3,1.6,2.9]) P.once('c'+at,t>=at,()=>{ const a=Math.random()*Math.PI;
        for(const off of [-9,9]) P.add({k:'slash', cx:P.me.x+Math.cos(a+Math.PI/2)*off, cy:P.me.y+Math.sin(a+Math.PI/2)*off, a, w:6, warn:.75/m, act:.22}); });
      P.every('f',.6/m,()=>P.add({k:'feather', x:Math.random()*100, y:-4, vx:0, vy:30*m, r:2})); }},
    big:   {name:'猛扑', hit:1.3, dur:4.6, spawn(P,t,dt,m){
      P.once('h',t>=.3,()=>P.add({k:'band', dir:'h', at:P.me.y, w:26, warn:1/m, act:.35}));
      P.once('v',t>=1.9,()=>P.add({k:'band', dir:'v', at:P.me.x, w:26, warn:.9/m, act:.35}));
      if(m>1) P.once('x',t>=3.2,()=>{ P.add({k:'band', dir:'h', at:P.me.y, w:20, warn:.8, act:.3}); P.add({k:'band', dir:'v', at:P.me.x, w:20, warn:.8, act:.3}); });
      P.every('f',.5/m,()=>P.add({k:'feather', x:Math.random()*100, y:-4, vx:0, vy:28*m, r:2})); }},
    wind:  {name:'风刃', hit:.5, dur:4.6, spawn(P,t,dt,m){ P.every('w',.95/m,()=>{ const left=Math.random()<.5, gap=12+Math.random()*76;
        for(let y=4;y<100;y+=8) if(Math.abs(y-gap)>13) P.add({k:'blade', x:left?-6:106, y, vx:(left?1:-1)*44*m, vy:0, r:2.6}); }); }},
    roar:  {name:'怒吼', hit:.5, mp:4, dur:4.4, spawn(P,t,dt,m){ P.every('r',1.15/m,()=>P.add({k:'ring', cx:50, cy:50, R:2, vr:34*m, gap:Math.random()*Math.PI*2, gw:1.0, th:3})); }},
  },
};
const Dodge = {
  auto:false,   // the self-test plays fast: no dodging, one hit
  on(s){ return !!(s && DODGE[s.kind] && !S.dodgeOff); },
  pattern(s){ const it=Battle.intent(); return DODGE[s.kind] && DODGE[s.kind][it] ? DODGE[s.kind][it] : null; },
  perHit(s,pat){ const st=stats(); let d=Math.max(1,Math.round(s.B.atk*pat.hit-st.def*.5)); if(s.guard) d=Math.max(1,Math.round(d*.5)); return d; },
  run(pat, s, done){
    if(Dodge.auto) return setTimeout(()=>done(1),60);
    const m=(s.phase2?1.22:1)*(s.guard?.8:1);
    const ov=document.createElement('div'); ov.className='dodge';
    ov.innerHTML=`<div class="dg-head"><b>${pat.name}</b><span>${FINE_POINTER?'WASD / 方向键 移动灵珠':'按住屏幕任意处拖动灵珠'}${s.guard?'　·　护体：弹幕变慢、伤害减半':''}</span></div><canvas></canvas><div class="dg-time"><i></i></div>`;
    $('#battle').appendChild(ov);
    const cv2=ov.querySelector('canvas'), g=cv2.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
    const L=Math.min(320, innerWidth*.84, innerHeight*.42); cv2.style.width=cv2.style.height=L+'px'; cv2.width=cv2.height=Math.round(L*dpr);
    const K=cv2.width/100;
    const P={ me:{x:50,y:70}, list:[], timers:{}, fired:{}, hits:0, inv:0, flash:0,
      add(b){ b.t=0; P.list.push(b); },
      every(id,iv,fn){ P.timers[id]=(P.timers[id]??iv*.5)-P.dt; if(P.timers[id]<=0){ P.timers[id]+=iv; fn(); } },
      once(id,cond,fn){ if(cond&&!P.fired[id]){ P.fired[id]=1; fn(); } } };
    const keys={}; const kd=e=>{ const k={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'}[e.code]; if(k){ keys[k]=1; e.preventDefault(); e.stopPropagation(); } };
    const ku=e=>{ const k={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'}[e.code]; if(k) keys[k]=0; };
    addEventListener('keydown',kd,true); addEventListener('keyup',ku);
    // touch: drag anywhere on the overlay; the bead follows the finger's movement (not its position) so it stays visible
    let drag=null; const scale=100/L*1.15;
    ov.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; ov.setPointerCapture(e.pointerId); e.preventDefault(); });
    ov.addEventListener('pointermove',e=>{ if(!drag) return; P.me.x+=(e.clientX-drag.x)*scale; P.me.y+=(e.clientY-drag.y)*scale; drag={x:e.clientX,y:e.clientY}; });
    ov.addEventListener('pointerup',()=>drag=null); ov.addEventListener('pointercancel',()=>drag=null);
    const MD=Dodge.mods?Dodge.mods():{speed:1,inv:0,r:1,dur:1}, R=3.2*MD.r, SPEED=58*MD.speed, DUR=pat.dur*MD.dur; let t=0, last=performance.now(), ended=false;
    const segDist=(px,py,b)=>{ const dx=Math.cos(b.a), dy=Math.sin(b.a), qx=px-b.cx, qy=py-b.cy; return Math.abs(qx*dy-qy*dx); };
    const hitTest=b=>{
      if(b.k==='feather'||b.k==='blade'||b.k==='orbit'||b.k==='fruit'||b.k==='ember'||b.k==='stone') return b.x!==undefined&&Math.hypot(P.me.x-b.x,P.me.y-b.y)<R+b.r-.6;
      if(b.k==='slash') return b.t>b.warn && segDist(P.me.x,P.me.y,b)<b.w/2+R*.6;
      if(b.k==='band') return b.t>b.warn && Math.abs((b.dir==='h'?P.me.y:P.me.x)-b.at)<b.w/2+R*.4;
      if(b.k==='ring'){ const d=Math.hypot(P.me.x-b.cx,P.me.y-b.cy); if(Math.abs(d-b.R)>b.th+R*.6) return false;
        let ang=Math.atan2(P.me.y-b.cy,P.me.x-b.cx)-b.gap; ang=Math.atan2(Math.sin(ang),Math.cos(ang)); return Math.abs(ang)>b.gw/2; }
      return false; };
    const step=now=>{ try{ stepIn(now); }catch(e){ console.error('dodge',e); if(!ended){ P.hits=0; finish(); } } };
    const stepIn=now=>{
      if(ended) return; const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt; P.dt=dt;
      if(Battle.s!==s){ finish(); return; }
      // move
      const vx=(keys.r?1:0)-(keys.l?1:0), vy=(keys.d?1:0)-(keys.u?1:0), n=Math.hypot(vx,vy)||1;
      P.me.x+=vx/n*SPEED*dt; P.me.y+=vy/n*SPEED*dt; P.me.x=Math.max(R,Math.min(100-R,P.me.x)); P.me.y=Math.max(R,Math.min(100-R,P.me.y));
      if(pat.pull){ const dx=50-P.me.x, dy=50-P.me.y, d=Math.hypot(dx,dy)||1; if(d>2){ P.me.x+=dx/d*pat.pull*m*dt; P.me.y+=dy/d*pat.pull*m*dt; } }
      if(t<DUR-.5) pat.spawn(P,t,dt,m);
      for(const b of P.list){ b.t+=dt;
        if(b.vx!==undefined){ if(b.ay) b.vy+=b.ay*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }
        if(b.k==='ring') b.R+=b.vr*dt;
        if(b.k==='orbit'){ b.a+=b.va*dt; b.R+=b.vr*dt; b.x=50+Math.cos(b.a)*b.R; b.y=50+Math.sin(b.a)*b.R; }
        if(P.inv<=0 && hitTest(b)){ P.hits++; P.inv=.7+MD.inv; P.flash=.25; Sound.hurt(); ov.classList.remove('hurt'); void ov.offsetWidth; ov.classList.add('hurt'); } }
      P.list=P.list.filter(b=>{ if(b.k==='slash'||b.k==='band') return b.t<b.warn+b.act; if(b.k==='ring') return b.R<80; if(b.k==='orbit') return b.R>3; return b.x>-10&&b.x<110&&b.y>-10&&b.y<110; });
      P.inv-=dt; P.flash-=dt;
      draw(); ov.querySelector('.dg-time i').style.width=Math.max(0,100-t/DUR*100)+'%';
      if(t>=DUR) return finish();
      requestAnimationFrame(step);
    };
    const draw=()=>{
      g.setTransform(K,0,0,K,0,0); g.fillStyle='#0d1018'; g.fillRect(0,0,100,100);
      g.strokeStyle='rgba(255,255,255,.04)'; g.lineWidth=.3; for(let i=10;i<100;i+=10){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,100); g.moveTo(0,i); g.lineTo(100,i); g.stroke(); }
      for(const b of P.list){
        if(b.k==='feather'){ const a=Math.atan2(b.vy,b.vx); g.save(); g.translate(b.x,b.y); g.rotate(a); g.fillStyle='#e8f2ff'; g.beginPath(); g.ellipse(0,0,4.2,1.5,0,0,7); g.fill(); g.fillStyle='#7fb2e8'; g.beginPath(); g.ellipse(2.6,0,1.6,1.1,0,0,7); g.fill(); g.restore(); }
        if(b.k==='blade'){ g.save(); g.translate(b.x,b.y); g.rotate(b.vx>0?0:Math.PI); g.strokeStyle='#c8f2d8'; g.lineWidth=1.4; g.beginPath(); g.arc(-1,0,3.2,-1.1,1.1); g.stroke(); g.strokeStyle='rgba(200,242,216,.35)'; g.lineWidth=.8; g.beginPath(); g.arc(-3.5,0,3.2,-1,1); g.stroke(); g.restore(); }
        if(b.k==='slash'){ const live=b.t>b.warn, dx=Math.cos(b.a)*150, dy=Math.sin(b.a)*150;
          g.strokeStyle=live?'#ffe6e0':`rgba(255,70,50,${.25+.35*Math.abs(Math.sin(b.t*18))})`; g.lineWidth=live?b.w:.8; g.lineCap='round';
          g.beginPath(); g.moveTo(b.cx-dx,b.cy-dy); g.lineTo(b.cx+dx,b.cy+dy); g.stroke(); if(live){ g.strokeStyle='rgba(255,90,60,.5)'; g.lineWidth=b.w*1.6; g.globalAlpha=.3; g.stroke(); g.globalAlpha=1; } }
        if(b.k==='band'){ const live=b.t>b.warn; g.fillStyle=live?'rgba(255,235,220,.95)':`rgba(255,60,40,${.12+.18*Math.abs(Math.sin(b.t*12))})`;
          if(b.dir==='h') g.fillRect(0,b.at-b.w/2,100,b.w); else g.fillRect(b.at-b.w/2,0,b.w,100);
          if(!live){ g.strokeStyle='rgba(255,80,60,.7)'; g.lineWidth=.6; g.setLineDash([2,2]); if(b.dir==='h') g.strokeRect(0,b.at-b.w/2,100,b.w); else g.strokeRect(b.at-b.w/2,0,b.w,100); g.setLineDash([]); }
          else { g.fillStyle='rgba(60,30,30,.85)'; const p=(b.t-b.warn)/b.act; if(b.dir==='h'){ g.beginPath(); g.ellipse(-20+p*140,b.at,14,b.w*.32,0,0,7); g.fill(); } else { g.beginPath(); g.ellipse(b.at,-20+p*140,b.w*.32,14,0,0,7); g.fill(); } } }
        if(b.k==='orbit'&&b.x!==undefined){ g.save(); g.translate(b.x,b.y); g.rotate(b.a+Math.PI/2); g.fillStyle='#e8f2ff'; g.beginPath(); g.ellipse(0,0,4,1.5,0,0,7); g.fill(); g.fillStyle='#7fb2e8'; g.beginPath(); g.ellipse(2.4,0,1.5,1,0,0,7); g.fill(); g.restore(); }
        if(b.k==='fruit'){ g.fillStyle='#d8413b'; g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.fill(); g.fillStyle='#ffb0a0'; g.fillRect(b.x-b.r*.5,b.y-b.r*.6,1.2,1.2); g.fillStyle='#5fa35a'; g.fillRect(b.x-.5,b.y-b.r-1.6,1.4,1.8); }
        if(b.k==='ember'){ const gr=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.4); gr.addColorStop(0,'rgba(255,220,120,1)'); gr.addColorStop(.45,'rgba(255,120,40,.9)'); gr.addColorStop(1,'rgba(255,80,20,0)'); g.fillStyle=gr; g.fillRect(b.x-b.r*2.4,b.y-b.r*2.4,b.r*4.8,b.r*4.8); }
        if(b.k==='stone'){ g.fillStyle='#8a8478'; g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.fill(); g.fillStyle='#b8b2a6'; g.beginPath(); g.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.45,0,7); g.fill(); g.strokeStyle='#4a443a'; g.lineWidth=.6; g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.stroke(); }
        if(b.k==='ring'){ g.strokeStyle='rgba(255,200,120,.9)'; g.lineWidth=b.th; g.beginPath(); g.arc(b.cx,b.cy,b.R,b.gap+b.gw/2,b.gap-b.gw/2+Math.PI*2); g.stroke(); }
      }
      if(pat.pull){ for(let k=0;k<3;k++){ g.strokeStyle=`rgba(200,220,240,${.25-k*.06})`; g.lineWidth=1.2; g.beginPath(); g.arc(50,50,6+k*6+(t*20%6),t*3+k,t*3+k+4.2); g.stroke(); } }
      // the bead (blinks while invulnerable)
      if(P.inv<=0 || Math.floor(P.inv*16)%2){ const gr=g.createRadialGradient(P.me.x,P.me.y,0,P.me.x,P.me.y,R*2.6); gr.addColorStop(0,'rgba(140,240,200,.55)'); gr.addColorStop(1,'rgba(140,240,200,0)'); g.fillStyle=gr; g.fillRect(P.me.x-R*3,P.me.y-R*3,R*6,R*6);
        g.fillStyle=s.guard?'#e8d07a':'#5fd6a8'; g.beginPath(); g.arc(P.me.x,P.me.y,R,0,7); g.fill(); g.fillStyle='#eafff6'; g.beginPath(); g.arc(P.me.x-1,P.me.y-1,1.1,0,7); g.fill(); }
      if(P.flash>0){ g.fillStyle=`rgba(255,60,40,${P.flash})`; g.fillRect(0,0,100,100); }
    };
    const finish=()=>{ if(ended) return; ended=true; removeEventListener('keydown',kd,true); removeEventListener('keyup',ku); ov.classList.add('out'); setTimeout(()=>ov.remove(),250); done(P.hits); };
    draw(); requestAnimationFrame(step);
    setTimeout(()=>{ if(!ended) finish(); }, (pat.dur+3)*1000);
  },
};
// the enemy's turn: dodge if this beast has a pattern for its move, otherwise the classic resolution
{ const _et=Battle.enemyTurn;
  Battle.enemyTurn=function(){
    const s=Battle.s; if(!Dodge.on(s)||s.stun) return _et.call(Battle);
    const pat=Dodge.pattern(s); if(!pat) return _et.call(Battle);     // e.g. 蓄力: nothing to dodge, the classic turn handles it
    s.busy=true; Battle.ui(); Battle.log(`${s.B.name}：${pat.name}！`);

const Mini = {
  loop:null, run(fn){ Mini.stop(); let last=performance.now(); const tick=now=>{ if(!Mini.loop) return; const dt=Math.min(.05,(now-last)/1000); last=now; fn(dt); if(Mini.loop) requestAnimationFrame(tick); }; Mini.loop=fn; requestAnimationFrame(tick); },
  step(dt){ if(Mini.loop) Mini.loop(dt); },
  stop(){ Mini.loop=null; },
  open(html){ const el=$('#minigame'); el.hidden=false; el.innerHTML=html; UI.fx=true; UI.sync(); return el; },
  close(){ Mini.stop(); const el=$('#minigame'); el.hidden=true; el.innerHTML=''; UI.fx=false; UI.sync(); },
  hold(btn, set){ const on=e=>{ e.preventDefault(); set(true); }, off=()=>set(false);
    btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off); btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off);
    const kd=e=>{ if(e.code==='Space'||e.code==='KeyE'){ e.preventDefault(); set(true); } }, ku=e=>{ if(e.code==='Space'||e.code==='KeyE') set(false); };
    addEventListener('keydown',kd); addEventListener('keyup',ku); return ()=>{ removeEventListener('keydown',kd); removeEventListener('keyup',ku); }; },

  /* ---------- 炼丹：keep the heat inside the moving sweet spot ---------- */
  alchemy(recipe, done){
    const out=ITEMS[recipe.out], wide=S.sect==='dan'?.21:.16, total=7;
    const el=Mini.open(`<div class="mg wood alc"><h3>炼制 ${out.name}</h3>
      <div class="alc-wrap"><div class="furnace"><div class="flame" id="alcFlame"></div></div>
        <div class="heat"><div class="zone" id="alcZone"></div><div class="needle" id="alcNeedle"></div></div></div>
      <div class="xbar"><i id="alcProg"></i></div><p class="mg-tip" id="alcTip">按住「鼓风」让火变旺，松开火会变弱。把火候保持在金色区域里！</p>
      <button class="btn main big" id="alcBtn">鼓风（按住）</button></div>`);
    let h=.3, v=0, t=-1.2, inside=0, holding=false; const unbind=Mini.hold($('#alcBtn'), x=>holding=x);
    Mini.run(dt=>{
      t+=dt; v+=(holding?1.5:-1.05)*dt; v*=.92; h=Math.max(0,Math.min(1,h+v*dt*2.2)); if(h===0||h===1) v=0;
      const c=.5+.22*Math.sin(t*.95)+.06*Math.sin(t*2.3);
      if(t>0){ if(Math.abs(h-c)<wide) inside+=dt; }
      $('#alcZone').style.bottom=((c-wide)*100)+'%'; $('#alcZone').style.height=(wide*200)+'%';
      $('#alcNeedle').style.bottom=(h*100)+'%'; $('#alcFlame').style.transform=`scale(${.5+h*.9})`; $('#alcFlame').style.opacity=.5+h*.5;
      $('#alcProg').style.width=Math.max(0,t/total*100)+'%';
      if(t<0) $('#alcTip').textContent='准备……';
      else if(Math.abs(h-c)<wide) $('#alcTip').textContent='火候正好！'; else $('#alcTip').textContent=h>c?'火太旺了！':'火太弱了！';
      if(t>=total){ unbind(); Mini.stop(); const r=inside/total, grade=r>=.58?'top':r>=.35?'mid':r>=.15?'low':'fail';
        const name={top:'上品',mid:'中品',low:'下品',fail:'炸炉'}[grade];
        el.querySelector('.alc').innerHTML=`<h3>${grade==='fail'?'炸炉了……':name+out.name}</h3><p class="mg-tip">火候命中 ${Math.round(r*100)}%（上品要 58%，中品 35%）</p><button class="btn main" id="alcOk">好</button>`;
        if(grade==='fail') Sound.hurt(); else Sound.levelup();
        $('#alcOk').onclick=()=>{ Mini.close(); done(grade); }; }
    });
  },

  /* ---------- 天劫：dodge the lightning ---------- */
  tribulation(done){
    const lanes=5; let pos=2, hp=3, t=0, wave=0, strikes=[], nextAt=1.2;
    const el=Mini.open(`<div class="mg wood trib"><h3>天劫</h3><p class="mg-tip" id="trTip">左右移动，躲开落下的天雷！</p>
      <div class="arena" id="trArena">${'<div class="lane"></div>'.repeat(lanes)}<div class="me" id="trMe"></div></div>
      <div class="trib-hp" id="trHp"></div><div class="mg-btns"><button class="btn big" id="trL">◀ 左</button><button class="btn big" id="trR">右 ▶</button></div></div>`);
    const me=$('#trMe'), ln=[...el.querySelectorAll('.lane')]; me.innerHTML=''; const pc=document.createElement('canvas'); pc.className='px'; const sp=lookSprite(S.look,'up',0); pc.width=sp.width; pc.height=sp.height; pc.getContext('2d').drawImage(sp,0,0); me.appendChild(pc);
    const move=d=>{ pos=Math.max(0,Math.min(lanes-1,pos+d)); Sound.tick(); };
    $('#trL').onclick=()=>move(-1); $('#trR').onclick=()=>move(1);
    $('#trArena').onpointerdown=e=>{ const r=e.currentTarget.getBoundingClientRect(); pos=Math.max(0,Math.min(lanes-1,Math.floor((e.clientX-r.left)/r.width*lanes))); };
    const kd=e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA') move(-1); if(e.code==='ArrowRight'||e.code==='KeyD') move(1); }; addEventListener('keydown',kd);
    Music.stinger('thunder');
    Mini.run(dt=>{
      t+=dt; me.style.left=(pos/lanes*100)+'%'; $('#trHp').textContent='护体 '+'◆'.repeat(hp)+'◇'.repeat(3-hp)+'　·　第 '+Math.min(3,wave+1)+' / 3 道天雷';
      if(t>=nextAt && wave<3){ const n=1+wave; const set=new Set(); while(set.size<Math.min(lanes-1,n+1)) set.add(Math.floor(Math.random()*lanes));
        for(const l of set){ strikes.push({l, at:t+.9}); ln[l].classList.add('warn'); } wave++; nextAt=t+2.1; }
      for(const s of strikes){ if(!s.done && t>=s.at){ s.done=true; ln[s.l].classList.remove('warn'); ln[s.l].classList.add('bolt'); setTimeout(()=>ln[s.l]&&ln[s.l].classList.remove('bolt'),300);
        Music.stinger('thunder'); if(s.l===pos){ hp--; Sound.hurt(); el.querySelector('.trib').classList.remove('shake'); void el.offsetWidth; el.querySelector('.trib').classList.add('shake'); } } }
      if(hp<=0 || (wave>=3 && strikes.every(s=>s.done) && t>nextAt-1)){ Mini.stop(); removeEventListener('keydown',kd); const ok=hp>0;
        el.querySelector('.trib').innerHTML=`<h3>${ok?'渡劫成功！':'天劫未过……'}</h3><p class="mg-tip">${ok?'雷光散去，天地间一片清明。':'你被天雷击伤，这次突破失败了。筑基丹还在，养好伤再来。'}</p><button class="btn main" id="trOk">好</button>`;
        $('#trOk').onclick=()=>{ Mini.close(); done(ok); }; }
    });
  },

  /* ---------- 钓鱼 ---------- */
  fishPick(){
    const night=S.min/60>=19||S.min/60<6, forest=RT.mapId==='forest', r=Math.random();
    if(forest && r<(night?.12:.06)) return {id:'fish_jin', speed:1.9, jumpy:1.6};
    if(night && r<.35) return {id:'fish_mo', speed:1.5, jumpy:1.2};
    if(r<.6) return {id:'fish_li', speed:.8, jumpy:.6};
    return {id:'fish_yin', speed:1.2, jumpy:.9};
  },
  fish(){
    const el=Mini.open(`<div class="mg wood fishg"><h3>垂钓</h3><p class="mg-tip" id="fsTip">静静等待鱼儿咬钩……</p>
      <div class="pond"><div class="bobber" id="fsBob"></div></div><button class="btn main big" id="fsBtn">收竿</button></div>`);
    Music.play('calm');
    let t=0, bite=1+Math.random()*2.5, phase='wait', biteT=0; const fish=Mini.fishPick();
    $('#fsBtn').onclick=()=>{ if(phase==='wait'){ $('#fsTip').textContent='太早了，鱼被吓跑了……'; phase='end'; setTimeout(()=>{ Mini.close(); Music.play(areaTheme()); },900); }
      else if(phase==='bite'){ phase='reel'; Mini.reel(fish); } };
    Mini.run(dt=>{ t+=dt; if(phase==='wait'&&t>=bite){ phase='bite'; biteT=t; if(RT.fishing) RT.fishing.bite=true; $('#fsTip').textContent='咬钩了！快收竿！'; $('#fsBob').classList.add('bite'); Sound.pick(); }
      if(phase==='bite'&&t-biteT>.9){ phase='end'; $('#fsTip').textContent='鱼儿溜走了……'; $('#fsBob').classList.remove('bite'); setTimeout(()=>{ Mini.close(); Music.play(areaTheme()); },900); } });
  },
  reel(fish){
    const el=$('#minigame'), it=ITEMS[fish.id];
    el.innerHTML=`<div class="mg wood fishg"><h3>收线！</h3><div class="reel-wrap"><div class="reel"><div class="catch" id="rcBox"></div><div class="fishi" id="rcFish"><img class="px" src="${iconURL(it.icon,it.color)}" alt=""></div></div>
      <div class="rprog"><i id="rcProg"></i></div></div><p class="mg-tip">按住「提竿」让绿框上升，把鱼框住！</p><button class="btn main big" id="rcBtn">提竿（按住）</button></div>`;
    let b=.1, bv=0, f=.5, fv=0, fTarget=.5, p=.3, holding=false, t=0; const box=.26; const unbind=Mini.hold($('#rcBtn'), x=>holding=x);
    Mini.run(dt=>{
      t+=dt; bv+=(holding?1.8:-1.6)*dt; bv*=.93; b=Math.max(0,Math.min(1-box,b+bv*dt*2)); if(b===0||b===1-box) bv=0;
      if(Math.random()<dt*fish.jumpy) fTarget=Math.random(); f+=(fTarget-f)*Math.min(1,dt*fish.speed*2);
      const inside=f>=b&&f<=b+box; p=Math.max(0,Math.min(1,p+(inside?.32:-.22)*dt));
      $('#rcBox').style.bottom=(b*100)+'%'; $('#rcBox').style.height=(box*100)+'%'; $('#rcFish').style.bottom=`calc(${f*100}% - 12px)`; $('#rcProg').style.height=(p*100)+'%';
      $('#rcBox').classList.toggle('on',inside);
      if(p>=1||p<=0){ Mini.stop(); unbind(); const ok=p>=1; if(ok){ addItem(fish.id); Sound.levelup(); } else Sound.hurt();
        el.querySelector('.fishg').innerHTML=`<h3>${ok?'钓到了！':'鱼跑了……'}</h3>${ok?`<p class="mg-tip"><img class="px" style="width:48px" src="${iconURL(it.icon,it.color)}" alt=""><br>${it.name}　${esc(it.desc)}</p>`:''}<button class="btn main" id="rcOk">好</button>`;
        $('#rcOk').onclick=()=>{ Mini.close(); Music.play(areaTheme()); }; }
    });
  },
};

const Bounty = {
  rep(){ return S.rep||0; },
  rank(){ let r=0; RANKS.forEach(([n],i)=>{ if(Bounty.rep()>=n) r=i; }); return r; },
  // the day's requests: three (four from 桃源侠士 up), never two of the same kind+target
  roll(){
    const want=Bounty.rank()>=2?4:3, list=[], mul=1+.25*Bounty.rank();
    for(let tries=0; list.length<want && tries<40; tries++){
      const K=BOUNTY_KINDS[Math.random()*BOUNTY_KINDS.length|0], b=K.make(); if(!b) continue;
      // different kinds first; repeats of a kind only once every kind is on the board
      const kinds=new Set(list.map(x=>x.kind)), avail=BOUNTY_KINDS.filter(k=>k.kind!=='qiyu'||(S.qiyu&&!S.qiyu.done)).length;
      if(kinds.has(K.kind)&&kinds.size<avail) continue;
      if(list.some(x=>x.kind===K.kind&&x.key===b.key)) continue;
      if(K.kind==='qiyu'&&kinds.has('qiyu')) continue;
      list.push({...b, kind:K.kind, pay:Math.round(b.pay*mul), done:false});
    }
    S.bounty={day:S.day, list, bonus:false};
  },
  today(){ if(!S.bounty||S.bounty.day!==S.day) Bounty.roll(); return S.bounty; },
  prog(b){
    if(b.kind==='kill') return Math.min(b.n, ((S.st.kb||{})[b.key]||0)-b.base);

    if(b.kind==='gift') return Social.rel(b.key).gifted===S.day?1:0;
    if(b.kind==='qiyu') return S.qiyu&&S.qiyu.ev===b.key&&S.qiyu.done?1:0;

  ready(b){ return !b.done && Bounty.prog(b)>=b.n; },
  claim(i){
    const B=Bounty.today(), b=B.list[i]; if(!b||!Bounty.ready(b)) return;
    if(b.kind==='item') addItem(b.key,-b.n);
    const r0=Bounty.rank(); b.done=true; S.stones+=b.pay; S.rep=Bounty.rep()+b.rep; Sound.coin();
    let msg=`完成悬赏：灵石 +${b.pay}，声望 +${b.rep}`;
    if(!B.bonus && B.list.every(x=>x.done)){ B.bonus=true; S.rep+=1; addItem('juqi',1); msg+='　·　今日悬赏全部完成！额外 声望 +1、聚气丹 ×1'; }
    UI.toast(msg); UI.hud();
    if(Bounty.rank()>r0){ Sound.levelup(); UI.banner('声望提升：'+RANKS[Bounty.rank()][1]); }
    UI.closePanel(); Bounty.open();
  },
  buy(i){ const it=REP_SHOP[i]; if(Bounty.rep()<it.cost) return UI.toast('声望不够'); if(it.once&&S.inv[it.id]) return UI.toast('已经有了'); S.rep-=it.cost; addItem(it.id,it.n); Sound.coin(); UI.toast(`换得 ${ITEMS[it.id].name} ×${it.n}`); UI.closePanel(); Bounty.open(); },
  open(){

    UI.panel('桃源镇 · 悬赏榜', `<div class="bounty">
      <p class="muted">声望 <b>${Bounty.rep()}</b>　·　${RANKS[rk][1]}${next?`（${next[0]} 声望升为「${next[1]}」）`:''}　·　每天清晨换一批悬赏，全部完成有额外奖励。${rk<2?'到「桃源侠士」后每天有 4 个悬赏。':''}</p>
      <div class="blist">${B.list.map((b,i)=>{ const p=Bounty.prog(b);
        return `<div class="bnote ${b.done?'done':Bounty.ready(b)?'ready':''}"><small>${esc(b.who)}</small><b>${esc(b.text)}</b>
          <div class="brow"><span>${b.done?'✓ 已完成':`进度 ${p}/${b.n}`}</span><span class="bpay">灵石 ${b.pay}　声望 ${b.rep}</span>
          ${b.done?'':`<button class="btn mini ${Bounty.ready(b)?'main':''}" data-c="${i}" ${Bounty.ready(b)?'':'disabled'}>${b.kind==='item'?'交付':'领赏'}</button>`}</div></div>`; }).join('')}</div>
      <h4>声望兑换</h4><div class="bshop">${REP_SHOP.map((it,i)=>`<button class="bitem" data-b="${i}" ${Bounty.rep()<it.cost||(it.once&&S.inv[it.id])?'disabled':''}><img class="px" src="${iconURL(ITEMS[it.id].icon,ITEMS[it.id].color)}" alt=""><span>${ITEMS[it.id].name}×${it.n}</span><em>${it.cost} 声望</em></button>`).join('')}</div></div>`, b=>{
      b.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>Bounty.claim(+x.dataset.c));
      b.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>Bounty.buy(+x.dataset.b)); });
  },
  // for the HUD task list: how many requests are ready to hand in

};

/* ============================================================
   山海问道 · 水墨背景 — rice paper, ink mountains, mist, pines, bamboo, water, lanterns.
   Used as the backgrounds of the pixel CGs (the characters stay pixel chibis). Only the `base` painters are used;
   the scene tables also keep their old figure layouts, which nothing calls.
   ============================================================ */
const SUMI = {
  ink:(a)=>`rgba(26,22,19,${a})`,
  paper:'#efe5cf',
};
/* ---------- brush basics ---------- */
function brush(g, pts, w, a, col){ // a stroke through points, slightly dry: a wide faint pass and a narrow dark pass
  if(pts.length<2) return; g.lineCap='round'; g.lineJoin='round';
  for(const [k,al] of [[1.35,.35],[1,1]]){ g.strokeStyle=col||SUMI.ink(a*al); g.lineWidth=w*k; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length-1;i++){ const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2; g.quadraticCurveTo(pts[i][0],pts[i][1],mx,my); }
    const L=pts[pts.length-1]; g.lineTo(L[0],L[1]); g.stroke(); }
}
function blob(g, pts, fill){ g.fillStyle=fill; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const p=pts[i], n=pts[(i+1)%pts.length]; g.quadraticCurveTo(p[0],p[1],(p[0]+n[0])/2,(p[1]+n[1])/2); } g.closePath(); g.fill(); }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function lighten(hex,k){ const n=parseInt(hex.slice(1),16), f=v=>Math.round(v+(255-v)*k); return '#'+[n>>16&255,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

/* ---------- landscape ---------- */
const Land = {
  paper(g,W,H,R,tone){
    g.fillStyle=tone||SUMI.paper; g.fillRect(0,0,W,H);
    for(let i=0;i<W*H/260;i++){ g.fillStyle=R()<.5?'rgba(255,255,255,.06)':'rgba(120,90,50,.035)'; g.fillRect(R()*W,R()*H,1+R()*5,1); }
    for(let i=0;i<40;i++){ const x=R()*W, y=R()*H, r=20+R()*120, gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(150,120,80,.035)'); gr.addColorStop(1,'rgba(150,120,80,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
  },
  edge(g,W,H){ const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78); gr.addColorStop(0,'rgba(90,60,30,0)'); gr.addColorStop(1,'rgba(90,60,30,.28)'); g.fillStyle=gr; g.fillRect(0,0,W,H); },
  sky(g,W,H,cols){ const s=g.createLinearGradient(0,0,0,H); cols.forEach((c,i)=>s.addColorStop(i/(cols.length-1),c)); g.fillStyle=s; g.fillRect(0,0,W,H); },
  // steep Chinese peaks: a ridge made of gaussian bumps, dark at the crest, melting into mist at the foot
  peaks(g,W,H,R,{y, amp, n=5, a=.5, tint=null, pines=0, cun=1}){
    const P=[]; for(let i=0;i<n;i++) P.push({x:R()*W*1.2-W*.1, h:amp*(.45+R()*.55), w:W*(.05+R()*.11), k:R()*6});
    const ridge=x=>{ let m=0; for(const p of P){ const d=(x-p.x)/p.w; m=Math.max(m, p.h*Math.exp(-d*d*1.4)*(1+.06*Math.sin(x*.07+p.k))); } return y-m-amp*.04*Math.sin(x/W*9+P[0].k); };
    const top=y-amp, gr=g.createLinearGradient(0,top,0,y+amp*.35);
    gr.addColorStop(0, tint?rgba(tint,a):SUMI.ink(a)); gr.addColorStop(.55, tint?rgba(tint,a*.45):SUMI.ink(a*.45)); gr.addColorStop(1, tint?rgba(tint,0):SUMI.ink(0));
    g.fillStyle=gr; g.beginPath(); g.moveTo(0,y+amp*.4); for(let x=0;x<=W;x+=3) g.lineTo(x,ridge(x)); g.lineTo(W,y+amp*.4); g.closePath(); g.fill();
    // crest line and 皴 texture strokes
    const pts=[]; for(let x=0;x<=W;x+=W/80) pts.push([x,ridge(x)]); brush(g,pts,Math.max(1,W/700),a*.55);
    for(let i=0;i<n*14*cun;i++){ const x=R()*W, ry=ridge(x); if(ry>y-amp*.08) continue; const len=amp*(.06+R()*.12), dir=R()<.5?-1:1;
      brush(g,[[x,ry+2],[x+dir*len*.3,ry+len*.5],[x+dir*len*.2,ry+len]],Math.max(1,W/900),a*.35); }
    for(let i=0;i<pines;i++){ const x=R()*W, ry=ridge(x); if(ry>y-amp*.15) continue; Land.tinyPine(g,x,ry,amp*.08,a*1.2); }
    return ridge;
  },
  tinyPine(g,x,y,s,a){ g.fillStyle=SUMI.ink(Math.min(.9,a)); g.fillRect(x-s*.04,y-s,s*.08,s); for(let k=0;k<4;k++){ g.beginPath(); g.ellipse(x,y-s*(.35+k*.2),s*(.38-k*.07),s*.09,0,0,7); g.fill(); } },
  mist(g,W,H,y,h,a){ const gr=g.createLinearGradient(0,y-h/2,0,y+h/2); gr.addColorStop(0,'rgba(245,240,228,0)'); gr.addColorStop(.5,`rgba(245,240,228,${a})`); gr.addColorStop(1,'rgba(245,240,228,0)'); g.fillStyle=gr; g.fillRect(0,y-h/2,W,h); },
  orb(g,x,y,r,col,glow){ if(glow){ const gr=g.createRadialGradient(x,y,r*.6,x,y,r*glow); gr.addColorStop(0,rgba(col,.35)); gr.addColorStop(1,rgba(col,0)); g.fillStyle=gr; g.fillRect(x-r*glow,y-r*glow,r*glow*2,r*glow*2); }
    g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); },
  ground(g,W,H,y,a,col){ const gr=g.createLinearGradient(0,y-H*.02,0,H); gr.addColorStop(0,col?rgba(col,0):SUMI.ink(0)); gr.addColorStop(.15,col?rgba(col,a):SUMI.ink(a)); gr.addColorStop(1,col?rgba(col,a*1.3):SUMI.ink(a*1.3)); g.fillStyle=gr; g.fillRect(0,y-H*.02,W,H-y+H*.02); },
  grass(g,x,y,s,n,R,a,col){ for(let i=0;i<n;i++){ const bx=x+(R()-.5)*s*2, h=s*(.4+R()*.8), lean=(R()-.5)*s*.8; brush(g,[[bx,y],[bx+lean*.4,y-h*.6],[bx+lean,y-h]],Math.max(1,s*.05),a,col&&rgba(col,a)); } },
  pine(g,x,y,s,R,a=.85){ // trunk leaning, layered needle pads
    const lean=(R()-.5)*s*.5, top=[x+lean,y-s];
    brush(g,[[x,y],[x+lean*.3,y-s*.4],[x+lean*.7,y-s*.75],top],s*.07,a);
    for(let i=0;i<5;i++){ const t=.35+i*.14, bx=x+lean*t, by=y-s*t, dir=i%2?1:-1, L=s*(.32-i*.04)*(.8+R()*.4), ex=bx+dir*L, ey=by-s*.04;
      brush(g,[[bx,by],[bx+dir*L*.5,by-s*.02],[ex,ey]],s*.025,a*.9);
      for(let k=0;k<26;k++){ const ang=(R()-.5)*Math.PI*.9-Math.PI/2, len=s*(.05+R()*.07), px=ex-dir*R()*L*.5, py=ey; g.strokeStyle=SUMI.ink(a*(.4+R()*.4)); g.lineWidth=Math.max(1,s*.012);
        g.beginPath(); g.moveTo(px,py); g.lineTo(px+Math.cos(ang)*len*1.8,py+Math.sin(ang)*len*.6); g.stroke(); }
      g.fillStyle=SUMI.ink(a*.25); g.beginPath(); g.ellipse(ex-dir*L*.25,ey-s*.01,L*.55,s*.045,0,0,7); g.fill(); }
  },
  tree(g,x,y,s,R,a=.8,blossom){ // broadleaf / blossom tree: crooked trunk, wet dabs
    const lean=(R()-.5)*s*.4; brush(g,[[x,y],[x+lean*.4,y-s*.4],[x+lean,y-s*.7]],s*.045,a); brush(g,[[x+lean*.6,y-s*.55],[x+lean,y-s*.75],[x+lean*1.1,y-s*.9]],s*.025,a);
    for(let b=0;b<4;b++){ const sx=x+lean*(.45+b*.15), sy=y-s*(.45+b*.1), dir=b%2?1:-1; brush(g,[[sx,sy],[sx+dir*s*.12,sy-s*.1]],s*.014,a); brush(g,[[sx+dir*s*.12,sy-s*.1],[sx+dir*s*.26,sy-s*.2]],s*.007,a); }
    for(let k=0;k<70;k++){ const ang=R()*Math.PI*2, rr=s*.32*Math.sqrt(R()), px=x+lean+Math.cos(ang)*rr*1.3, py=y-s*.8+Math.sin(ang)*rr*.8;
      g.fillStyle=blossom&&R()<.5?rgba(blossom,.55):SUMI.ink(a*(.15+R()*.35)); g.beginPath(); g.ellipse(px,py,s*.035,s*.022,R()*3,0,7); g.fill(); }
  },
  bamboo(g,x,y0,y1,w,R,a=.8){ // segmented culm and blade leaves
    const segs=Math.max(3,Math.round((y0-y1)/(w*9))), sl=(y0-y1)/segs, bend=(R()-.5)*w*3;
    for(let i=0;i<segs;i++){ const t0=i/segs, t1=(i+1)/segs, ax=x+bend*t0*t0, bx=x+bend*t1*t1; g.strokeStyle=SUMI.ink(a*(.55+R()*.3)); g.lineWidth=w; g.lineCap='butt';
      g.beginPath(); g.moveTo(ax,y0-sl*i-1); g.lineTo(bx,y0-sl*(i+1)+2); g.stroke(); g.fillStyle=SUMI.ink(a); g.fillRect(bx-w*.7,y0-sl*(i+1),w*1.4,w*.25);
      if(R()<.5){ const dir=R()<.5?-1:1; for(let k=0;k<3;k++){ const lx=bx, ly=y0-sl*(i+1), ang=dir*(.6+k*.35)+(R()-.5)*.3, L=w*(4+R()*3);
        g.fillStyle=SUMI.ink(a*(.5+R()*.4)); g.beginPath(); g.moveTo(lx,ly); g.quadraticCurveTo(lx+Math.sin(ang)*L*.5+w*.6,ly+Math.cos(ang)*L*.5-w, lx+Math.sin(ang)*L, ly+Math.cos(ang)*L*.6);
        g.quadraticCurveTo(lx+Math.sin(ang)*L*.5-w*.6,ly+Math.cos(ang)*L*.5+w*.3, lx,ly); g.fill(); } } }
  },
  rock(g,x,y,w,h,R,a=.75){ const pts=[[x-w/2,y],[x-w*.45,y-h*.55],[x-w*.2,y-h],[x+w*.15,y-h*.92],[x+w*.45,y-h*.5],[x+w/2,y]];
    blob(g,pts,SUMI.ink(a*.25)); brush(g,[...pts.slice(0,5),[x+w/2,y]],Math.max(1.5,w*.025),a);
    for(let i=0;i<4;i++){ const sx=x+(R()-.5)*w*.6, sy=y-h*(.3+R()*.5); brush(g,[[sx,sy],[sx+w*.06,sy+h*.12],[sx+w*.03,sy+h*.25]],Math.max(1,w*.015),a*.6); } },
  water(g,W,y,H,R,a=.35,tint){ if(tint){ const gr=g.createLinearGradient(0,y,0,H); gr.addColorStop(0,rgba(tint,.18)); gr.addColorStop(1,rgba(tint,.3)); g.fillStyle=gr; g.fillRect(0,y,W,H-y); }
    for(let i=0;i<70;i++){ const yy=y+(H-y)*Math.pow(R(),1.4), x=R()*W, l=W*(.03+R()*.08)*(1+(yy-y)/(H-y)); brush(g,[[x,yy],[x+l*.5,yy-1],[x+l,yy]],Math.max(1,W/900),a*(.3+R()*.5)); } },
  lantern(g,x,y,r,glow){ if(glow){ const gr=g.createRadialGradient(x,y,0,x,y,r*glow); gr.addColorStop(0,'rgba(255,170,80,.45)'); gr.addColorStop(1,'rgba(255,170,80,0)'); g.fillStyle=gr; g.fillRect(x-r*glow,y-r*glow,r*glow*2,r*glow*2); }
    g.fillStyle='#c8413b'; g.beginPath(); g.ellipse(x,y,r*.8,r,0,0,7); g.fill(); g.fillStyle='rgba(255,215,140,.75)'; g.beginPath(); g.ellipse(x,y,r*.4,r*.6,0,0,7); g.fill();
    g.fillStyle=SUMI.ink(.85); g.fillRect(x-r*.45,y-r*1.05,r*.9,r*.18); g.fillRect(x-r*.45,y+r*.9,r*.9,r*.16); g.strokeStyle='#e8b84a'; g.lineWidth=Math.max(1,r*.08); g.beginPath(); g.moveTo(x,y+r*1.05); g.lineTo(x,y+r*1.6); g.stroke(); },
  roof(g,x,y,w,h,a=.85){ // a pavilion / hut roof with upturned eaves
    g.fillStyle=SUMI.ink(a); g.beginPath(); g.moveTo(x-w*.6,y+h*.15); g.quadraticCurveTo(x-w*.42,y+h*.05,x-w*.3,y-h*.55); g.lineTo(x+w*.3,y-h*.55); g.quadraticCurveTo(x+w*.42,y+h*.05,x+w*.6,y+h*.15);
    g.quadraticCurveTo(x+w*.4,y+h*.25,x,y+h*.25); g.quadraticCurveTo(x-w*.4,y+h*.25,x-w*.6,y+h*.15); g.fill();
    g.strokeStyle='rgba(239,229,207,.25)'; g.lineWidth=Math.max(1,w*.006); for(let i=-6;i<=6;i++){ g.beginPath(); g.moveTo(x+i*w*.045,y-h*.5); g.lineTo(x+i*w*.07,y+h*.2); g.stroke(); } },
  seal(g,x,y,s,text){ g.fillStyle='rgba(190,40,30,.88)'; g.fillRect(x,y,s,s*(text.length>2?1.4:1)); g.fillStyle=SUMI.paper; g.font=`${s*.42}px "Ma Shan Zheng",KaiTi,serif`; g.textAlign='center'; g.textBaseline='middle';
    const ch=[...text]; ch.forEach((c,i)=>{ const col=i%2, row=Math.floor(i/2), cols=Math.min(2,ch.length); g.fillText(c, x+s*(cols===1?.5:col?.28:.72), y+s*(.3+row*.42)); }); },
  birds(g,x,y,s,n,R,a=.8){ for(let i=0;i<n;i++){ const bx=x+(R()-.5)*s*6, by=y+(R()-.5)*s*2, w=s*(.6+R()*.5); brush(g,[[bx-w,by-w*.2],[bx-w*.3,by-w*.35],[bx,by]],Math.max(1,s*.12),a); brush(g,[[bx,by],[bx+w*.3,by-w*.35],[bx+w,by-w*.25]],Math.max(1,s*.12),a); } },
};

const PCX=10, PCY=4, PCW=40, PCH=28;   // a posed chibi lives in a 40×28 grid; the 16-wide body sits at column 10, row 4
const POSEC={};
function poseSprite(look, pose, mood, prop, wear, back){
  const key=JSON.stringify([look,pose,mood,prop,wear,back]); if(POSEC[key]) return POSEC[key];
  const B=POSE_BODY[pose]||POSE_BODY.stand, dir=back?'up':'side';
  const head=composeRows(dir, look, 0).slice(0,12).map(r=>r.split(''));
  if(!back&&mood&&MOODS[mood]) for(const y in MOODS[mood]) for(const [x,ch] of MOODS[mood][y]){ const cur=head[y][x]; if('SsELeMm'.includes(cur)) head[y][x]=ch; }
  const body=back?BODY.up.slice(12).map(r=>r.split('')):B.rows.map(r=>r.split(''));
  const grid=[...Array(PCH)].map(()=>Array(PCW).fill('.'));
  const put=(x,y,ch)=>{ x+=PCX; y+=PCY; if(x>=0&&y>=0&&x<PCW&&y<PCH&&ch!=='.') grid[y][x]=ch; };
  const hd=B.headDrop||0;
  for(const w of wear||[]) if(WEAR[w]&&(w==='backsword'||w==='bow'||w==='bookbox')) for(const [x,y,ch] of WEAR[w]) put(x,y,ch);   // behind the body
  body.forEach((r,y)=>r.forEach((ch,x)=>put(x,12+y,ch)));
  head.forEach((r,y)=>r.forEach((ch,x)=>put(x+(hd?1:0),y+hd,ch)));
  for(const w of wear||[]) if(WEAR[w]&&!(w==='backsword'||w==='bow'||w==='bookbox')) for(const [x,y,ch] of WEAR[w]) put(x,y,ch);
  if(prop&&PROPS[prop]&&!back){ const [hx,hy]=B.hand; for(const [dx,dy,ch] of PROPS[prop]()) put(hx+dx,hy+dy,ch); }
  const pal={...lookPalette(look), ...PROP_PAL, l:'#9fd3ef'};
  const c=document.createElement('canvas'); c.width=PCW; c.height=PCH; const g=c.getContext('2d');
  const filled=(x,y)=>y>=0&&y<PCH&&x>=0&&x<PCW&&grid[y][x]!=='.';
  g.fillStyle='#2a1e1a'; for(let y=0;y<PCH;y++) for(let x=0;x<PCW;x++){ if(filled(x,y)) continue; if(filled(x-1,y)||filled(x+1,y)||filled(x,y-1)||filled(x,y+1)) g.fillRect(x,y,1,1); }
  for(let y=0;y<PCH;y++) for(let x=0;x<PCW;x++){ const ch=grid[y][x]; if(ch==='.') continue; g.fillStyle=pal[ch]||'#f0f'; g.fillRect(x,y,1,1); }
  let bottom=PCH-1; while(bottom>0&&!grid[bottom].some(ch=>ch!=='.')) bottom--; c.bottom=bottom+2;   // feet sit on the ground line
  return POSEC[key]=c;
}

/* ---------- pixel landscape painter (low-res canvas, drawn in whole pixels) ---------- */
const PX = {
  r(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h))); },

  disc(g,cx,cy,r,c){ g.fillStyle=c; for(let y=-r;y<=r;y++){ const w=Math.round(Math.sqrt(r*r-y*y)); g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1); } },

   山海问道 · CG 小人 — a finer chibi for the CG scenes.
   The in-game 16-pixel sprite is too coarse when blown up, so the CG chibi is drawn at twice the detail:
   the body keeps the posed templates (each cell becomes 2×2), and the head is painted pixel by pixel —
   big shiny eyes, lashes, brows, a small mouth, blush — with readable expressions (smile, blush, sad, blink).
   Faces three-quarter right; the viewer mirrors it for characters facing left.

// fine poses: lean of the upper body, lower-body shape, near / far arm angles (0 = hanging, + = forward), seat line for sitting
const FPOSE = {
  stand:{low:'skirt', near:[.2,.3], far:[-.12,.15]},
  walk: {low:'walk', lean:.05, near:[.55,.25], far:[-.45,.2]},
  hold: {low:'skirt', near:[1.25,.75], far:[1.05,.95]},
  lantern:{low:'skirt', near:[.6,-.35], far:[.15,.25]},
  point:{low:'skirt', near:[2.0,.05], far:[-.1,.2]},
  sitedge:{low:'edge', near:[.6,.95], far:[.45,1.0], seat:47},
  sit:  {low:'cross', near:[.65,1.0], far:[.5,1.0], seat:49},
  kneel:{low:'kneel', lean:.05, near:[.55,.8], far:[.3,.9], seat:49},
  reach:{low:'kneel', lean:.35, near:[.95,.3], far:[.4,.8], seat:49},
  crouch:{low:'crouch', lean:.2, near:[1.35,1.1], far:[1.2,1.2], seat:49},
  sword:{low:'lunge', lean:.15, near:[1.57,0], far:[-1.9,-.5]},
  guard:{low:'lunge', lean:.05, near:[2.5,.35], far:[-.7,.3]},

const CHIBIC={};
function cgChibi(look, pose, mood, prop, wear, back){
  const key=JSON.stringify([look,pose,mood,prop,wear,back]); if(CHIBIC[key]) return CHIBIC[key];
  const W=PCW*2, H=PCH*2, pal={...lookPalette(look), ...PROP_PAL, l:'#9fd3ef'};
  const px=new Array(W*H).fill(null);
  const set=(x,y,c)=>{ x=Math.round(x); y=Math.round(y); if(x>=0&&y>=0&&x<W&&y<H&&c) px[y*W+x]=c; };
  const rect=(x,y,w,h,c)=>{ for(let j=0;j<h;j++) for(let i=0;i<w;i++) set(x+i,y+j,c); };
  const ell=(cx,cy,rx,ry,c,test)=>{ for(let y=Math.floor(cy-ry);y<=cy+ry;y++) for(let x=Math.floor(cx-rx);x<=cx+rx;x++){ const d=((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2; if(d<=1&&(!test||test(x,y))) set(x,y,c); } };
  const FP2=FPOSE[pose]||FPOSE.stand, hd=FP2.drop||0, st=(LOOK.hairstyles[look.hair]||{}).id||'short';
  const HAIR=pal.H, HAIR2=pal.h, SK=pal.S, SK2=pal.s, OUT='#2a1e1a';
  const lt=c=>shade(c,.18), dk=c=>shade(c,-.22);
  const C=pal.C, P=pal.P, A=pal.A, TR=pal.W, SHOE=pal.F, jin=look.style==='jin', qun=look.style==='qun';
  // drawing helpers on the fine grid
  const capsule=(ax,ay,bx,by,r,col)=>{ for(let y=Math.floor(Math.min(ay,by)-r-1);y<=Math.max(ay,by)+r+1;y++) for(let x=Math.floor(Math.min(ax,bx)-r-1);x<=Math.max(ax,bx)+r+1;x++){
      const vx=bx-ax, vy=by-ay, L=vx*vx+vy*vy||1, u=Math.max(0,Math.min(1,((x+.5-ax)*vx+(y+.5-ay)*vy)/L)), dx=x+.5-(ax+u*vx), dy=y+.5-(ay+u*vy); if(dx*dx+dy*dy<=r*r) set(x,y,col); } };
  const poly=(pts,col)=>{ const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    for(let y=Math.floor(Math.min(...ys));y<=Math.max(...ys);y++) for(let x=Math.floor(Math.min(...xs));x<=Math.max(...xs);x++){ let inside=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if(((yi>y+.5)!==(yj>y+.5))&&(x+.5<(xj-xi)*(y+.5-yi)/(yj-yi)+xi)) inside=!inside; }
      if(inside) set(x,y,col); } };

      if(seam) for(const j of [i-1,i+1,i-W,i+W]) if(j>=0&&j<px.length&&!mask.has(j)&&before[j]&&px[j]===before[j]) px[j]=OUT; }

    if(w==='backsword'){ line(25,29,40,47,'#3a2a22'); line(26,29,41,47,'#9aa6b0'); rect(23,26,3,3,'#3a2a22'); set(22,29,'#d8413b'); set(22,30,'#d8413b'); set(21,31,'#d8413b'); }
    if(w==='bow'){ for(let i=0;i<16;i++){ const y=31+i, x=24-Math.round(Math.sin(i/15*Math.PI)*3); set(x,y,'#7a4a2a'); } line(25,31,25,46,'#d8d0c0'); }

    if(jin){ part(c=>{ poly([[hipX-6,43],[hipX,43],[hipX-1,52],[hipX-6-spread,52]],c); poly([[hipX,43],[hipX+6,43],[hipX+6+spread,52],[hipX+1,52]],c); },LOW);

    else { part(c=>poly([[hipX-6,43],[hipX+6,43],[hipX+9+spread,54],[hipX-9-spread,54]],c),LOW);

      rect(hipX-9-spread,53,19+spread*2,1,qun?A:dk(LOW)); rect(hipX-5-spread,54,4,2,SHOE); rect(hipX+2+spread,54,4,2,SHOE); } }

    rect(hipX-13,53,6,2,SHOE); rect(hipX+7,53,7,2,SHOE); if(!jin){ line(hipX-12,53,hipX-7,53,qun?A:dk(LOW)); line(hipX+6,53,hipX+12,53,qun?A:dk(LOW)); } }

/* ============================================================
   山海问道 · 闭关 — choose how long to meditate (two hours up to a month), see which realm you will reach,
   then watch a progress bar. Long sessions pass whole days (letters, 奇遇 and fortunes still roll each morning).
   Midnight no longer knocks you out: the day simply turns over.
   ============================================================ */
const MED_STEPS = [[2,'2 小时'],[4,'4 小时'],[6,'半天'],[24,'1 天'],[48,'2 天'],[72,'3 天'],[120,'5 天'],[168,'7 天'],[240,'10 天'],[360,'15 天'],[720,'30 天']];
const Med = {
  // cultivation from one 2-hour block at level L; a full day counts as six blocks (the rest is eating and sleeping)
  block(L){ return Math.round((14+4*L)*(L>=10?1.6:1)*2*Sect.medMul()); },
  blocks(h){ return h<24 ? Math.max(1,Math.round(h/2)) : Math.round(h/24*6); },
  full(){ return (S.L===9||S.L>=12) && S.exp>=expNeed(S.L); },
  // hours until the clock next shows `hr` o'clock
  until(hr){ let m=hr*60-S.min; if(m<=0) m+=24*60; return m/60; },
  // run the numbers without touching the save
  sim(h){ let L=S.L, exp=S.exp, total=0;
    for(let i=0;i<Med.blocks(h);i++){ const g=Med.block(L), before=exp; exp+=g;
      while(true){ const need=expNeed(L); if(L===9||L>=12){ exp=Math.min(exp,need); break; } if(exp<need) break; exp-=need; L++; }
      total+= exp>=before ? exp-before : g; if((L===9||L>=12)&&exp>=expNeed(L)) break; }
    return {L, exp, total, capped:(L===9||L>=12)&&exp>=expNeed(L)}; },
  // how many days of 闭关 until each of the next few realms
  ahead(){ const out=[]; let L=S.L, exp=S.exp, blocks=0;
    while(out.length<4 && blocks<6*400){ if((L===9||L>=12)&&exp>=expNeed(L)) break; exp+=Med.block(L); blocks++;
      const need=expNeed(L); if(L!==9&&L<12&&exp>=need){ exp-=need; L++; out.push([L, blocks]); } else if(L===9&&exp>=need){ out.push([9.5, blocks]); exp=need; } }
    return out; },
  when(blocks){ const h=blocks*2; return h<24?`${h} 小时`:`${Math.ceil(blocks/6)} 天`; },
  open(skipAsk){
    // 炼气九层圆满 with a 筑基丹: break through, or just sit and let time pass
    if(!skipAsk && S.L===9 && S.exp>=expNeed(9) && S.inv.zhuji)
      return UI.say([{choice:'炼气九层圆满。要服下筑基丹，冲击筑基吗？（将面对心魔与天劫）', options:[{text:'冲击筑基', fn:()=>Mini.breakthrough()},{text:'先不了，只静坐一会儿', fn:()=>Med.open(true)}]}]);

    const ahead=Med.ahead().map(([L,b])=>`<li><b>${L%1?realmName(Math.floor(L))+(L===9.5?'圆满':'（瓶颈）'):realmName(L)}</b><span>约 ${Med.when(b)}</span></li>`).join('');
    UI.panel('闭关打坐', `<div class="med">
      ${full?`<p class="med-full">${bottleneck(S.L)?bottleneck(S.L):S.L===9?'炼气九层已经圆满，需要筑基丹才能再进一步。':'修为已经到了这一章的顶点。'}现在打坐不会再增加修为，只会让时间过去——想等到夜里找奇遇，可以用下面的「坐到天黑」。</p>`:''}
      <p class="muted">现在：<b>${realmName(S.L)}</b>　修为 ${Math.floor(S.exp)} / ${expNeed(S.L)}　（${Sect.rootName()}${Sect.medMul()!==1?'，打坐 ×'+Sect.medMul():''}）</p>
      <label class="med-len">打坐多久：<b id="medLen"></b></label>

      <p class="muted">闭关一天按六个时辰算（其余时间吃饭睡觉）。闭关期间日子照常过：会收到信件，也会错过当天的奇遇。</p>
      <div class="mg-btns"><button class="btn main" id="medGo">开始打坐</button><button class="btn" id="medNight">坐到天黑（19:00）</button><button class="btn" id="medDawn">坐到天亮（6:00）</button><button class="btn" id="medNo">算了</button></div></div>`, b=>{
      const r=$('#medR'), show=()=>{ k=+r.value; Med._k=k; const [h,name]=MED_STEPS[k], s=Med.sim(h);
        $('#medLen').textContent=name;
        $('#medOut').innerHTML=full?`静坐 ${name}，修为不变<br><span class="muted">结束时：第 ${S.day+Math.floor((S.min+h*60)/(24*60))} 天 ${fmtTime((S.min+h*60)%(24*60))}</span>`:`修为 <b>+${s.total}</b>　→　<b>${realmName(s.L)}</b>${s.capped&&s.L===9?'（圆满，需筑基丹）':''}${s.L>S.L?`<span class="up">突破 ${s.L-S.L} 层！</span>`:''}<br><span class="muted">结束时：第 ${S.day+Math.floor((S.min+h*60)/(24*60))} 天 ${fmtTime((S.min+h*60)%(24*60))}</span>`; };

      $('#medDawn').onclick=()=>{ UI.closePanel(); Med.run(Med.until(6)); };
      $('#medNo').onclick=()=>UI.closePanel(); });
  },
  run(h){
    const blocks=Med.blocks(h), per=h*60/blocks, dur=Math.min(4.5, 1.4+Math.log2(1+h/2)*.45)*1000, L0=S.L, sitting=Med.full(); let early=false;
    UI.fx=true; UI.sync(); Sound.magic();
    const el=document.createElement('div'); el.id='medbar'; el.innerHTML=`<div class="medbox"><b>闭关中……</b><div class="xbar"><i></i></div><span class="mtxt"></span><span class="mrealm">${realmName(S.L)}</span></div>`;
    document.body.appendChild(el);
    let done=0, gained=0; const t0=performance.now(), bar=el.querySelector('i'), txt=el.querySelector('.mtxt'), rl=el.querySelector('.mrealm');
    const step=now=>{
      const f=Math.min(1,(now-t0)/dur), want=Math.round(blocks*f);
      while(done<want && !early){ done++; const before=S.L; if(!sitting){ gained+=gainExpQuiet(Med.block(S.L)); }
        // time passes with each block (a day-long session is six blocks of four hours)
        Med.advance(per);
        if(!sitting && Med.full()){ early=true; txt.textContent='修为圆满，提前出关。'; }
        if(S.L>before){ rl.textContent=realmName(S.L); rl.classList.remove('pop'); void rl.offsetWidth; rl.classList.add('pop'); Sound.levelup(); } }
      bar.style.width=(early?100:f*100)+'%'; if(!early) txt.textContent=`第 ${S.day} 天 ${fmtTime(S.min)}　${sitting?'静坐中':'修为 +'+gained}`;
      if(f<1&&!early) return setTimeout(()=>step(performance.now()),16);   // a timer, so it also finishes in a background tab
      setTimeout(()=>{ el.remove(); UI.fx=false; S.st.meditated++; const st=stats(); S.hp=st.hp; S.mp=st.mp;
        if(S.L>L0) UI.banner('突破！'+realmName(S.L)); else if(early) UI.banner(S.L===9?'炼气九层圆满！':'修为圆满'); if(gained) UI.float(S.x,S.y,`+${gained} 修为`); UI.clock(); UI.hud(); save(); UI.sync(); Story.check(); },early?1200:500);
    };
    setTimeout(()=>step(performance.now()),16);
  },
  // move the clock forward, turning the day over at midnight
  advance(min){ S.min+=min; while(S.min>=24*60){ S.min-=24*60; passDay(); } },
};
// like gainExp but without the banner/sound per level (the bar shows those)
// returns how much actually landed (nothing once the bar is full)
function gainExpQuiet(n){ const L0=S.L, e0=S.exp; let got=n; S.exp+=n;
  while(true){ const need=expNeed(S.L); if(S.L===9||S.L>=12){ if(S.exp>need){ got-=S.exp-need; S.exp=need; } break; } if(S.exp<need) break; S.exp-=need; S.L++; }
  return Math.max(0,got); }

/* ============================================================
   山海问道 · 风穴 — the 穷奇 dungeon, and the realm bottlenecks.
   风谷: gusts blow down the valley; shelter behind the rocks, gather three 穷奇羽 to break the wind wall.
   枯骨林: a fog you can barely see through, three phantoms of 穷奇's victims, three lanterns lit in the right order.
   风眼: 穷奇 in three phases (a whirlwind that drags your bead in, a rain of feathers), and 顾长歌 arrives at the end.
   Entering a layer saves; falling in the dungeon sends you back to the start of that layer.
   Bottlenecks: 炼气三层 needs three beasts slain, 炼气六层 needs the 风谷 crossed, 炼气九层 needs a 筑基丹.
   ============================================================ */

/* ---------- bottlenecks ---------- */
function bottleneck(L){
  if(!S) return null;
  if(L===3 && !((S.st.kills||0)>=3)) return '炼气三层瓶颈：去青丘山林击败 3 只野兽，在搏杀中感悟。';
  if(L===6 && !S.flags.fx_valley) return '炼气六层瓶颈：穿过风穴的风谷，在狂风里稳住心神。';
  return null;
}
{ const capped=L=>L===9||L>=12||!!bottleneck(L);
  // the same climb as before, but a bottleneck stops it like 炼气九层 does; returns how much actually landed
  const climb=n=>{ const L0=S.L, e0=S.exp; let up=false; S.exp+=n;
    while(true){ const need=expNeed(S.L); if(capped(S.L)){ if(S.exp>need) S.exp=need; break; } if(S.exp<need) break; S.exp-=need; S.L++; up=true; }
    const n2=bottleneck(S.L); if(n2&&S.exp>=expNeed(S.L)&&S._neckSaid!==S.L){ S._neckSaid=S.L; setTimeout(()=>UI.toast(n2),300); }
    return {up, got:S.L>L0?n:Math.max(0,S.exp-e0)}; };
  gainExp=function(n){ const {up}=climb(n); if(up){ const st=stats(); S.hp=st.hp; S.mp=st.mp; Sound.levelup(); UI.banner('突破！'+realmName(S.L)); } UI.hud(); Story.check(); };
  gainExpQuiet=function(n){ return climb(n).got; };
  const _full=Med.full; Med.full=function(){ return _full.call(Med) || (!!bottleneck(S.L) && S.exp>=expNeed(S.L)); };
  const _sim=Med.sim; Med.sim=function(h){ let L=S.L, exp=S.exp, total=0;
    for(let i=0;i<Med.blocks(h);i++){ const cap=(L===9||L>=12||bottleneck(L)); if(cap&&exp>=expNeed(L)) break; const g=Med.block(L), e0=exp; exp+=g;
      while(true){ const need=expNeed(L); if(L===9||L>=12||bottleneck(L)){ exp=Math.min(exp,need); break; } if(exp<need) break; exp-=need; L++; }
      total+=exp>=e0?exp-e0:g; }
    return {L, exp, total, capped:(L===9||L>=12||!!bottleneck(L))&&exp>=expNeed(L)}; };
  const _ahead=Med.ahead; Med.ahead=function(){ const out=[]; let L=S.L, exp=S.exp, blocks=0;
    while(out.length<4 && blocks<6*400){ const need=expNeed(L); if((L===9||L>=12||bottleneck(L))&&exp>=need) break; exp+=Med.block(L); blocks++;
      if(L!==9&&L<12&&!bottleneck(L)&&exp>=need){ exp-=need; L++; out.push([L,blocks]); } else if(exp>=need){ exp=need; out.push([L+.5,blocks]); } }
    return out.map(([L,b])=>[L===9.5?9.5:L%1?L:L,b]); };
}

/* ============================================================
   山海问道 · 宗门绝学动画 — each sect's signature move gets its own pixel animation in battle before the damage lands.
   青云剑宗 万剑归宗: a rain of flying swords, then one great sword. 药王谷 丹火: a golden flame gathers, flies, and bursts.
   万兽谷 兽魂共鸣: the pet's spirit, huge and glowing, charges in and claws. 天机阁 定身符: a talisman sticks and a bagua ring locks the foe.
   ============================================================ */
const SkillFx = {
  play(kind, done){
    const host=$('#battle'), en=$('#bEnemy'); if(!host||!en){ done(); return; }
    const hr=host.getBoundingClientRect(), er=en.getBoundingClientRect();
    const P=Math.max(2,Math.round(Math.min(hr.width,hr.height)/150)), W=Math.ceil(hr.width/P), H=Math.ceil(hr.height/P);
    const cv=document.createElement('canvas'); cv.className='skillfx px'; cv.width=W; cv.height=H; host.appendChild(cv);
    const g=cv.getContext('2d'), ex=(er.left+er.width/2-hr.left)/P, ey=(er.top+er.height/2-hr.top)/P, er2=Math.max(10,Math.min(er.width,er.height)/P/2.4);
    const fx=SkillFx[kind]; if(!fx){ cv.remove(); done(); return; }
    const sg=$('#battle .b-stage'), by=sg?(sg.getBoundingClientRect().bottom-hr.top)/P:H*.6, st={ex,ey,R:er2,W,H,by,parts:[],seed:1}; fx.init&&fx.init(st);
    const t0=performance.now(); let shook=false, fin=false;
    const end=()=>{ if(fin) return; fin=true; cv.classList.add('out'); setTimeout(()=>cv.remove(),260); done(); };
    const loop=now=>{ if(fin) return; const t=(now-t0)/1000; g.clearRect(0,0,W,H);
      try{ fx.draw(g,t,st); }catch(e){ return end(); }
      if(!shook&&t>=fx.hit){ shook=true; Sound.hit(); host.classList.remove('shake'); void host.offsetWidth; host.classList.add('shake'); }
      if(t>=fx.dur) return end(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop); setTimeout(end,(fx.dur+1)*1000);   // never hang the battle, even if frames stop
  },
  // small helpers on the low-res canvas
  r(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h))); },
  line(g,x0,y0,x1,y1,c){ const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0))); g.fillStyle=c; for(let i=0;i<=n;i++){ const u=i/n; g.fillRect(Math.round(x0+(x1-x0)*u),Math.round(y0+(y1-y0)*u),1,1); } },
  ring(g,cx,cy,r,c,gap){ g.fillStyle=c; const n=Math.max(12,Math.round(r*6)); for(let i=0;i<n;i++){ if(gap&&i%gap===0) continue; const a=i/n*Math.PI*2; g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1); } },
  flash(g,st,a,c){ if(a<=0) return; g.fillStyle=c.replace('A',a.toFixed(3)); g.fillRect(0,0,st.W,st.H); },
  sparks(st,x,y,n,cols,sp){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(sp||30)*(.4+Math.random()); st.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-10,life:.35+Math.random()*.3,t:0,c:cols[i%cols.length]}); } },
  runParts(g,st,dt){ st.parts=st.parts.filter(p=>{ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g??40)*dt; if(p.t>p.life) return false; SkillFx.r(g,p.x,p.y,p.s||1,p.s||1,p.c); return true; }); },
  dt(st,t){ const d=Math.min(.05,t-(st.last||t)); st.last=t; return d; },
};

/* 万剑归宗 — dozens of swords rain down on the beast, then one great sword falls */
SkillFx.jian={ dur:1.75, hit:.5,
  init(st){ st.sw=[]; for(let i=0;i<34;i++){ const at=i/34*.85+Math.random()*.05, tx=st.ex+(Math.random()-.5)*st.R*1.6, ty=st.ey+(Math.random()-.5)*st.R*1.1, sx=tx-st.H*.45-Math.random()*20, sy=-12-Math.random()*20;
    st.sw.push({at,tx,ty,sx,sy,dur:.26+Math.random()*.08,hit:false}); } },
  draw(g,t,st){ const F=SkillFx, dt=F.dt(st,t);
    F.flash(g,st,Math.min(.35,t*1.2)*(t<1.5?1:Math.max(0,(1.75-t)*4)),'rgba(14,26,52,A)');   // the sky darkens
    for(const s of st.sw){ const u=(t-s.at)/s.dur; if(u<0) continue;
      if(u<1){ const x=s.sx+(s.tx-s.sx)*u, y=s.sy+(s.ty-s.sy)*u, a=Math.atan2(s.ty-s.sy,s.tx-s.sx), c=Math.cos(a), si=Math.sin(a);
        F.line(g,x-c*16,y-si*16,x-c*9,y-si*9,'rgba(140,190,255,.35)');      // trail
        F.line(g,x-c*9,y-si*9,x,y,'#eaf4ff'); F.r(g,x,y,1,1,'#ffffff');      // blade
        F.line(g,x-c*11-si*2,y-si*11+c*2,x-c*11+si*2,y-si*11-c*2,'#e8b84a'); F.line(g,x-c*13,y-si*13,x-c*11,y-si*11,'#7a4a20'); }   // guard and hilt
      else { if(!s.hit){ s.hit=true; F.sparks(st,s.tx,s.ty,5,['#ffffff','#bfe0ff','#7fb2e8'],34); }
        const k=Math.min(1,(u-1)*s.dur/.5); if(k<1){ const a=Math.atan2(s.ty-s.sy,s.tx-s.sx), c=Math.cos(a), si=Math.sin(a); F.line(g,s.tx-c*7,s.ty-si*7,s.tx-c*2,s.ty-si*2,`rgba(220,236,255,${1-k})`); } } }
    // the great sword
    const gu=(t-1.0)/.22; if(gu>-0.6){ const x=st.ex, y=-30+(st.ey+4+30)*Math.min(1,Math.max(0,gu)), L=Math.round(st.R*2.2);
      if(gu<1.6){ const al=gu<1?1:Math.max(0,1-(gu-1)/.6);
        F.r(g,x-2,y-L,5,L,`rgba(234,244,255,${al})`); F.r(g,x,y-L,1,L,`rgba(255,255,255,${al})`); F.r(g,x-1,y,3,2,`rgba(234,244,255,${al})`);
        F.r(g,x-8,y-L-2,17,3,`rgba(232,184,74,${al})`); F.r(g,x-1,y-L-10,3,8,`rgba(122,74,32,${al})`); F.r(g,x-2,y-L-12,5,2,`rgba(232,184,74,${al})`);
        for(let k=1;k<5;k++) F.r(g,x-3-k,y-L-k*6,1,4,`rgba(140,190,255,${.3*al})`), F.r(g,x+3+k,y-L-k*6,1,4,`rgba(140,190,255,${.3*al})`); }
      if(gu>=1&&!st.boom){ st.boom=t; F.sparks(st,x,st.ey,26,['#ffffff','#bfe0ff','#e8b84a'],60); } }
    if(st.boom){ const k=(t-st.boom)/.5; F.flash(g,st,Math.max(0,.75*(1-k*2)),'rgba(235,245,255,A)'); if(k<1) F.ring(g,st.ex,st.ey,4+k*st.R*2.4,'rgba(200,225,255,'+(1-k).toFixed(2)+')',5); }
    F.runParts(g,st,dt); } };

/* 丹火 — a golden flame gathers below, flies up, and bursts into fire around the beast */
SkillFx.dan={ dur:1.6, hit:.62,
  draw(g,t,st){ const F=SkillFx, dt=F.dt(st,t), sx=st.W/2, sy=st.by-14;
    const fireCol=k=>k<.25?'#fff6c0':k<.5?'#ffd050':k<.75?'#ff9030':'#c83c28';
    if(t<.62){ const u=Math.min(1,t/.35), fly=Math.max(0,(t-.35)/.27), x=sx+(st.ex-sx)*fly, y=sy+(st.ey-sy)*fly-Math.sin(fly*Math.PI)*20, r=2+u*8;
      // spinning furnace sigil while it gathers
      if(fly===0){ F.ring(g,sx,sy,r+6+Math.sin(t*20),'rgba(255,200,80,.7)',3); for(let i=0;i<8;i++){ const a=t*6+i*Math.PI/4; F.r(g,sx+Math.cos(a)*(r+10),sy+Math.sin(a)*(r+10)*.5,1,1,'#ffd050'); } }
      for(let k=r+3;k>r;k--) F.ring(g,x,y,k,'rgba(255,160,40,.35)'); for(let k=r;k>=0;k--) F.ring(g,x,y,k,fireCol(1-k/Math.max(1,r))); F.r(g,x,y,1,1,'#ffffff');
      if(Math.random()<.9) st.parts.push({x:x+(Math.random()-.5)*r,y:y+(Math.random()-.5)*r,vx:(Math.random()-.5)*10,vy:10,g:-20,life:.3,t:0,c:'#ffb040'}); }
    else { if(!st.boom){ st.boom=1; F.sparks(st,st.ex,st.ey,30,['#fff6c0','#ffd050','#ff9030'],55); }
      const k=(t-.62)/.98; F.flash(g,st,Math.max(0,.5*(1-k*3)),'rgba(255,190,80,A)');
      F.ring(g,st.ex,st.ey,3+k*st.R*2,`rgba(255,200,90,${Math.max(0,1-k*1.4).toFixed(2)})`,4);
      // flames lick up around the beast
      for(let i=0;i<4;i++) if(k<.85) { const a=Math.random()*Math.PI*2, rr=st.R*(.4+Math.random()*.7); st.parts.push({x:st.ex+Math.cos(a)*rr,y:st.ey+Math.sin(a)*rr*.8,vx:(Math.random()-.5)*6,vy:-18-Math.random()*18,g:-10,life:.4+Math.random()*.3,t:0,c:'',fire:1,s:2}); } }
    st.parts=st.parts.filter(p=>{ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g??40)*dt; if(p.t>p.life) return false; F.r(g,p.x,p.y,p.s||1,p.s||1,p.fire?fireCol(p.t/p.life):p.c); return true; }); } };

/* 兽魂共鸣 — the pet's spirit, huge and glowing, charges in from the side and rakes the beast with three claws */
SkillFx.shou={ dur:1.55, hit:.55,
  init(st){ const kind=S.pet&&BEASTS[S.pet.kind]?BEASTS[S.pet.kind].spr:null; if(!kind) return;
    const sp=sprite(kind), sc=Math.max(2,Math.round(st.R*2.2/sp.height)), c=document.createElement('canvas'); c.width=sp.width+2; c.height=sp.height+2; const cg=c.getContext('2d');
    // a glowing rim: the silhouette in spirit-green, one pixel out on every side, then the beast itself, lightly tinted
    const sil=document.createElement('canvas'); sil.width=sp.width; sil.height=sp.height; const sg=sil.getContext('2d'); sg.drawImage(sp,0,0); sg.globalCompositeOperation='source-in'; sg.fillStyle='#b8ffd0'; sg.fillRect(0,0,sil.width,sil.height);
    for(const [dx,dy] of [[0,1],[2,1],[1,0],[1,2]]) cg.drawImage(sil,dx,dy);
    const tin=document.createElement('canvas'); tin.width=sp.width; tin.height=sp.height; const tg=tin.getContext('2d'); tg.drawImage(sp,0,0); tg.globalCompositeOperation='source-atop'; tg.fillStyle='rgba(170,255,200,.22)'; tg.fillRect(0,0,tin.width,tin.height);
    cg.drawImage(tin,1,1); st.ghost={c,sc}; },
  draw(g,t,st){ const F=SkillFx, dt=F.dt(st,t);
    F.flash(g,st,Math.min(.3,t)*(t<1.3?1:Math.max(0,(1.55-t)*4)),'rgba(8,30,18,A)');
    if(st.ghost){ const {c,sc}=st.ghost, w=c.width*sc, h=c.height*sc, u=Math.min(1,t/.5), e=1-Math.pow(1-u,3), x=-w+(st.ex-w*.95+w)*e, y=st.ey-h/2;
      g.imageSmoothingEnabled=false;
      for(let k=3;k>=1;k--){ g.globalAlpha=.18/k*(t<1.1?1:Math.max(0,(1.5-t)/.4)); g.drawImage(c,x-k*w*.18*(1-e),y,w,h); }   // afterimages
      g.globalAlpha=(t<1.1?.85:Math.max(0,(1.5-t)/.4)*.85); g.drawImage(c,x,y,w,h); g.globalAlpha=1; }
    // three claw marks, one after another
    for(let i=0;i<3;i++){ const at=.5+i*.1, k=(t-at)/.35; if(k<0||k>1.4) continue; const o=(i-1)*st.R*.35, len=st.R*1.5, p=Math.min(1,k*2.5), al=k<1?1:Math.max(0,1-(k-1)/.4);
      const x0=st.ex-len/2+o, y0=st.ey-len/2, x1=x0+len*p, y1=y0+len*p;
      F.line(g,x0,y0,x1,y1,`rgba(255,255,255,${al})`); F.line(g,x0+1,y0,x1+1,y1,`rgba(150,255,190,${al*.8})`); F.line(g,x0-1,y0,x1-1,y1,`rgba(242,193,78,${al*.6})`);
      if(k>.4&&!st['c'+i]){ st['c'+i]=1; F.sparks(st,x1,y1,8,['#ffffff','#96ffbe','#f2c14e'],40); } }
    F.runParts(g,st,dt); } };

/* 定身符 — a talisman flies up and sticks; a bagua ring and chains of light lock the beast in place */
SkillFx.tianji={ dur:1.7, hit:.5,
  draw(g,t,st){ const F=SkillFx, dt=F.dt(st,t), sx=st.W/2, sy=st.by-10;
    F.flash(g,st,Math.min(.3,t)*(t<1.4?1:Math.max(0,(1.7-t)*3.3)),'rgba(20,10,40,A)');
    const u=Math.min(1,t/.45), x=sx+(st.ex-sx)*u, y=sy+(st.ey-6-sy)*u, wob=u<1?Math.sin(t*30)*2:0;
    // the talisman: yellow paper, red script
    const tw=8, th=14; F.r(g,x-tw/2+wob,y-th/2,tw,th,'#f2d27a'); F.r(g,x-tw/2+wob,y-th/2,tw,1,'#c83c28'); F.r(g,x-tw/2+wob,y+th/2-1,tw,1,'#c83c28');
    for(let i=0;i<4;i++) F.r(g,x-1+wob+(i%2?1:-1),y-th/2+3+i*2.4,i%2?2:3,1,'#b0281c'); F.r(g,x+wob,y-th/2+2,1,th-4,'#b0281c');
    if(u>=1){ const k=(t-.45)/1.25;
      if(!st.stuck){ st.stuck=1; F.sparks(st,st.ex,st.ey,16,['#e8d0ff','#a070ff','#f2d27a'],40); }
      // bagua ring: eight trigrams on a turning circle
      const R=Math.min(st.R*1.5,6+k*st.R*4), rot=t*1.6, al=k<.8?1:Math.max(0,1-(k-.8)/.2);
      F.ring(g,st.ex,st.ey,R,`rgba(180,140,255,${al})`); F.ring(g,st.ex,st.ey,R-3,`rgba(180,140,255,${al*.5})`,3);
      for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4, cx=st.ex+Math.cos(a)*(R+5), cy=st.ey+Math.sin(a)*(R+5);
        for(let j=0;j<3;j++){ const broken=((i>>j)&1); if(broken){ F.r(g,cx-3,cy-2+j*2,2,1,`rgba(230,210,255,${al})`); F.r(g,cx+1,cy-2+j*2,2,1,`rgba(230,210,255,${al})`); } else F.r(g,cx-3,cy-2+j*2,6,1,`rgba(230,210,255,${al})`); } }
      // chains of light from the four corners
      const ch=Math.min(1,(t-.6)/.3); if(ch>0) for(const [cx,cy] of [[0,0],[st.W,0],[0,st.H],[st.W,st.H]]){ const n=24; for(let i=0;i<n*ch;i++){ if(i%3===2) continue; const q=i/n; F.r(g,cx+(st.ex-cx)*q,cy+(st.ey-cy)*q,1,1,`rgba(200,170,255,${al*.85})`); } } }
    F.runParts(g,st,dt); } };

// the sect move waits for its animation, then lands as before (the self-test skips the show)
{ const _act=Battle.act; Battle.act=function(a){ const s=Battle.s;
    if(a==='sect'&&s&&!s.over&&!s.busy&&!s.dead&&!s.charmed&&S.sect&&SECTS[S.sect]&&S.mp>=SECTS[S.sect].skill.mp&&!Dodge.auto){

      SkillFx.play(S.sect, ()=>{ $('#battle')&&$('#battle').classList.remove('fxing'); if(Battle.s!==s) return; s.busy=false; _act.call(Battle,a); }); return; }
    return _act.call(Battle,a); }; }

/* ============================================================
   山海问道 · 新手引导 — one short tip the first time each thing comes up (walk, tasks, interact, bag, meditate, dodge),

const TIPS = {

  seen(k){ S.tips=S.tips||{}; return !!S.tips[k]; },
  show(k, cb){

    const t=TIPS[k], el=document.createElement('div'); el.className='tip wood'; el.innerHTML=`<span class="tip-i">💡</span><p>${FINE_POINTER?t.key:t.touch}</p><button class="btn mini">知道了</button>`;
    document.body.appendChild(el); requestAnimationFrame(()=>el.classList.add('on'));
    let done=false; const close=()=>{ if(done) return; done=true; el.classList.remove('on'); setTimeout(()=>el.remove(),250); cb&&cb(); };
    el.querySelector('button').onclick=e=>{ e.stopPropagation(); Sound.tick(); close(); }; el.onclick=close; setTimeout(close, cb?9000:7000);

  // checked once a second: the first tip whose moment has come
  tick(){
    if(!S||!RT.map||UI.busy()||Dodge.auto||$('.tip')||(!S.flags.intro_done)) return;

      if(q && st!=='done'){
        if(!st) return {kind:'avail', id:q.id, title:q.title, desc:q.desc, progress:'去找'+npcAt(q.giver)[3]+'接取', target:npcAt(q.giver)};
        return {kind:'side', id:q.id, title:q.title, desc:q.desc, progress:sideReady(S,q)?'可以交付了':sideProgress(S,q), target:q.target(S)};
      }
      S.track='main';
    }
    const q=QUESTS[S.quest]; if(!q) return null;
    return {kind:'main', id:q.id, title:q.title, desc:q.desc, progress:q.progress?q.progress(S):'', target:q.target?q.target(S):null};
  },
  goal(){
    const tr=Nav.tracked(), t=tr&&tr.target; if(!t||!RT.map) return null;
    if(t[0]===RT.mapId) return {x:t[1], y:t[2], final:true, label:t[3]};
    const prev={[RT.mapId]:null}, q=[RT.mapId];
    while(q.length){ const m=q.shift(); if(m===t[0]) break; for(const e of MAPS[m].exits) if(!(e.to in prev)){ prev[e.to]=m; q.push(e.to); } }
    if(!(t[0] in prev)) return null;
    let m=t[0]; while(prev[m]!==RT.mapId) m=prev[m];
    const exits=RT.map.exits.filter(e=>e.to===m).sort((a,b)=>(Math.abs(a.x-S.x)+Math.abs(a.y-S.y))-(Math.abs(b.x-S.x)+Math.abs(b.y-S.y)));
    return {x:exits[0].x, y:exits[0].y, final:false, label:'前往'+MAPS[m].name.replace(/.*· /,'')};
  },
  pathTo(g){
    const solid=RT.solid[g.y]&&RT.solid[g.y][g.x];
    const reach = !g.final ? (x,y)=>x===g.x&&y===g.y
      : solid ? (x,y)=>Math.abs(x-g.x)+Math.abs(y-g.y)===1 : (x,y)=>Math.abs(x-g.x)+Math.abs(y-g.y)<=1;
    return bfs(S.x,S.y,reach);
  },
  tick(dt){
    RT.navT-=dt; if(RT.navT>0) return; RT.navT=0.25;
    const g=Nav.goal(); RT.navGoal=g; RT.navPath=g&&S.gps!==false?(Nav.pathTo(g)||[]):[];
    UI.miniDraw();
  },
  go(cont){
    if(UI.busy()&&!cont) UI.closePanel();
    const g=Nav.goal(); if(!g){ UI.toast('这个任务没有要去的地方'); return; }
    const p=Nav.pathTo(g); if(!p){ UI.toast('找不到路'); RT.autoNav=false; return; }
    RT.autoNav=true; RT.pending=null; RT.keys=[];
    if(!p.length){ Nav.arrive(); return; }
    setPath(p); if(!cont) UI.toast('自动寻路：'+g.label);
  },
  arrive(){
    RT.autoNav=false; const g=Nav.goal(); if(!g||!g.final) return;
    const o=entAt(g.x,g.y);
    if(o&&(o.type==='npc'||o.act||o.type==='gather')){ face(g.x,g.y); interact(o); }
    else UI.toast('到了：'+g.label);
  },
  drawWorld(g, ox, oy, T, Z){
    const goal=RT.navGoal; if(!goal) return;
    // breadcrumb trail: flowing gold dots
    const path=RT.navPath;
    for(let i=0;i<path.length && i<40;i++){
      const [x,y]=path[i], a=0.35+0.45*Math.max(0,Math.sin(RT.t*5-i*0.6)), r=(i%2?1:1.6)*Z;
      g.fillStyle=`rgba(255,214,90,${a})`; g.beginPath(); g.arc(ox+(x+.5)*T, oy+(y+.55)*T, r, 0, 7); g.fill();
    }
    // target marker
    const mx=ox+(goal.x+.5)*T, my=oy+goal.y*T - (4+Math.abs(Math.sin(RT.t*3))*4)*Z;
    g.fillStyle='rgba(255,214,90,.25)'; g.beginPath(); g.ellipse(ox+(goal.x+.5)*T, oy+(goal.y+.85)*T, 7*Z, 3*Z, 0, 0, 7); g.fill();
    g.fillStyle='#ffd65a'; g.strokeStyle='#5a2e12'; g.lineWidth=Z;
    g.beginPath(); g.moveTo(mx-4*Z,my-6*Z); g.lineTo(mx+4*Z,my-6*Z); g.lineTo(mx,my); g.closePath(); g.fill(); g.stroke();
  },
  drawArrow(g, ox, oy, T, Z){
    const goal=RT.navGoal; if(!goal) return;
    const tx=ox+(goal.x+.5)*T, ty=oy+(goal.y+.5)*T, W=cv.width, H=cv.height, m=40*RT.dpr;
    if(tx>m&&tx<W-m&&ty>m*2.2&&ty<H-m*2.2) return;
    const px=ox+(RT.fx+.5)*T, py=oy+(RT.fy+.2)*T, ang=Math.atan2(ty-py,tx-px);
    // the arrow circles the hero, so it never hides behind the HUD
    const ax=px+Math.cos(ang)*T*1.5, ay=py+Math.sin(ang)*T*1.5, s=5*RT.dpr*Math.max(1,RT.scale/2.5);
    g.save(); g.translate(ax,ay);
    g.globalAlpha=0.75+0.25*Math.sin(RT.t*5); g.fillStyle='rgba(74,35,11,.85)'; g.beginPath(); g.arc(0,0,s*1.6,0,7); g.fill();
    g.rotate(ang); g.fillStyle='#ffd65a'; g.beginPath(); g.moveTo(s,0); g.lineTo(-s*.7,-s*.75); g.lineTo(-s*.3,0); g.lineTo(-s*.7,s*.75); g.closePath(); g.fill();
    g.restore(); g.globalAlpha=1;
  },
};

/* ---------- minimap ---------- */
const TILECOL = {'.':'#6fbf4f',',':'#78c556',':':'#4f9a3a','=':'#d4ae78','#':'#cdbfa6','~':'#4a9fd8','B':'#a8743f','W':'#7d6c58','F':'#b98b5a','f':'#8a5a36'};
const MINIC = {};
function miniBase(id){
  if(MINIC[id]) return MINIC[id]; const m=MAPS[id], s=3, c=document.createElement('canvas'); c.width=m.w*s; c.height=m.h*s; const g=c.getContext('2d');
  for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){ g.fillStyle=TILECOL[m.ground[y][x]]||'#6fbf4f'; g.fillRect(x*s,y*s,s,s); }
  for(const o of m.objects){
    if(o.type==='building'){ g.fillStyle='#7a3d3d'; g.fillRect(o.x*s,o.y*s,o.w*s,o.h*s); g.fillStyle='#f3e3c3'; g.fillRect(o.x*s+1,(o.y+o.h)*s-2,o.w*s-2,2); }
    else if(o.type==='tree'||o.type==='pine'||o.type==='bush'){ g.fillStyle='#2f6b2c'; g.fillRect(o.x*s,o.y*s,s,s); }
    else if(o.type==='rock'){ g.fillStyle='#9aa0a6'; g.fillRect(o.x*s,o.y*s,s,s); }
    else if(o.type==='shrine'){ g.fillStyle='#c8413b'; g.fillRect(o.x*s-1,o.y*s-1,s+2,s+2); }
    else if(o.type==='futon'||o.type==='furnace'){ g.fillStyle='#e8b84a'; g.fillRect(o.x*s,o.y*s,s,s); }
  }
  for(const e of m.exits){ g.fillStyle='#fff3a0'; g.fillRect(e.x*s,e.y*s,s,s); }
  return MINIC[id]=c;
}
UI.miniReset=()=>{ const c=$('#mini'); if(!c||!RT.map) return; const b=miniBase(RT.mapId); c.width=b.width; c.height=b.height; UI.miniDraw(); };
UI.miniDraw=()=>{
  const c=$('#mini'); if(!c||!RT.map) return; const g=c.getContext('2d'), s=3; if(c.width!==miniBase(RT.mapId).width) return UI.miniReset();
  g.drawImage(miniBase(RT.mapId),0,0);
  for(const o of RT.ents) if(o.type==='npc'){ g.fillStyle='#4a7fd0'; g.fillRect(o.x*s,o.y*s,s,s); }
  for(const b of RT.beasts){ g.fillStyle='#e0402e'; g.fillRect(Math.round(b.fx*s),Math.round(b.fy*s),s,s); }
  const goal=RT.navGoal; if(goal){ g.fillStyle=(Math.floor(RT.t*3)%2)?'#ffd65a':'#fff'; g.fillRect(goal.x*s-1,goal.y*s-1,s+2,s+2); }
  g.fillStyle='#fff'; g.fillRect(Math.round(RT.fx*s)-1,Math.round(RT.fy*s)-1,s+2,s+2); g.fillStyle='#c8413b'; g.fillRect(Math.round(RT.fx*s),Math.round(RT.fy*s),s,s);
};

Story.finishSide=(q, after)=>{
  if(q.need) for(const [k,n] of Object.entries(q.need)) addItem(k,-n);
  S.side[q.id]='done'; const r=q.reward||{}; if(r.stones){ S.stones+=r.stones; } if(r.give) for(const k in r.give) addItem(k,r.give[k]);
  if(r.energy){ S.bonusEnergy=(S.bonusEnergy||0)+r.energy; S.energy+=r.energy; }
  if(r.atk) S.bonusAtk=(S.bonusAtk||0)+r.atk;
  if(r.exp) gainExp(r.exp);
  if(r.petlv&&S.pet) S.pet.lv+=r.petlv;
  if(r.tianji){ S.flags.tianji_up=true; if(S.fortune===3) S.fortune=2; }
  if(r.heart) for(const k in r.heart) Social.add(k,r.heart[k]);
  if(S.track===q.id) S.track='main'; UI.hud();
  UI.say(q.done.concat([['旁白',`完成支线「${q.title}」`+([r.stones?`灵石 +${r.stones}`:'', ...Object.keys(r.give||{}).map(k=>ITEMS[k].name+'×'+r.give[k]), r.energy?`体力上限 +${r.energy}`:'', ...Object.keys(r.heart||{}).map(k=>NPCS[k].name+'好感 ↑')].filter(Boolean).map((x,i)=>(i?'，':'：')+x).join(''))]]), after);
  Sound.coin(); return true;
};
Story.side=(id, after)=>{
  for(const q of SIDES){ if(q.giver!==id||!q.unlock(S)) continue; const st=S.side[q.id];
    if(st==='active' && sideReady(S,q)){
      if(q.deliverAt==='shrine'){ UI.say([[NPCS[id].name,'灵草带来了？那就去山林南边的青丘狐祠，供在香炉前吧。']], after); return true; }
      return Story.finishSide(q, after);
    }
    if(!st){ S.side[q.id]='active'; if(q.count) S.side[q.id+'_base']=sideCountNow(S,q.count); S.track=q.id; UI.hud(); RT.navT=0;
      UI.say(q.start.concat([['旁白',`接下支线「${q.title}」，已设为追踪。`]]), after); return true; }
  }
  return false;
};

/* ============================================================
   山海问道 · saving: autosave + three manual snapshots per profile + a "测灵根前" snapshot
   Players may save any time outside battles and mini-games (and reroll their roots — that's a feature).
   ============================================================ */
const SaveSys = {
  SNAPS:['m1','m2','m3'],
  key(slot, snap){ return slotKey(slot)+'.'+snap; },
  canSave(){ return !!S && !Battle.s && !UI.fx && !(typeof Replay!=='undefined'&&Replay.active); },
  meta(s){ const q=QUESTS[s.quest]; return {name:s.name, realm:realmName(s.L), day:s.day, time:fmtTime(s.min), map:MAPS[s.map]?MAPS[s.map].name:'', quest:q?q.title:'', root:s.root?ROOT_KINDS[s.root.n].name+'（'+s.root.els.join('')+'）':'未测', at:Date.now()}; },
  read(slot, snap){ try{ return JSON.parse(localStorage.getItem(SaveSys.key(slot,snap))||'null'); }catch(e){ return null; } },
  write(snap){
    if(!SaveSys.canSave()) return false;
    S.x=S.x; const rec={meta:SaveSys.meta(S), state:S};
    try{ localStorage.setItem(SaveSys.key(RT.slot,snap), JSON.stringify(rec)); save(); return true; }catch(e){ return false; }
  },
  // load a snapshot into this profile's slot and step into it
  load(slot, snap){
    const rec=SaveSys.read(slot,snap); if(!rec) return false;
    RT.slot=slot; S=JSON.parse(JSON.stringify(rec.state)); S=C2.rollback(loadFromObject(S));
    Sect.migrate(); Hooks.placeQiyu(); save();
    Battle.s&&Battle.close(); Mini.close(); $('#dlg').hidden=true; UI.dlgQ=null; $('#panel').hidden=true; $('#title').hidden=true; clearInterval(Creator.timer);

    if(!S.flags.intro_done && S.quest===0){ UI.say(S.root?SCRIPTS.intro_post:SCRIPTS.intro, ()=>{ S.questStarted=0; Story.check(); }); return; }
    Story.check();
  },
  ago(t){ const m=Math.round((Date.now()-t)/60000); return m<1?'刚刚':m<60?m+' 分钟前':m<1440?Math.round(m/60)+' 小时前':Math.round(m/1440)+' 天前'; },

      <div class="sc-r">${canWrite?`<button class="btn mini" data-sv="${snap}">${m?'覆盖':'存到这里'}</button>`:''}${m?`<button class="btn mini main" data-ld="${slot}:${snap}">读取</button>`:''}</div></div>`;
  },
  bind(root, after){
    root.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{
      if(b.textContent==='覆盖'){ b.textContent='确定覆盖？'; return; }

      <div class="savecard auto"><div class="sc-l"><b>自动存档</b>${auto?`<span>${realmName(auto.L)} · 第 ${auto.day} 天 ${fmtTime(auto.min)}</span>`:'<span class="muted">（空）</span>'}</div><div class="sc-r"><button class="btn mini" id="svAuto">立即自动存档</button></div></div>
      ${SaveSys.SNAPS.map((s,i)=>SaveSys.card(RT.slot,s,'手动存档 '+(i+1),true)).join('')}
      ${SaveSys.read(RT.slot,'pre_root')?SaveSys.card(RT.slot,'pre_root','测灵根前（自动）',false):''}
      <p class="muted">想重新测灵根？读取「测灵根前」即可。</p>`, b=>{
        $('#svAuto').onclick=()=>{ if(!SaveSys.canSave()) return UI.toast('战斗或小游戏中不能存档'); UI.toast(save()?'已存档':'存档失败'); Sound.coin(); UI.closePanel(); SaveSys.panel(); };

function loadFromObject(s){ s.side=s.side||{}; s.track=s.track||'main'; s.look=s.look||defaultLook('m'); s.name=s.name||'无名'; s.st.meditated=s.st.meditated||0; if(s.quest>0) (s.flags=s.flags||{}).intro_done=true; return s; }

/* ---------- carry a save to another browser or phone: a file, or a code to paste ----------
   Each browser keeps its own saves (Safari, WeChat, the app you tapped the link in…), so a save can be taken along by hand. */
const Carry = {
  PREFIX:'山海问道存档:',
  enc(s){ return btoa(unescape(encodeURIComponent(JSON.stringify({game:'shanhai-wendao', v:1, at:Date.now(), save:s})))); },
  code(s){ return Carry.PREFIX+Carry.enc(s); },
  // accepts a code (with or without the prefix) or the text of a save file
  parse(text){ text=String(text||'').trim(); let o=null;
    try{ if(text.startsWith('{')) o=JSON.parse(text); else o=JSON.parse(decodeURIComponent(escape(atob(text.replace(Carry.PREFIX,'').replace(/\s+/g,''))))); }catch(e){ return null; }
    const s=o&&o.save?o.save:o; if(!s||typeof s!=='object'||s.L==null||s.quest==null||!s.flags||!s.inv) return null;
    if(!MAPS[s.map]){ s.map='home'; s.x=11; s.y=6; } return s; },
  fileName(s){ return `山海问道-${s.name||'存档'}-第${s.day}天.json`; },
  download(s){ const blob=new Blob([JSON.stringify({game:'shanhai-wendao', v:1, at:Date.now(), save:s})],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=Carry.fileName(s); document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); },
  async copy(text){ try{ await navigator.clipboard.writeText(text); return true; }catch(e){ return false; } },
  // the export block (存档 page)
  exportHTML(){ return `<div class="carry wood"><b>带走存档（换浏览器、换手机）</b>
      <p class="muted">每个浏览器的存档是分开的：Safari、微信里打开、从聊天窗口点开，都各存各的。想在别处接着玩，就把存档带过去。</p>
      <div class="carry-btns"><button class="btn mini main" id="cxFile">导出存档文件</button><button class="btn mini" id="cxCode">复制存档码</button><button class="btn mini" id="cxIn">导入存档</button></div>
      <textarea id="cxOut" class="carry-code" readonly hidden></textarea></div>`; },
  bindExport(b){
    $('#cxFile',b).onclick=()=>{ save(); Carry.download(S); Sound.coin(); UI.toast('已导出。iPhone 可以选「存储到“文件”」'); };
    $('#cxCode',b).onclick=async()=>{ save(); const c=Carry.code(S), ok=await Carry.copy(c), t=$('#cxOut',b); t.hidden=false; t.value=c; t.select();
      UI.toast(ok?'存档码已复制，可以发到微信，在另一处「导入存档」时粘贴':'请长按下面的存档码全选、复制'); };
    $('#cxIn',b).onclick=()=>{ Sound.tick(); UI.closePanel(); UI.panel('导入存档', `<div id="cxForm"></div>`, p=>Carry.form($('#cxForm',p), RT.slot, true)); };
  },
  // the import form; on the title screen you pick which of the three profiles it goes into
  form(host, slot, inGame){
    const slots=[...Array(SLOTS)].map((_,i)=>readSlot(i));
    host.innerHTML=`<div class="carry wood"><b>导入存档</b>
      <p class="muted">选一个存档文件，或者把存档码粘贴到下面。</p>
      <input type="file" id="ciFile" accept=".json,.txt,application/json,text/plain">
      <textarea id="ciCode" class="carry-code" placeholder="粘贴存档码（以「山海问道存档:」开头）"></textarea>
      ${inGame?`<p class="muted">导入后会替换当前这个存档（${esc(S.name||'')}）。</p>`:`<div class="carry-slots">${slots.map((s,i)=>`<label><input type="radio" name="ciSlot" value="${i}" ${i===slot?'checked':''}> 存档 ${i+1}${s?'（'+esc(s.name||'无名')+'，会被替换）':'（空）'}</label>`).join('')}</div>`}
      <div class="carry-btns"><button class="btn mini main" id="ciGo">导入</button><button class="btn mini" id="ciX">取消</button></div><p class="muted" id="ciMsg"></p></div>`;
    let fileText='';
    $('#ciFile',host).onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ fileText=String(r.result); $('#ciMsg',host).textContent='已选择：'+f.name; }; r.readAsText(f); };
    $('#ciX',host).onclick=()=>{ Sound.tick(); if(inGame) UI.closePanel(); else host.innerHTML=''; };
    $('#ciGo',host).onclick=()=>{
      const s=Carry.parse(fileText||$('#ciCode',host).value); if(!s){ $('#ciMsg',host).textContent='没认出这个存档，请检查文件或存档码是否完整。'; Sound.hurt(); return; }
      const i=inGame?RT.slot:+((host.querySelector('[name=ciSlot]:checked')||{}).value||0);
      try{ localStorage.setItem(slotKey(i), JSON.stringify(s)); }catch(e){ $('#ciMsg',host).textContent='保存失败（浏览器存储已满或被禁用）。'; return; }
      Sound.levelup(); UI.toast(`导入成功：${s.name||'无名'} · ${realmName(s.L)} · 第 ${s.day} 天`);
      if(inGame){ UI.closePanel(); S=loadSave(i); Sect.migrate(); enterMap(S.map,S.x,S.y); UI.hud(); UI.sync(); Story.check(); } else UI.title(); };
  },
};
