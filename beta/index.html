  /* ---------- 天劫：dodge the lightning ---------- */
  tribulation(done){
    const lanes=5; let pos=2, hp=3, t=0, wave=0, strikes=[], nextAt=1.2;
    const el=Mini.open(`<div class="mg wood trib"><h3>天劫</h3><p class="mg-tip" id="trTip">左右移动，躲开落下的天雷！</p>
      <div class="arena" id="trArena">${'<div class="lane"></div>'.repeat(lanes)}<div class="me" id="trMe"></div></div>
      <div class="trib-hp" id="trHp"></div><div class="mg-btns"><button class="btn big" id="trL">◀ 左</button><button class="btn big" id="trR">右 ▶</button></div></div>`);
    const me=$('#trMe'), ln=[...el.querySelectorAll('.lane')]; me.innerHTML=''; const pc=document.createElement('canvas'); pc.className='px'; const sp=lookSprite(S.look,'up',0); pc.width=sp.width; pc.height=sp.height; pc.getContext('2d').drawImage(sp,0,0); me.appendChild(pc);
    const move=d=>{ pos=Math.max(0,Math.min(lanes-1,pos+d)); Sound.tick(); };
    $('#trL').onclick=()=>move(-1); $('#trR').onclick=()=>move(1);
    $('#trArena').onpointerdown=e=>{ const r=e.currentTarget.getBoundingClientRect(); pos=Math.max(0,Math.min(lanes-1,Math.floor((e.clientX-r.left)/r.width*lanes))); };
    const kd=e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA') move(-1); if(e.code==='ArrowRight'||e.code==='KeyD') move(1); }; addEventListener('keydown',kd);
    Music.stinger('thunder');
    Mini.run(dt=>{
      t+=dt; me.style.left=(pos/lanes*100)+'%'; $('#trHp').textContent='护体 '+'◆'.repeat(hp)+'◇'.repeat(3-hp)+'　·　第 '+Math.min(3,wave+1)+' / 3 道天雷';
      if(t>=nextAt && wave<3){ const n=1+wave; const set=new Set(); while(set.size<Math.min(lanes-1,n+1)) set.add(Math.floor(Math.random()*lanes));
        for(const l of set){ strikes.push({l, at:t+.9}); ln[l].classList.add('warn'); } wave++; nextAt=t+2.1; }
      for(const s of strikes){ if(!s.done && t>=s.at){ s.done=true; ln[s.l].classList.remove('warn'); ln[s.l].classList.add('bolt'); setTimeout(()=>ln[s.l]&&ln[s.l].classList.remove('bolt'),300);
        Music.stinger('thunder'); if(s.l===pos){ hp--; Sound.hurt(); el.querySelector('.trib').classList.remove('shake'); void el.offsetWidth; el.querySelector('.trib').classList.add('shake'); } } }
      if(hp<=0 || (wave>=3 && strikes.every(s=>s.done) && t>nextAt-1)){ Mini.stop(); removeEventListener('keydown',kd); const ok=hp>0;

        $('#trOk').onclick=()=>{ Mini.close(); done(ok); }; }
    });

  fishPick(){

      else if(phase==='bite'){ phase='reel'; Mini.reel(fish); } };
    Mini.run(dt=>{ t+=dt; if(phase==='wait'&&t>=bite){ phase='bite'; biteT=t; if(RT.fishing) RT.fishing.bite=true; $('#fsTip').textContent='咬钩了！快收竿！'; $('#fsBob').classList.add('bite'); Sound.pick(); }
      if(phase==='bite'&&t-biteT>.9){ phase='end'; $('#fsTip').textContent='鱼儿溜走了……'; $('#fsBob').classList.remove('bite'); setTimeout(()=>{ Mini.close(); Music.play(areaTheme()); },900); } });

  reel(fish){
    const el=$('#minigame'), it=ITEMS[fish.id];
    el.innerHTML=`<div class="mg wood fishg"><h3>收线！</h3><div class="reel-wrap"><div class="reel"><div class="catch" id="rcBox"></div><div class="fishi" id="rcFish"><img class="px" src="${iconURL(it.icon,it.color)}" alt=""></div></div>

    let b=.1, bv=0, f=.5, fv=0, fTarget=.5, p=.3, holding=false, t=0; const box=.26; const unbind=Mini.hold($('#rcBtn'), x=>holding=x);

      t+=dt; bv+=(holding?1.8:-1.6)*dt; bv*=.93; b=Math.max(0,Math.min(1-box,b+bv*dt*2)); if(b===0||b===1-box) bv=0;
      if(Math.random()<dt*fish.jumpy) fTarget=Math.random(); f+=(fTarget-f)*Math.min(1,dt*fish.speed*2);

  newDay(){
    if(!S.rel) return; let sent=0; const ids=Object.keys(NPCS).sort(()=>Math.random()-.5);
    for(const id of ids){
      if(sent>=2) break; const h=Social.hearts(id); if(h<4||!LETTERS[id]) continue;
      const rom=NPCS[id].romance, chance=rom?(h>=8?.45:h>=6?.35:.25):(h>=6?.18:.1);

      const pool=LETTERS[id].map((l,i)=>[l,i]).filter(([l])=>h>=l.min), seen=(S.mailSeen=S.mailSeen||{})[id]||[];
      const fresh=pool.filter(([,i])=>!seen.slice(-2).includes(i)), pick=(fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length||pool.length))];
      if(!pick) continue; S.mailSeen[id]=[...seen,pick[1]].slice(-4);
      Mail.list().unshift({id, from:NPCS[id].name, li:pick[1], day:S.day, read:false, taken:false}); sent++;

const REP_SHOP=[{id:'juqi',n:1,cost:1},{id:'huichun',n:2,cost:2},{id:'xueshen',n:1,cost:3},{id:'peiyuan',n:1,cost:4},{id:'zhuguo',n:2,cost:4},{id:'wuse',n:1,cost:6},{id:'rod_bamboo',n:1,cost:8,once:true}];

const BOUNTY_KINDS = [

  {kind:'qiyu', make:()=>S.qiyu&&!S.qiyu.done ? {key:S.qiyu.ev, n:1, who:'云游子', text:'听说青丘山林里今天有异象——去看看是什么（找到奇遇）', pay:40, rep:2} : null},
];
const Bounty = {
  rep(){ return S.rep||0; },
  rank(){ let r=0; RANKS.forEach(([n],i)=>{ if(Bounty.rep()>=n) r=i; }); return r; },
  // the day's requests: three (four from 桃源侠士 up), never two of the same kind+target
  roll(){
    const want=Bounty.rank()>=2?4:3, list=[], mul=1+.25*Bounty.rank();
    for(let tries=0; list.length<want && tries<40; tries++){
      const K=BOUNTY_KINDS[Math.random()*BOUNTY_KINDS.length|0], b=K.make(); if(!b) continue;
      // different kinds first; repeats of a kind only once every kind is on the board
      const kinds=new Set(list.map(x=>x.kind)), avail=BOUNTY_KINDS.filter(k=>k.kind!=='qiyu'||(S.qiyu&&!S.qiyu.done)).length;
      if(kinds.has(K.kind)&&kinds.size<avail) continue;
      if(list.some(x=>x.kind===K.kind&&x.key===b.key)) continue;
      if(K.kind==='qiyu'&&kinds.has('qiyu')) continue;
      list.push({...b, kind:K.kind, pay:Math.round(b.pay*mul), done:false});

  },
  today(){ if(!S.bounty||S.bounty.day!==S.day) Bounty.roll(); return S.bounty; },
  prog(b){
    if(b.kind==='kill') return Math.min(b.n, ((S.st.kb||{})[b.key]||0)-b.base);
    if(b.kind==='item') return Math.min(b.n, S.inv[b.key]||0);
    if(b.kind==='gift') return Social.rel(b.key).gifted===S.day?1:0;
    if(b.kind==='qiyu') return S.qiyu&&S.qiyu.ev===b.key&&S.qiyu.done?1:0;
    return 0; },
  ready(b){ return !b.done && Bounty.prog(b)>=b.n; },
  claim(i){

    const r0=Bounty.rank(); b.done=true; S.stones+=b.pay; S.rep=Bounty.rep()+b.rep; Sound.coin();
    let msg=`完成悬赏：灵石 +${b.pay}，声望 +${b.rep}`;
    if(!B.bonus && B.list.every(x=>x.done)){ B.bonus=true; S.rep+=1; addItem('juqi',1); msg+='　·　今日悬赏全部完成！额外 声望 +1、聚气丹 ×1'; }
    UI.toast(msg); UI.hud();

  open(){

      <div class="blist">${B.list.map((b,i)=>{ const p=Bounty.prog(b);
        return `<div class="bnote ${b.done?'done':Bounty.ready(b)?'ready':''}"><small>${esc(b.who)}</small><b>${esc(b.text)}</b>
          <div class="brow"><span>${b.done?'✓ 已完成':`进度 ${p}/${b.n}`}</span><span class="bpay">灵石 ${b.pay}　声望 ${b.rep}</span>
          ${b.done?'':`<button class="btn mini ${Bounty.ready(b)?'main':''}" data-c="${i}" ${Bounty.ready(b)?'':'disabled'}>${b.kind==='item'?'交付':'领赏'}</button>`}</div></div>`; }).join('')}</div>
      <h4>声望兑换</h4><div class="bshop">${REP_SHOP.map((it,i)=>`<button class="bitem" data-b="${i}" ${Bounty.rep()<it.cost||(it.once&&S.inv[it.id])?'disabled':''}><img class="px" src="${iconURL(ITEMS[it.id].icon,ITEMS[it.id].color)}" alt=""><span>${ITEMS[it.id].name}×${it.n}</span><em>${it.cost} 声望</em></button>`).join('')}</div></div>`, b=>{

};

/* ============================================================
   山海问道 · 闭关 — choose how long to meditate (two hours up to a month), see which realm you will reach,
   then watch a progress bar. Long sessions pass whole days (letters, 奇遇 and fortunes still roll each morning).
   Midnight no longer knocks you out: the day simply turns over.
   ============================================================ */
const MED_STEPS = [[2,'2 小时'],[4,'4 小时'],[6,'半天'],[24,'1 天'],[48,'2 天'],[72,'3 天'],[120,'5 天'],[168,'7 天'],[240,'10 天'],[360,'15 天'],[720,'30 天']];
const Med = {
  // cultivation from one 2-hour block at level L; a full day counts as six blocks (the rest is eating and sleeping)
  block(L){ return Math.round((14+4*L)*(L>=10?1.6:1)*2*Sect.medMul()); },
  blocks(h){ return h<24 ? Math.max(1,Math.round(h/2)) : Math.round(h/24*6); },
  full(){ return (S.L===9||S.L>=12) && S.exp>=expNeed(S.L); },
  // hours until the clock next shows `hr` o'clock
  until(hr){ let m=hr*60-S.min; if(m<=0) m+=24*60; return m/60; },
  // run the numbers without touching the save
  sim(h){ let L=S.L, exp=S.exp, total=0;
    for(let i=0;i<Med.blocks(h);i++){ const g=Med.block(L), before=exp; exp+=g;
      while(true){ const need=expNeed(L); if(L===9||L>=12){ exp=Math.min(exp,need); break; } if(exp<need) break; exp-=need; L++; }
      total+= exp>=before ? exp-before : g; if((L===9||L>=12)&&exp>=expNeed(L)) break; }
    return {L, exp, total, capped:(L===9||L>=12)&&exp>=expNeed(L)}; },
  // how many days of 闭关 until each of the next few realms
  ahead(){ const out=[]; let L=S.L, exp=S.exp, blocks=0;
    while(out.length<4 && blocks<6*400){ if((L===9||L>=12)&&exp>=expNeed(L)) break; exp+=Med.block(L); blocks++;
      const need=expNeed(L); if(L!==9&&L<12&&exp>=need){ exp-=need; L++; out.push([L, blocks]); } else if(L===9&&exp>=need){ out.push([9.5, blocks]); exp=need; } }
    return out; },
  when(blocks){ const h=blocks*2; return h<24?`${h} 小时`:`${Math.ceil(blocks/6)} 天`; },
  open(skipAsk){
    // 炼气九层圆满 with a 筑基丹: break through, or just sit and let time pass
    if(!skipAsk && S.L===9 && S.exp>=expNeed(9) && S.inv.zhuji)
      return UI.say([{choice:'炼气九层圆满。要服下筑基丹，冲击筑基吗？（将面对心魔与天劫）', options:[{text:'冲击筑基', fn:()=>Mini.breakthrough()},{text:'先不了，只静坐一会儿', fn:()=>Med.open(true)}]}]);
    const full=Med.full();
    let k=Med._k||0;
    const ahead=Med.ahead().map(([L,b])=>`<li><b>${L===9.5?'炼气九层圆满':realmName(L)}</b><span>约 ${Med.when(b)}</span></li>`).join('');
    UI.panel('闭关打坐', `<div class="med">
      ${full?`<p class="med-full">${S.L===9?'炼气九层已经圆满，需要筑基丹才能再进一步。':'修为已经到了这一章的顶点。'}现在打坐不会再增加修为，只会让时间过去——想等到夜里找奇遇，可以用下面的「坐到天黑」。</p>`:''}
      <p class="muted">现在：<b>${realmName(S.L)}</b>　修为 ${Math.floor(S.exp)} / ${expNeed(S.L)}　（${Sect.rootName()}${Sect.medMul()!==1?'，打坐 ×'+Sect.medMul():''}）</p>
      <label class="med-len">打坐多久：<b id="medLen"></b></label>
      <input type="range" id="medR" min="0" max="${MED_STEPS.length-1}" step="1" value="${k}">
      <div class="med-out" id="medOut"></div>
      ${ahead?`<div class="med-ahead"><small>一直闭关的话：</small><ul>${ahead}</ul></div>`:''}
      <p class="muted">闭关一天按六个时辰算（其余时间吃饭睡觉）。闭关期间日子照常过：会收到信件，也会错过当天的奇遇。</p>
      <div class="mg-btns"><button class="btn main" id="medGo">开始打坐</button><button class="btn" id="medNight">坐到天黑（19:00）</button><button class="btn" id="medDawn">坐到天亮（6:00）</button><button class="btn" id="medNo">算了</button></div></div>`, b=>{
      const r=$('#medR'), show=()=>{ k=+r.value; Med._k=k; const [h,name]=MED_STEPS[k], s=Med.sim(h);
        $('#medLen').textContent=name;
        $('#medOut').innerHTML=full?`静坐 ${name}，修为不变<br><span class="muted">结束时：第 ${S.day+Math.floor((S.min+h*60)/(24*60))} 天 ${fmtTime((S.min+h*60)%(24*60))}</span>`:`修为 <b>+${s.total}</b>　→　<b>${realmName(s.L)}</b>${s.capped&&s.L===9?'（圆满，需筑基丹）':''}${s.L>S.L?`<span class="up">突破 ${s.L-S.L} 层！</span>`:''}<br><span class="muted">结束时：第 ${S.day+Math.floor((S.min+h*60)/(24*60))} 天 ${fmtTime((S.min+h*60)%(24*60))}</span>`; };
      r.oninput=show; show();
      $('#medGo').onclick=()=>{ UI.closePanel(); Med.run(MED_STEPS[k][0]); };
      $('#medNight').onclick=()=>{ UI.closePanel(); Med.run(Med.until(19)); };
      $('#medDawn').onclick=()=>{ UI.closePanel(); Med.run(Med.until(6)); };
      $('#medNo').onclick=()=>UI.closePanel(); });
  },
  run(h){
    const blocks=Med.blocks(h), per=h*60/blocks, dur=Math.min(4.5, 1.4+Math.log2(1+h/2)*.45)*1000, L0=S.L, sitting=Med.full(); let early=false;
    UI.fx=true; UI.sync(); Sound.magic();
    const el=document.createElement('div'); el.id='medbar'; el.innerHTML=`<div class="medbox"><b>闭关中……</b><div class="xbar"><i></i></div><span class="mtxt"></span><span class="mrealm">${realmName(S.L)}</span></div>`;
    document.body.appendChild(el);
    let done=0, gained=0; const t0=performance.now(), bar=el.querySelector('i'), txt=el.querySelector('.mtxt'), rl=el.querySelector('.mrealm');
    const step=now=>{
      const f=Math.min(1,(now-t0)/dur), want=Math.round(blocks*f);
      while(done<want && !early){ done++; const before=S.L; if(!sitting){ gained+=gainExpQuiet(Med.block(S.L)); }
        // time passes with each block (a day-long session is six blocks of four hours)
        Med.advance(per);
        if(!sitting && Med.full()){ early=true; txt.textContent='修为圆满，提前出关。'; }
        if(S.L>before){ rl.textContent=realmName(S.L); rl.classList.remove('pop'); void rl.offsetWidth; rl.classList.add('pop'); Sound.levelup(); } }
      bar.style.width=(early?100:f*100)+'%'; if(!early) txt.textContent=`第 ${S.day} 天 ${fmtTime(S.min)}　${sitting?'静坐中':'修为 +'+gained}`;
      if(f<1&&!early) return requestAnimationFrame(step);
      setTimeout(()=>{ el.remove(); UI.fx=false; S.st.meditated++; const st=stats(); S.hp=st.hp; S.mp=st.mp;
        if(S.L>L0) UI.banner('突破！'+realmName(S.L)); else if(early) UI.banner(S.L===9?'炼气九层圆满！':'修为圆满'); if(gained) UI.float(S.x,S.y,`+${gained} 修为`); UI.clock(); UI.hud(); save(); UI.sync(); Story.check(); },early?1200:500);
    };
    requestAnimationFrame(step);
  },
  // move the clock forward, turning the day over at midnight
  advance(min){ S.min+=min; while(S.min>=24*60){ S.min-=24*60; passDay(); } },
};
// like gainExp but without the banner/sound per level (the bar shows those)
// returns how much actually landed (nothing once the bar is full)
function gainExpQuiet(n){ const L0=S.L, e0=S.exp; let got=n; S.exp+=n;
  while(true){ const need=expNeed(S.L); if(S.L===9||S.L>=12){ if(S.exp>need){ got-=S.exp-need; S.exp=need; } break; } if(S.exp<need) break; S.exp-=need; S.L++; }
  return Math.max(0,got); }

/* ============================================================
   山海问道 · navigation: tracked task, GPS trail, auto-walk, minimap, world map, task list, profiles
   ============================================================ */
const WORLD = { home:[0,0], town:[24,1], forest:[-3,17] };   // where each area sits on the world map (in tiles)

const Nav = {
  // the tasks shown on screen: the main quest plus active / available side quests (tracked one first), at most 3
  list(){
    const out=[]; const q=QUESTS[S.quest]; if(q) out.push({key:'main', kind:'main', title:q.title, progress:q.progress?q.progress(S):'', target:q.target?q.target(S):null});
    for(const s of SIDES){ const st=S.side[s.id]; if(st==='done'||!s.unlock(S)) continue;
      out.push(st?{key:s.id, kind:'side', title:s.title, progress:sideReady(S,s)?'可以交付了':sideProgress(S,s), target:s.target(S)}:{key:s.id, kind:'avail', title:s.title, progress:'去找'+npcAt(s.giver)[3], target:npcAt(s.giver)}); }
    const tk=S.track||'main'; out.sort((a,b)=>(b.key===tk)-(a.key===tk)||(a.kind==='avail')-(b.kind==='avail'));
    return out.slice(0,3);
  },
  tracked(){
    if(S.track && S.track!=='main'){
      const q=SIDES.find(x=>x.id===S.track), st=q&&S.side[q.id];
      if(q && st!=='done'){
        if(!st) return {kind:'avail', id:q.id, title:q.title, desc:q.desc, progress:'去找'+npcAt(q.giver)[3]+'接取', target:npcAt(q.giver)};
        return {kind:'side', id:q.id, title:q.title, desc:q.desc, progress:sideReady(S,q)?'可以交付了':sideProgress(S,q), target:q.target(S)};
      }
      S.track='main';
    }
    const q=QUESTS[S.quest]; if(!q) return null;
    return {kind:'main', id:q.id, title:q.title, desc:q.desc, progress:q.progress?q.progress(S):'', target:q.target?q.target(S):null};
  },
  goal(){
    const tr=Nav.tracked(), t=tr&&tr.target; if(!t||!RT.map) return null;
    if(t[0]===RT.mapId) return {x:t[1], y:t[2], final:true, label:t[3]};
    const prev={[RT.mapId]:null}, q=[RT.mapId];
    while(q.length){ const m=q.shift(); if(m===t[0]) break; for(const e of MAPS[m].exits) if(!(e.to in prev)){ prev[e.to]=m; q.push(e.to); } }
    if(!(t[0] in prev)) return null;
    let m=t[0]; while(prev[m]!==RT.mapId) m=prev[m];
    const exits=RT.map.exits.filter(e=>e.to===m).sort((a,b)=>(Math.abs(a.x-S.x)+Math.abs(a.y-S.y))-(Math.abs(b.x-S.x)+Math.abs(b.y-S.y)));
    return {x:exits[0].x, y:exits[0].y, final:false, label:'前往'+MAPS[m].name.replace(/.*· /,'')};
  },
  pathTo(g){
    const solid=RT.solid[g.y]&&RT.solid[g.y][g.x];
    const reach = !g.final ? (x,y)=>x===g.x&&y===g.y
      : solid ? (x,y)=>Math.abs(x-g.x)+Math.abs(y-g.y)===1 : (x,y)=>Math.abs(x-g.x)+Math.abs(y-g.y)<=1;
    return bfs(S.x,S.y,reach);
  },
  tick(dt){
    RT.navT-=dt; if(RT.navT>0) return; RT.navT=0.25;
    const g=Nav.goal(); RT.navGoal=g; RT.navPath=g&&S.gps!==false?(Nav.pathTo(g)||[]):[];
    UI.miniDraw();
  },
  go(cont){
    if(UI.busy()&&!cont) UI.closePanel();
    const g=Nav.goal(); if(!g){ UI.toast('这个任务没有要去的地方'); return; }
    const p=Nav.pathTo(g); if(!p){ UI.toast('找不到路'); RT.autoNav=false; return; }
    RT.autoNav=true; RT.pending=null; RT.keys=[];
    if(!p.length){ Nav.arrive(); return; }
    setPath(p); if(!cont) UI.toast('自动寻路：'+g.label);
  },
  arrive(){
    RT.autoNav=false; const g=Nav.goal(); if(!g||!g.final) return;
    const o=entAt(g.x,g.y);
    if(o&&(o.type==='npc'||o.act||o.type==='gather')){ face(g.x,g.y); interact(o); }
    else UI.toast('到了：'+g.label);
  },
  drawWorld(g, ox, oy, T, Z){
    const goal=RT.navGoal; if(!goal) return;
    // breadcrumb trail: flowing gold dots
    const path=RT.navPath;
    for(let i=0;i<path.length && i<40;i++){
      const [x,y]=path[i], a=0.35+0.45*Math.max(0,Math.sin(RT.t*5-i*0.6)), r=(i%2?1:1.6)*Z;
      g.fillStyle=`rgba(255,214,90,${a})`; g.beginPath(); g.arc(ox+(x+.5)*T, oy+(y+.55)*T, r, 0, 7); g.fill();
    }
    // target marker
    const mx=ox+(goal.x+.5)*T, my=oy+goal.y*T - (4+Math.abs(Math.sin(RT.t*3))*4)*Z;
    g.fillStyle='rgba(255,214,90,.25)'; g.beginPath(); g.ellipse(ox+(goal.x+.5)*T, oy+(goal.y+.85)*T, 7*Z, 3*Z, 0, 0, 7); g.fill();
    g.fillStyle='#ffd65a'; g.strokeStyle='#5a2e12'; g.lineWidth=Z;
    g.beginPath(); g.moveTo(mx-4*Z,my-6*Z); g.lineTo(mx+4*Z,my-6*Z); g.lineTo(mx,my); g.closePath(); g.fill(); g.stroke();
  },
  drawArrow(g, ox, oy, T, Z){
    const goal=RT.navGoal; if(!goal) return;
    const tx=ox+(goal.x+.5)*T, ty=oy+(goal.y+.5)*T, W=cv.width, H=cv.height, m=40*RT.dpr;
    if(tx>m&&tx<W-m&&ty>m*2.2&&ty<H-m*2.2) return;
    const px=ox+(RT.fx+.5)*T, py=oy+(RT.fy+.2)*T, ang=Math.atan2(ty-py,tx-px);
    // the arrow circles the hero, so it never hides behind the HUD
    const ax=px+Math.cos(ang)*T*1.5, ay=py+Math.sin(ang)*T*1.5, s=5*RT.dpr*Math.max(1,RT.scale/2.5);
    g.save(); g.translate(ax,ay);
    g.globalAlpha=0.75+0.25*Math.sin(RT.t*5); g.fillStyle='rgba(74,35,11,.85)'; g.beginPath(); g.arc(0,0,s*1.6,0,7); g.fill();
    g.rotate(ang); g.fillStyle='#ffd65a'; g.beginPath(); g.moveTo(s,0); g.lineTo(-s*.7,-s*.75); g.lineTo(-s*.3,0); g.lineTo(-s*.7,s*.75); g.closePath(); g.fill();
    g.restore(); g.globalAlpha=1;
  },
};

/* ---------- minimap ---------- */
const TILECOL = {'.':'#6fbf4f',',':'#78c556',':':'#4f9a3a','=':'#d4ae78','#':'#cdbfa6','~':'#4a9fd8','B':'#a8743f','W':'#7d6c58','F':'#b98b5a','f':'#8a5a36'};
const MINIC = {};
function miniBase(id){
  if(MINIC[id]) return MINIC[id]; const m=MAPS[id], s=3, c=document.createElement('canvas'); c.width=m.w*s; c.height=m.h*s; const g=c.getContext('2d');
  for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){ g.fillStyle=TILECOL[m.ground[y][x]]||'#6fbf4f'; g.fillRect(x*s,y*s,s,s); }
  for(const o of m.objects){
    if(o.type==='building'){ g.fillStyle='#7a3d3d'; g.fillRect(o.x*s,o.y*s,o.w*s,o.h*s); g.fillStyle='#f3e3c3'; g.fillRect(o.x*s+1,(o.y+o.h)*s-2,o.w*s-2,2); }
    else if(o.type==='tree'||o.type==='pine'||o.type==='bush'){ g.fillStyle='#2f6b2c'; g.fillRect(o.x*s,o.y*s,s,s); }
    else if(o.type==='rock'){ g.fillStyle='#9aa0a6'; g.fillRect(o.x*s,o.y*s,s,s); }
    else if(o.type==='shrine'){ g.fillStyle='#c8413b'; g.fillRect(o.x*s-1,o.y*s-1,s+2,s+2); }
    else if(o.type==='futon'||o.type==='furnace'){ g.fillStyle='#e8b84a'; g.fillRect(o.x*s,o.y*s,s,s); }
  }
  for(const e of m.exits){ g.fillStyle='#fff3a0'; g.fillRect(e.x*s,e.y*s,s,s); }
  return MINIC[id]=c;
}
UI.miniReset=()=>{ const c=$('#mini'); if(!c||!RT.map) return; const b=miniBase(RT.mapId); c.width=b.width; c.height=b.height; UI.miniDraw(); };
UI.miniDraw=()=>{
  const c=$('#mini'); if(!c||!RT.map) return; const g=c.getContext('2d'), s=3; if(c.width!==miniBase(RT.mapId).width) return UI.miniReset();
  g.drawImage(miniBase(RT.mapId),0,0);
  for(const o of RT.ents) if(o.type==='npc'){ g.fillStyle='#4a7fd0'; g.fillRect(o.x*s,o.y*s,s,s); }
  for(const b of RT.beasts){ g.fillStyle='#e0402e'; g.fillRect(Math.round(b.fx*s),Math.round(b.fy*s),s,s); }
  const goal=RT.navGoal; if(goal){ g.fillStyle=(Math.floor(RT.t*3)%2)?'#ffd65a':'#fff'; g.fillRect(goal.x*s-1,goal.y*s-1,s+2,s+2); }
  g.fillStyle='#fff'; g.fillRect(Math.round(RT.fx*s)-1,Math.round(RT.fy*s)-1,s+2,s+2); g.fillStyle='#c8413b'; g.fillRect(Math.round(RT.fx*s),Math.round(RT.fy*s),s,s);
};

/* ---------- side quests through NPC talk ---------- */
Story.finishSide=(q, after)=>{
  if(q.need) for(const [k,n] of Object.entries(q.need)) addItem(k,-n);
  S.side[q.id]='done'; const r=q.reward||{}; if(r.stones){ S.stones+=r.stones; } if(r.give) for(const k in r.give) addItem(k,r.give[k]);
  if(r.energy){ S.bonusEnergy=(S.bonusEnergy||0)+r.energy; S.energy+=r.energy; }
  if(r.atk) S.bonusAtk=(S.bonusAtk||0)+r.atk;
  if(r.exp) gainExp(r.exp);
  if(r.petlv&&S.pet) S.pet.lv+=r.petlv;
  if(r.tianji){ S.flags.tianji_up=true; if(S.fortune===3) S.fortune=2; }
  if(r.heart) for(const k in r.heart) Social.add(k,r.heart[k]);
  if(S.track===q.id) S.track='main'; UI.hud();
  UI.say(q.done.concat([['旁白',`完成支线「${q.title}」`+([r.stones?`灵石 +${r.stones}`:'', ...Object.keys(r.give||{}).map(k=>ITEMS[k].name+'×'+r.give[k]), r.energy?`体力上限 +${r.energy}`:'', ...Object.keys(r.heart||{}).map(k=>NPCS[k].name+'好感 ↑')].filter(Boolean).map((x,i)=>(i?'，':'：')+x).join(''))]]), after);
  Sound.coin(); return true;
};
Story.side=(id, after)=>{
  for(const q of SIDES){ if(q.giver!==id||!q.unlock(S)) continue; const st=S.side[q.id];
    if(st==='active' && sideReady(S,q)){
      if(q.deliverAt==='shrine'){ UI.say([[NPCS[id].name,'灵草带来了？那就去山林南边的青丘狐祠，供在香炉前吧。']], after); return true; }
      return Story.finishSide(q, after);
    }
    if(!st){ S.side[q.id]='active'; if(q.count) S.side[q.id+'_base']=sideCountNow(S,q.count); S.track=q.id; UI.hud(); RT.navT=0;
      UI.say(q.start.concat([['旁白',`接下支线「${q.title}」，已设为追踪。`]]), after); return true; }
  }
  return false;
};

/* ============================================================
   山海问道 · saving: autosave + three manual snapshots per profile + a "测灵根前" snapshot
   Players may save any time outside battles and mini-games (and reroll their roots — that's a feature).
   ============================================================ */
const SaveSys = {
  SNAPS:['m1','m2','m3'],
  key(slot, snap){ return slotKey(slot)+'.'+snap; },
  canSave(){ return !!S && !Battle.s && !UI.fx && !(typeof Replay!=='undefined'&&Replay.active); },
  meta(s){ const q=QUESTS[s.quest]; return {name:s.name, realm:realmName(s.L), day:s.day, time:fmtTime(s.min), map:MAPS[s.map]?MAPS[s.map].name:'', quest:q?q.title:'', root:s.root?ROOT_KINDS[s.root.n].name+'（'+s.root.els.join('')+'）':'未测', at:Date.now()}; },
  read(slot, snap){ try{ return JSON.parse(localStorage.getItem(SaveSys.key(slot,snap))||'null'); }catch(e){ return null; } },
  write(snap){
    if(!SaveSys.canSave()) return false;
    S.x=S.x; const rec={meta:SaveSys.meta(S), state:S};
    try{ localStorage.setItem(SaveSys.key(RT.slot,snap), JSON.stringify(rec)); save(); return true; }catch(e){ return false; }
  },
  // load a snapshot into this profile's slot and step into it
  load(slot, snap){
    const rec=SaveSys.read(slot,snap); if(!rec) return false;
    RT.slot=slot; S=JSON.parse(JSON.stringify(rec.state)); S=loadFromObject(S);
    Sect.migrate(); Hooks.placeQiyu(); save();
    Battle.s&&Battle.close(); Mini.close(); $('#dlg').hidden=true; UI.dlgQ=null; $('#panel').hidden=true; $('#title').hidden=true; clearInterval(Creator.timer);
    enterMap(S.map,S.x,S.y); RT.dir='down'; UI.hud(); UI.sync();
    SaveSys.resume(); UI.toast('已读取存档'); return true;
  },
  // a save made during the prologue replays it (so the root test can be taken again)
  resume(){
    if(S._refund){ UI.toast(`种田系统已移除，退还 ${S._refund} 灵石`); delete S._refund; }
    if(!S.flags.intro_done && S.quest===0){ UI.say(S.root?SCRIPTS.intro_post:SCRIPTS.intro, ()=>{ S.questStarted=0; Story.check(); }); return; }
    Story.check();
  },
  ago(t){ const m=Math.round((Date.now()-t)/60000); return m<1?'刚刚':m<60?m+' 分钟前':m<1440?Math.round(m/60)+' 小时前':Math.round(m/1440)+' 天前'; },
  card(slot, snap, label, canWrite){
    const rec=SaveSys.read(slot,snap), m=rec&&rec.meta;
    return `<div class="savecard"><div class="sc-l"><b>${label}</b>${m?`<span>${esc(m.realm)} · 第 ${m.day} 天 ${esc(m.time)}</span><span class="muted">${esc(m.map)} · ${esc(m.quest)}</span><span class="muted">灵根：${esc(m.root)} · ${SaveSys.ago(m.at)}</span>`:'<span class="muted">（空）</span>'}</div>
      <div class="sc-r">${canWrite?`<button class="btn mini" data-sv="${snap}">${m?'覆盖':'存到这里'}</button>`:''}${m?`<button class="btn mini main" data-ld="${slot}:${snap}">读取</button>`:''}</div></div>`;
  },
  bind(root, after){
    root.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{
      if(b.textContent==='覆盖'){ b.textContent='确定覆盖？'; return; }
      if(!SaveSys.write(b.dataset.sv)) return UI.toast(SaveSys.canSave()?'存档失败（浏览器不允许存储）':'战斗或小游戏中不能存档');
      Sound.coin(); UI.toast('已存档'); after&&after(); });
    root.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{
      if(b.textContent==='读取'){ b.textContent='确定读取？'; setTimeout(()=>{ if(b.isConnected) b.textContent='读取'; },2500); return; }
      const [slot,snap]=b.dataset.ld.split(':'); Sound.tick(); SaveSys.load(+slot,snap); });
  },
  panel(){
    if(!S) return;
    const auto=readSlot(RT.slot);
    UI.panel('存档', `<p class="muted">战斗和小游戏以外，随时都可以存档、读档。每晚睡觉、换地图、完成任务、切出游戏时也会自动存档。</p>
      <div class="savecard auto"><div class="sc-l"><b>自动存档</b>${auto?`<span>${realmName(auto.L)} · 第 ${auto.day} 天 ${fmtTime(auto.min)}</span>`:'<span class="muted">（空）</span>'}</div><div class="sc-r"><button class="btn mini" id="svAuto">立即自动存档</button></div></div>
      ${SaveSys.SNAPS.map((s,i)=>SaveSys.card(RT.slot,s,'手动存档 '+(i+1),true)).join('')}
      ${SaveSys.read(RT.slot,'pre_root')?SaveSys.card(RT.slot,'pre_root','测灵根前（自动）',false):''}
      <p class="muted">想重新测灵根？读取「测灵根前」即可。</p>`, b=>{
        $('#svAuto').onclick=()=>{ if(!SaveSys.canSave()) return UI.toast('战斗或小游戏中不能存档'); UI.toast(save()?'已存档':'存档失败'); Sound.coin(); UI.closePanel(); SaveSys.panel(); };
        SaveSys.bind(b, ()=>{ UI.closePanel(); SaveSys.panel(); });
      });
  },
  // title screen: list a profile's snapshots inline
  titleList(slot, host){
    const list=[...SaveSys.SNAPS.map((s,i)=>[s,'手动存档 '+(i+1)]), ['pre_root','测灵根前']].filter(([s])=>SaveSys.read(slot,s));
    host.innerHTML=list.length?list.map(([s,l])=>SaveSys.card(slot,s,l,false)).join(''):'<p class="muted" style="color:#fff3dc">这个角色还没有手动存档。</p>';
    SaveSys.bind(host);
  },
  autoTick:0,
};
function loadFromObject(s){ s.side=s.side||{}; s.track=s.track||'main'; s.look=s.look||defaultLook('m'); s.name=s.name||'无名'; s.st.meditated=s.st.meditated||0; if(s.quest>0) (s.flags=s.flags||{}).intro_done=true; return s; }

/* ---------- autosave on more occasions ---------- */
addEventListener('visibilitychange', ()=>{ if(document.hidden && SaveSys.canSave()) save(); });
addEventListener('pagehide', ()=>{ if(SaveSys.canSave()) save(); });
setInterval(()=>{ if(S && RT.map && !RT.paused && SaveSys.canSave()){ const half=Math.floor(S.min/30); if(half!==SaveSys.autoTick){ SaveSys.autoTick=half; save(); } } }, 2000);

/* ============================================================
   山海问道 · 往事回廊 — replay key story moments in a sandbox.
   The current game is copied before the replay and put back afterwards; nothing is saved meanwhile.
   ============================================================ */
const Replay = {
  active:null, snap:null, idle:0, timer:0,
  NODES:[
    {id:'root',    title:'测灵根',        unlock:s=>!!s.root,                desc:'再站到测灵石前（只是回忆，不会改变你的灵根）。'},
    {id:'qiongqi', title:'讨伐穷奇',      unlock:s=>!!s.flags.qiongqi_done,  desc:'狐祠前，与穷奇的第一战。（以炼气五层、三颗回春丹重温）'},
    {id:'zhuji',   title:'筑基 · 心魔与天劫', unlock:s=>s.L>=10,            desc:'服下筑基丹，直面心魔，渡过天劫。'},
    {id:'sect',    title:'拜师大典',      unlock:s=>!!s.sect,                desc:'四大宗门齐聚桃源镇。（可以试试选别的宗门，回忆结束后不会改变）'},
    {id:'huli',    title:'青丘狐影',      unlock:s=>!!s.flags.chapter1_done, desc:'九尾狐与饕餮苏醒。（可以试试另一个选择）'},
  ],
  start(id){
    if(Replay.active) return;
    UI.closePanel(); Replay.snap=JSON.stringify(S); Replay.active=id; Replay.idle=0;
    const st=()=>{ const x=stats(); S.hp=x.hp; S.mp=x.mp; };
    UI.banner('往事 · '+Replay.NODES.find(n=>n.id===id).title);
    setTimeout(()=>{
      if(id==='root'){ S.root=null; Sect.rootTest(()=>{}); }
      if(id==='qiongqi'){ S.L=5; S.sect=null; S.inv.huichun=3; S.flags.qiongqi_done=false; st(); UI.say(SCRIPTS.qiongqi_meet); }

      if(id==='sect'){ S.sect=null; S.flags.tang_sect=false; S.look={...S.look}; UI.say(SCRIPTS.ceremony, ()=>Sect.choose()); }

      clearInterval(Replay.timer); Replay.timer=setInterval(Replay.watch,400);
    },900);
  },
  // the replay ends once the player is back to walking around
  watch(){ if(!Replay.active) return clearInterval(Replay.timer); if(UI.busy()||Battle.s){ Replay.idle=0; return; } if(++Replay.idle>=2) Replay.end(); },
  end(){
    clearInterval(Replay.timer); if(!Replay.active) return; const back=JSON.parse(Replay.snap); Replay.active=null; Replay.snap=null;
    S=back; enterMap(S.map,S.x,S.y); UI.hud(); UI.sync(); Music.play(areaTheme(),true); UI.toast('回忆结束，回到了现在。');
  },
  html(){
    return `<p class="muted">经历过的重要时刻，可以在这里重温。回忆里的一切都不会影响你现在的存档。</p><div class="book">${Replay.NODES.map(n=>{ const ok=n.unlock(S);
      return `<div class="bk ${ok?'':'unk'}"><div class="rp-ico">${ok?'忆':'？'}</div><div><b>${ok?n.title:'尚未经历'}</b><p>${ok?esc(n.desc):'继续推进剧情就会解锁。'}</p>${ok?`<button class="btn mini main" data-replay="${n.id}">重温</button>`:''}</div></div>`; }).join('')}</div>
      <p class="muted">心动事件可以在「人物」页回放。</p>`;
  },
};

/* ============================================================
   山海问道 · 自检 (self test) — open the game with #selftest and it plays through chapter one by itself,
   then shows a ✓/✗ report. It uses save slot 3 and puts it back afterwards.
   ============================================================ */
const SelfTest = {
  errors:[],
  async run(){
    const W=ms=>new Promise(r=>setTimeout(r,ms));
    const el=document.createElement('div'); el.id='selftest'; el.innerHTML='<div class="st-box wood"><h3>自检中…</h3><ol id="stList"></ol><p class="muted" id="stNote">会自动完成整章流程，大约需要两分钟。</p></div>'; document.body.appendChild(el);
    const list=$('#stList'); let pass=0, fail=0;
    const report=(name, ok, info='')=>{ ok?pass++:fail++; const li=document.createElement('li'); li.className=ok?'ok':'bad'; li.textContent=`${ok?'✓':'✗'} ${name}${info?' — '+info:''}`; list.appendChild(li); li.scrollIntoView({block:'nearest'}); };
    const step=async(name, fn)=>{ try{ const r=await fn(); report(name, r!==false&&!(r&&r.fail), r&&r.info||''); }catch(e){ report(name,false,String(e&&e.message||e)); } };
    const adv=async(pick=0)=>{ for(let i=0;i<120;i++){ const d=$('#dlg'); if(d.hidden) return; const ch=d.querySelectorAll('[data-i]'); if(ch.length) ch[Math.min(pick,ch.length-1)].click(); else if(d.onclick){ d.onclick(); d.onclick&&d.onclick(); } await W(15); } };
    const fight=async()=>{ let n=0; while(Battle.s&&!Battle.s.over&&n<80){ if(Battle.s.busy){ await W(60); continue; } const it=Battle.intent(), st=stats();
        if(S.hp<st.hp*.4&&S.inv.huichun){ $('[data-a="pill"]').click(); await W(5); const p=$('[data-p="huichun"]'); p&&p.click(); }
        else if(it==='big'||it==='charm') Battle.act('guard'); else if(S.sect&&S.mp>=SECTS[S.sect].skill.mp) Battle.act('sect'); else if(S.mp>=8) Battle.act('skill'); else Battle.act('atk');
        n++; await W(680); }
      const ok=$('#bOk'); if(ok) ok.click(); await W(50); return !!ok; };
    const backup=localStorage.getItem(slotKey(2)); const realRandom=Math.random;
    Dev.god=false; RT.slot=2; Dodge.auto=true;   // dodge phases resolve instantly (one hit) so the run stays fast
    try{
      await step('开局：创建角色、序章对话', async()=>{ localStorage.removeItem(slotKey(2)); Creator.open(2); await W(30); $('#crGo').click(); await W(80);
        for(let i=0;i<40&&!$('#rtGo');i++){ const d=$('#dlg'); const ch=d.querySelectorAll('[data-i]'); if(ch.length) ch[0].click(); else d.onclick&&(d.onclick(),d.onclick&&d.onclick()); await W(15); }
        return !!$('#rtGo'); });
      await step('测灵根（按下时才随机，有「测灵根前」存档）', async()=>{ const pre=!!SaveSys.read(2,'pre_root'), before=S.root; $('#rtGo').click(); await W(2300); const got=S.root; $('#rtGo').click(); await W(30); await adv();
        return {fail:!(pre&&!before&&got), info:Sect.rootName()}; });
      await step('序章完成：拿到玉简，主线「采一株灵草」', async()=>({fail:!(S.inv.slip&&QUESTS[S.quest].id==='q1'&&S.flags.intro_done)}));
      await step('采集灵草 → 主线推进', async()=>{ const o=RT.ents.find(e=>e.type==='gather'&&e.item==='lingcao'); gather(o); await W(30); await adv(); return {fail:QUESTS[S.quest].id!=='q2', info:'灵草 '+(S.inv.lingcao||0)}; });
      await step('打坐 → 炼气一层', async()=>{ meditate(); await W(60); $('#medGo').click(); await W(2600); await adv(); await W(30); await adv(); return {fail:!(S.L>=1&&QUESTS[S.quest].id==='q3'), info:realmName(S.L)}; });
      await step('初到桃源镇：认识阿禾', async()=>{ enterMap('town',12,11); Story.check(); await adv(); Story.talk('ahe'); await adv(); await W(30); await adv(); return {fail:QUESTS[S.quest].id!=='q4'}; });
      await step('山林怪声：击败 3 只野兽', async()=>{ enterMap('forest',14,3); for(let i=0;i<3;i++){ const st=stats(); S.hp=st.hp; S.mp=st.mp; Battle.start('dangkang',r=>{ if(r==='win'){ S.st.kills++; Story.check(); } }); await fight(); await adv(); }
        await W(50); await adv(); return {fail:QUESTS[S.quest].id!=='q5'}; });
      await step('战斗结束后不能再放技能扣灵力', async()=>{ Battle._begin('dangkang',()=>{}); Battle.s.hp=1; S.mp=40; Battle.act('skill'); const m=S.mp; Battle.act('skill'); Battle.act('skill'); const after=S.mp; await W(700); $('#bOk')&&$('#bOk').click(); await W(30); return {fail:after!==m, info:`灵力 ${m} → ${after}`}; });
      await step('备战：修到炼气五层、买 2 颗回春丹', async()=>{ while(S.L<5) gainExp(60); await W(30); await adv(); S.stones+=300; UI.shop(); $('[data-buy="huichun"]').click(); $('[data-buy="huichun"]').click(); UI.closePanel(); await W(30); await adv();
        return {fail:QUESTS[S.quest].id!=='q6'}; });

        const lines=[]; for(let i=0;i<40&&!$('#dlg').hidden;i++){ const d=$('#dlg'); if(UI.typing&&d.onclick) d.onclick(); lines.push(d.innerText); d.onclick&&d.onclick(); await W(15); } await adv();

      run(){ RT.slot=SLOTS-1; S=newState(); S.name='老存档'; S.qv=3; S.quest=QUESTS.findIndex(q=>q.id==='q4'); S.L=2; S.root={els:['木','水'],n:2}; S.flags.intro_done=true; S.flags.met_ahe=true;
        S.inv={slip:1,hoe:1,can:1,seed_lc:4,seed_zg:2,sprinkler:1,huichun:1}; S.puppet=true; S.farm={'home:4,7':{tilled:1,crop:'lingcao',stage:1,days:1},'home:5,8':{tilled:1,sprinkler:1}};
        const before=S.stones; localStorage.setItem(slotKey(RT.slot),JSON.stringify(S)); S=loadSave(RT.slot); Sect.migrate(); $('#title').hidden=true; enterMap(S.map,S.x,S.y); UI.hud(); UI.sync(); SaveSys.resume();
        UI.toast(`退还后灵石：${before} → ${S.stones}`); }},
    {id:'end', group:'剧情', title:'第一章结束后的自由时间', check:'第一章完成后能否继续逛、做支线、钓鱼、重温往事。',
      run(){ Review.base({quest:'end', L:10, sect:'dan', flags:{qiongqi_done:true, tang_sect:true, chapter1_done:true, huli_friend:true}, inv:{rod:1}}); Review.at('home',11,6,'down'); }},
  ],
  // a fresh test character in save slot 3 with the given story state
  base(o){
    RT.slot=SLOTS-1; S=newState(); S.name='审查员'; S.look={g:'f',skin:1,hair:4,hairColor:0,style:'qun',cloth:6}; S.root={els:['火','木','水'],n:3};
    S.flags.intro_done=true; S.flags.chest=true; S.inv={slip:1, ...(o.inv||{})};
    const qi=QUESTS.findIndex(q=>q.id===o.quest); S.quest=qi; S.questStarted=qi;
    S.L=o.L||0; if(o.full) S.exp=expNeed(S.L); S.sect=o.sect===undefined?(S.L>=10&&o.quest!=='sect'?'jian':null):o.sect;
    if(S.quest>QUESTS.findIndex(q=>q.id==='q3')) S.flags.met_ahe=true;
    Object.assign(S.flags, o.flags||{}); Object.assign(S.side, o.side||{}); if(o.kills) S.st.kills=o.kills;
    const st=stats(); S.hp=st.hp; S.mp=st.mp; S.min=S.min||9*60; Dev.god=false;
  },
  at(map,x,y,dir){
    $('#title').hidden=true; clearInterval(Creator.timer); Mini.close&&Mini.close(); Battle.s&&Battle.close(); UI.dlgQ=null; $('#dlg').hidden=true; $('#panel').hidden=true; $('#cg').hidden=true;
    enterMap(map,x,y); RT.dir=dir||'down'; UI.hud(); UI.sync(); save(); Music.play(areaTheme());
  },
  go(id){
    const n=Review.NODES.find(x=>x.id===id); if(!n) return Review.missing(id);
    $('#reviewHub')&&$('#reviewHub').remove(); n.run(); Review.note(n);
  },
  // an unknown node usually means this page is older than the link (the tab stayed open, or the browser cached it):
  // fetch the newest page and reload into it; only if this already is the newest, say the node doesn't exist
  missing(id){
    const meta=document.querySelector('meta[name=build]'), mine=meta&&meta.dataset.build;
    if(!mine) return UI.toast('没有这个审查节点：'+id);
    UI.toast('正在检查新版本……');
    fetch(location.pathname+'?fresh='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{ const m=t.match(/data-build="([0-9a-f]+)"/);
      if(m&&m[1]!==mine){ const u=new URL(location.href); u.searchParams.set('v',m[1]); location.replace(u.href); }
      else UI.toast('没有这个审查节点：'+id); }).catch(()=>UI.toast('没有这个审查节点：'+id));
  },
  note(n){
    let el=$('#reviewNote'); if(!el){ el=document.createElement('div'); el.id='reviewNote'; el.className='wood'; document.body.appendChild(el); }
    const i=Review.NODES.indexOf(n), next=Review.NODES[i+1];
    el.innerHTML=`<b>审查 · ${esc(n.title)}</b><p>${esc(n.check)}</p><div class="rn-btns"><button class="btn mini" id="rnHub">全部节点</button>${next?`<button class="btn mini" id="rnNext">下一个：${esc(next.title)}</button>`:''}<button class="btn mini" id="rnX">收起</button></div>`;
    $('#reviewPill')&&$('#reviewPill').remove();
    $('#rnHub').onclick=()=>Review.hub(); $('#rnX').onclick=()=>{ el.remove(); const p=document.createElement('button'); p.id='reviewPill'; p.className='wood'; p.textContent='审查：'+n.title+' ▾'; p.onclick=()=>{ p.remove(); Review.note(n); }; document.body.appendChild(p); }; if(next) $('#rnNext').onclick=()=>{ location.hash='t-'+next.id; };
  },
  hub(){
    $('#reviewHub')&&$('#reviewHub').remove();
    const groups=[...new Set(Review.NODES.map(n=>n.group))], base=location.href.split('#')[0];
    const el=document.createElement('div'); el.id='reviewHub';
    el.innerHTML=`<div class="rh-box wood"><h3>审查节点</h3><p class="muted">点任何一项，直接进入那个场景（测试角色用第 3 个存档位，不影响你自己的存档）。每一项也可以单独分享：链接后面加 <code>#t-名字</code>。</p>
      ${groups.map(g=>`<h4>${g}</h4><div class="rh-list">${Review.NODES.filter(n=>n.group===g).map(n=>`<a class="rh-item" href="${base}#t-${n.id}"><b>${esc(n.title)}</b><span>${esc(n.check)}</span><code>#t-${n.id}</code></a>`).join('')}</div>`).join('')}
      <div class="rn-btns"><a class="btn mini main" href="${base}#selftest">跑一遍自检 #selftest</a><button class="btn mini" id="rhX">关闭</button></div></div>`;
    document.body.appendChild(el); $('#rhX').onclick=()=>el.remove();
  },
  route(){
    const h=location.hash.replace('#','');
    if(h==='review') return Review.hub();
    if(h==='selftest') return;
    if(h.startsWith('t-')) return Review.go(h.slice(2));
  },
};
addEventListener('hashchange', ()=>Review.route());
setTimeout(()=>Review.route(), 400);

</script>
</body></html>
