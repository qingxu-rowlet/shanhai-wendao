    const r=Math.random(), n=r<.12?1:r<.45?2:r<.85?3:4, all=Object.keys(ELEMENTS).sort(()=>Math.random()-.5);

const Mini = {
  loop:null, run(fn){ Mini.stop(); let last=performance.now(); const tick=now=>{ if(!Mini.loop) return; const dt=Math.min(.05,(now-last)/1000); last=now; fn(dt); if(Mini.loop) requestAnimationFrame(tick); }; Mini.loop=fn; requestAnimationFrame(tick); },
  step(dt){ if(Mini.loop) Mini.loop(dt); },
  stop(){ Mini.loop=null; },
  open(html){ const el=$('#minigame'); el.hidden=false; el.innerHTML=html; UI.fx=true; UI.sync(); return el; },
  close(){ Mini.stop(); const el=$('#minigame'); el.hidden=true; el.innerHTML=''; UI.fx=false; UI.sync(); },
  hold(btn, set){ const on=e=>{ e.preventDefault(); set(true); }, off=()=>set(false);
    btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off); btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off);
    const kd=e=>{ if(e.code==='Space'||e.code==='KeyE'){ e.preventDefault(); set(true); } }, ku=e=>{ if(e.code==='Space'||e.code==='KeyE') set(false); };
    addEventListener('keydown',kd); addEventListener('keyup',ku); return ()=>{ removeEventListener('keydown',kd); removeEventListener('keyup',ku); }; },

  /* ---------- 炼丹：keep the heat inside the moving sweet spot ---------- */
  alchemy(recipe, done){
    const out=ITEMS[recipe.out], wide=S.sect==='dan'?.17:.12, total=7;
    const el=Mini.open(`<div class="mg wood alc"><h3>炼制 ${out.name}</h3>
      <div class="alc-wrap"><div class="furnace"><div class="flame" id="alcFlame"></div></div>

      <div class="xbar"><i id="alcProg"></i></div><p class="mg-tip" id="alcTip">按住「鼓风」让火变旺，松开火会变弱。把火候保持在金色区域里！</p>
      <button class="btn main big" id="alcBtn">鼓风（按住）</button></div>`);
    let h=.3, v=0, t=-1.2, inside=0, holding=false; const unbind=Mini.hold($('#alcBtn'), x=>holding=x);
    Mini.run(dt=>{
      t+=dt; v+=(holding?1.7:-1.15)*dt; v*=.94; h=Math.max(0,Math.min(1,h+v*dt*2.2)); if(h===0||h===1) v=0;
      const c=.5+.26*Math.sin(t*1.25)+.1*Math.sin(t*3.3);
      if(t>0){ if(Math.abs(h-c)<wide) inside+=dt; }
      $('#alcZone').style.bottom=((c-wide)*100)+'%'; $('#alcZone').style.height=(wide*200)+'%';
      $('#alcNeedle').style.bottom=(h*100)+'%'; $('#alcFlame').style.transform=`scale(${.5+h*.9})`; $('#alcFlame').style.opacity=.5+h*.5;
      $('#alcProg').style.width=Math.max(0,t/total*100)+'%';
      if(t<0) $('#alcTip').textContent='准备……';
      else if(Math.abs(h-c)<wide) $('#alcTip').textContent='火候正好！'; else $('#alcTip').textContent=h>c?'火太旺了！':'火太弱了！';
      if(t>=total){ unbind(); Mini.stop(); const r=inside/total, grade=r>=.68?'top':r>=.42?'mid':r>=.2?'low':'fail';
        const name={top:'上品',mid:'中品',low:'下品',fail:'炸炉'}[grade];
        el.querySelector('.alc').innerHTML=`<h3>${grade==='fail'?'炸炉了……':name+out.name}</h3><p class="mg-tip">火候命中 ${Math.round(r*100)}%</p><button class="btn main" id="alcOk">好</button>`;
        if(grade==='fail') Sound.hurt(); else Sound.levelup();
        $('#alcOk').onclick=()=>{ Mini.close(); done(grade); }; }
    });
  },

  /* ---------- 天劫：dodge the lightning ---------- */
  tribulation(done){
    const lanes=5; let pos=2, hp=3, t=0, wave=0, strikes=[], nextAt=1.2;
    const el=Mini.open(`<div class="mg wood trib"><h3>天劫</h3><p class="mg-tip" id="trTip">左右移动，躲开落下的天雷！</p>
      <div class="arena" id="trArena">${'<div class="lane"></div>'.repeat(lanes)}<div class="me" id="trMe"></div></div>
      <div class="trib-hp" id="trHp"></div><div class="mg-btns"><button class="btn big" id="trL">◀ 左</button><button class="btn big" id="trR">右 ▶</button></div></div>`);
    const me=$('#trMe'), ln=[...el.querySelectorAll('.lane')]; me.innerHTML=''; const pc=document.createElement('canvas'); pc.className='px'; const sp=lookSprite(S.look,'up',0); pc.width=sp.width; pc.height=sp.height; pc.getContext('2d').drawImage(sp,0,0); me.appendChild(pc);
    const move=d=>{ pos=Math.max(0,Math.min(lanes-1,pos+d)); Sound.tick(); };
    $('#trL').onclick=()=>move(-1); $('#trR').onclick=()=>move(1);
    $('#trArena').onpointerdown=e=>{ const r=e.currentTarget.getBoundingClientRect(); pos=Math.max(0,Math.min(lanes-1,Math.floor((e.clientX-r.left)/r.width*lanes))); };
    const kd=e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA') move(-1); if(e.code==='ArrowRight'||e.code==='KeyD') move(1); }; addEventListener('keydown',kd);
    Music.stinger('thunder');
    Mini.run(dt=>{
      t+=dt; me.style.left=(pos/lanes*100)+'%'; $('#trHp').textContent='护体 '+'◆'.repeat(hp)+'◇'.repeat(3-hp)+'　·　第 '+Math.min(3,wave+1)+' / 3 道天雷';
      if(t>=nextAt && wave<3){ const n=1+wave; const set=new Set(); while(set.size<Math.min(lanes-1,n+1)) set.add(Math.floor(Math.random()*lanes));
        for(const l of set){ strikes.push({l, at:t+.9}); ln[l].classList.add('warn'); } wave++; nextAt=t+2.1; }
      for(const s of strikes){ if(!s.done && t>=s.at){ s.done=true; ln[s.l].classList.remove('warn'); ln[s.l].classList.add('bolt'); setTimeout(()=>ln[s.l]&&ln[s.l].classList.remove('bolt'),300);
        Music.stinger('thunder'); if(s.l===pos){ hp--; Sound.hurt(); el.querySelector('.trib').classList.remove('shake'); void el.offsetWidth; el.querySelector('.trib').classList.add('shake'); } } }
      if(hp<=0 || (wave>=3 && strikes.every(s=>s.done) && t>nextAt-1)){ Mini.stop(); removeEventListener('keydown',kd); const ok=hp>0;
        el.querySelector('.trib').innerHTML=`<h3>${ok?'渡劫成功！':'天劫未过……'}</h3><p class="mg-tip">${ok?'雷光散去，天地间一片清明。':'你被天雷击伤，这次突破失败了。筑基丹还在，养好伤再来。'}</p><button class="btn main" id="trOk">好</button>`;
        $('#trOk').onclick=()=>{ Mini.close(); done(ok); }; }
    });
  },

  /* ---------- 钓鱼 ---------- */
  fishPick(){
    const night=S.min/60>=19||S.min/60<6, forest=RT.mapId==='forest', r=Math.random();
    if(forest && r<(night?.12:.06)) return {id:'fish_jin', speed:1.9, jumpy:1.6};
    if(night && r<.35) return {id:'fish_mo', speed:1.5, jumpy:1.2};
    if(r<.6) return {id:'fish_li', speed:.8, jumpy:.6};

  fish(){
    if(!useEnergy(3)) return;
    const el=Mini.open(`<div class="mg wood fishg"><h3>垂钓</h3><p class="mg-tip" id="fsTip">静静等待鱼儿咬钩……</p>
      <div class="pond"><div class="bobber" id="fsBob"></div></div><button class="btn main big" id="fsBtn">收竿</button></div>`);
    Music.play('calm');
    let t=0, bite=1+Math.random()*2.5, phase='wait', biteT=0; const fish=Mini.fishPick();
    $('#fsBtn').onclick=()=>{ if(phase==='wait'){ $('#fsTip').textContent='太早了，鱼被吓跑了……'; phase='end'; setTimeout(()=>{ Mini.close(); Music.play(areaTheme()); },900); }
      else if(phase==='bite'){ phase='reel'; Mini.reel(fish); } };
    Mini.run(dt=>{ t+=dt; if(phase==='wait'&&t>=bite){ phase='bite'; biteT=t; $('#fsTip').textContent='咬钩了！快收竿！'; $('#fsBob').classList.add('bite'); Sound.pick(); }
      if(phase==='bite'&&t-biteT>.9){ phase='end'; $('#fsTip').textContent='鱼儿溜走了……'; $('#fsBob').classList.remove('bite'); setTimeout(()=>{ Mini.close(); Music.play(areaTheme()); },900); } });

  reel(fish){
    const el=$('#minigame'), it=ITEMS[fish.id];
    el.innerHTML=`<div class="mg wood fishg"><h3>收线！</h3><div class="reel-wrap"><div class="reel"><div class="catch" id="rcBox"></div><div class="fishi" id="rcFish"><img class="px" src="${iconURL(it.icon,it.color)}" alt=""></div></div>
      <div class="rprog"><i id="rcProg"></i></div></div><p class="mg-tip">按住「提竿」让绿框上升，把鱼框住！</p><button class="btn main big" id="rcBtn">提竿（按住）</button></div>`;
    let b=.1, bv=0, f=.5, fv=0, fTarget=.5, p=.3, holding=false, t=0; const box=.26; const unbind=Mini.hold($('#rcBtn'), x=>holding=x);
    Mini.run(dt=>{
      t+=dt; bv+=(holding?1.8:-1.6)*dt; bv*=.93; b=Math.max(0,Math.min(1-box,b+bv*dt*2)); if(b===0||b===1-box) bv=0;
      if(Math.random()<dt*fish.jumpy) fTarget=Math.random(); f+=(fTarget-f)*Math.min(1,dt*fish.speed*2);
      const inside=f>=b&&f<=b+box; p=Math.max(0,Math.min(1,p+(inside?.32:-.22)*dt));
      $('#rcBox').style.bottom=(b*100)+'%'; $('#rcBox').style.height=(box*100)+'%'; $('#rcFish').style.bottom=`calc(${f*100}% - 12px)`; $('#rcProg').style.height=(p*100)+'%';
      $('#rcBox').classList.toggle('on',inside);
      if(p>=1||p<=0){ Mini.stop(); unbind(); const ok=p>=1; if(ok){ addItem(fish.id); Sound.levelup(); } else Sound.hurt();
        el.querySelector('.fishg').innerHTML=`<h3>${ok?'钓到了！':'鱼跑了……'}</h3>${ok?`<p class="mg-tip"><img class="px" style="width:48px" src="${iconURL(it.icon,it.color)}" alt=""><br>${it.name}　${esc(it.desc)}</p>`:''}<button class="btn main" id="rcOk">好</button>`;
        $('#rcOk').onclick=()=>{ Mini.close(); Music.play(areaTheme()); }; }

const Life = {
  col(){ S.col=S.col||{crops:{},fish:{}}; return S.col; },
  /* ---------- harvesting with a chance of 金品 ---------- */
  harvest(k,p,x,y,auto){
    const c=CROPS[p.crop], gold=Math.random()<.12, n=c.yield[1]*(gold?2:1), id=c.yield[0];
    addItem(id,n); S.st.harvested++; const rec=Life.col().crops[id]=Life.col().crops[id]||{n:0,gold:false}; rec.n++; if(gold) rec.gold=true;
    delete p.crop; p.stage=0; p.days=0;
    if(!auto){ Sound.pick(); UI.float(x,y,`${gold?'★金品 ':''}+${n} ${ITEMS[id].name}`); if(gold) Sound.levelup(); Story.check(); }
    Life.checkSets(); return n;
  },
  checkSets(){
    const C=Life.col();
    if(!S.flags.crop_set && CROP_ORDER.every(id=>C.crops[id])){ S.flags.crop_set=true; addItem('sprinkler',2); UI.banner('灵植图鉴集齐！'); UI.toast('奖励：灵泉阵 ×2'); }
    if(!S.flags.fish_set && FISH_ORDER.every(id=>C.fish[id])){ S.flags.fish_set=true; S.flags.goldrod=true; UI.banner('鱼类图鉴集齐！'); UI.toast('奖励：钓竿升级为金钓竿（收线框更大）'); }
  },
  /* ---------- each morning ---------- */
  newDay(){
    if(S.inv.puppet){ addItem('puppet',-S.inv.puppet); S.puppet=true; S.puppetSeed=S.puppetSeed||'auto'; UI.toast('播种傀儡已经守在灵田旁了'); }
    // sprinklers water their neighbours
    for(const k in S.farm){ const p=S.farm[k]; if(!p.sprinkler) continue; const [map,xy]=k.split(':'), [x,y]=xy.split(',').map(Number);
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const q=S.farm[map+':'+(x+dx)+','+(y+dy)]; if(q&&q.tilled&&!q.sprinkler) q.water=1; } }
    // the puppet harvests and replants
    if(S.puppet){ let got=0, planted=0;
      for(const k in S.farm){ const p=S.farm[k]; if(p.sprinkler||!p.tilled) continue;
        if(p.crop&&p.stage>=3) got+=Life.harvest(k,p,0,0,true);
        if(!p.crop){ const seed=Life.puppetSeed(); if(seed){ addItem(seed,-1); p.crop=ITEMS[seed].seed; p.stage=0; p.days=0; planted++; } } }
      if(got||planted) S._puppetNote=`播种傀儡：收获 ${got} 份，补种 ${planted} 格`; }
    // glowing water: one spot in each pond
    S.glow=[]; for(const m of ['town','forest']){ const w=Life.waterSpots(m); if(w.length&&Math.random()<.85){ const [x,y]=w[Math.floor(Math.random()*w.length)]; S.glow.push({map:m,x,y}); } }
  },
  puppetSeed(){ const pref=S.puppetSeed; if(pref&&pref!=='auto') return S.inv[pref]?pref:null;
    const seeds=Object.keys(S.inv).filter(k=>ITEMS[k].seed&&S.inv[k]>0).sort((a,b)=>S.inv[b]-S.inv[a]); return seeds[0]||null; },
  puppetMenu(){
    const seeds=Object.keys(ITEMS).filter(k=>ITEMS[k].seed);
    UI.say([{choice:`播种傀儡咔哒咔哒地点头。要它补种什么？（现在：${S.puppetSeed==='auto'?'自动选最多的种子':ITEMS[S.puppetSeed].name}）`,
      options:[{text:'自动（种得最多的）', fn:()=>{ S.puppetSeed='auto'; UI.toast('傀儡：自动补种'); }}, ...seeds.filter(k=>S.inv[k]).map(k=>({text:`${ITEMS[k].name}（有 ${S.inv[k]}）`, fn:()=>{ S.puppetSeed=k; UI.toast('傀儡：补种'+ITEMS[k].name); }})), {text:'没事了', fn:()=>{}}]}]);
  },
  waterSpots(m){ const M=MAPS[m], out=[];
    for(let y=0;y<M.h;y++) for(let x=0;x<M.w;x++){ if(M.ground[y][x]!=='~') continue;
      if([[0,1],[1,0],[0,-1],[-1,0]].some(([dx,dy])=>{ const c=(M.ground[y+dy]||'')[x+dx]; return c&&!'~WB'.includes(c); })) out.push([x,y]); }
    return out; },
  glowAt(m,x,y){ return (S.glow||[]).find(g=>g.map===m&&g.x===x&&g.y===y); },
  drawGround(g, ox, oy, T, Z){
    if(S.glow===undefined){ S.glow=[]; for(const m of ['town','forest']){ const w=Life.waterSpots(m); if(w.length){ const [x,y]=w[Math.floor(Math.random()*w.length)]; S.glow.push({map:m,x,y}); } } }
    for(const gl of S.glow||[]){ if(gl.map!==RT.mapId) continue; const cx=ox+(gl.x+.5)*T, cy=oy+(gl.y+.5)*T, r=T*(.55+.12*Math.sin(RT.t*3));
      const gr=g.createRadialGradient(cx,cy,0,cx,cy,r); gr.addColorStop(0,'rgba(255,240,160,.85)'); gr.addColorStop(.5,'rgba(255,210,90,.35)'); gr.addColorStop(1,'rgba(255,210,90,0)');
      g.fillStyle=gr; g.fillRect(cx-r,cy-r,r*2,r*2);
      for(let i=0;i<4;i++){ const a=RT.t*2+i*1.57, rr=T*.35; g.fillStyle='rgba(255,255,220,.9)'; g.fillRect(Math.round(cx+Math.cos(a)*rr), Math.round(cy+Math.sin(a)*rr*.5), Z, Z); } }
    for(const k in S.farm){ if(!k.startsWith(RT.mapId+':')||!S.farm[k].sprinkler) continue; const [x,y]=k.split(':')[1].split(',').map(Number); drawSprite('sprinkler', ox+x*T, oy+y*T, Z, 0); }
  },
  /* ---------- fishing tables ---------- */
  pick(spot){
    const night=S.min/60>=19||S.min/60<6, r=Math.random(), forest=RT.mapId==='forest';
    const F=(id,speed,jumpy)=>({id,speed,jumpy});
    if(spot){
      const king=r<(night?.15:.06);
      if(forest){ if(king) return F('fish_chiru',2.6,2.4); if(r<.4) return F('fish_jin',1.9,1.6); if(r<.7) return F('fish_wenyao',2.1,1.8); return F('fish_mo',1.5,1.2); }
      if(king) return F('fish_heluo',2.4,2.6); if(r<.45) return F('fish_wenyao',2.1,1.8); if(r<.8) return F('fish_lu',1.8,1.5); return F('fish_yin',1.2,.9);
    }
    if(forest && r<(night?.1:.05)) return F('fish_jin',1.9,1.6);
    if(night && r<.35) return F('fish_mo',1.5,1.2);
    if(r<.6) return F('fish_li',.8,.6); return F('fish_yin',1.2,.9);
  },
  bookHTML(tab){
    const C=Life.col(), sub=`<div class="tabs sub">${[['beast','妖兽'],['crop','灵植'],['fish','鱼类']].map(([k,n])=>`<button data-bk="${k}" class="${k===tab?'on':''}">${n}</button>`).join('')}</div>`;

      return sub+`<p class="muted">已收集 ${got}/${CROP_ORDER.length}　${S.flags.crop_set?'✓ 已领取集齐奖励（灵泉阵 ×2）':'集齐奖励：灵泉阵 ×2'}</p><div class="book">${CROP_ORDER.map(id=>{ const r=C.crops[id], it=ITEMS[id];

/* ============================================================
   山海问道 · navigation: tracked task, GPS trail, auto-walk, minimap, world map, task list, profiles
   ============================================================ */
const WORLD = { home:[0,0], town:[24,1], forest:[-3,17] };   // where each area sits on the world map (in tiles)

const Nav = {
  tracked(){
    if(S.track && S.track!=='main'){
      const q=SIDES.find(x=>x.id===S.track), st=q&&S.side[q.id];
      if(q && st!=='done'){
        if(!st) return {kind:'avail', id:q.id, title:q.title, desc:q.desc, progress:'去找'+npcAt(q.giver)[3]+'接取', target:npcAt(q.giver)};
        return {kind:'side', id:q.id, title:q.title, desc:q.desc, progress:sideReady(S,q)?'可以交付了':sideProgress(S,q), target:q.target(S)};
      }
      S.track='main';
    }
    const q=QUESTS[S.quest]; if(!q) return null;
    return {kind:'main', id:q.id, title:q.title, desc:q.desc, progress:q.progress?q.progress(S):'', target:q.target?q.target(S):null};
  },
  goal(){
    const tr=Nav.tracked(), t=tr&&tr.target; if(!t||!RT.map) return null;
    if(t[0]===RT.mapId) return {x:t[1], y:t[2], final:true, label:t[3]};
    const prev={[RT.mapId]:null}, q=[RT.mapId];
    while(q.length){ const m=q.shift(); if(m===t[0]) break; for(const e of MAPS[m].exits) if(!(e.to in prev)){ prev[e.to]=m; q.push(e.to); } }
    if(!(t[0] in prev)) return null;
    let m=t[0]; while(prev[m]!==RT.mapId) m=prev[m];
    const exits=RT.map.exits.filter(e=>e.to===m).sort((a,b)=>(Math.abs(a.x-S.x)+Math.abs(a.y-S.y))-(Math.abs(b.x-S.x)+Math.abs(b.y-S.y)));
    return {x:exits[0].x, y:exits[0].y, final:false, label:'前往'+MAPS[m].name.replace(/.*· /,'')};
  },
  pathTo(g){
    const solid=RT.solid[g.y]&&RT.solid[g.y][g.x];
    const reach = !g.final ? (x,y)=>x===g.x&&y===g.y
      : solid ? (x,y)=>Math.abs(x-g.x)+Math.abs(y-g.y)===1 : (x,y)=>Math.abs(x-g.x)+Math.abs(y-g.y)<=1;
    return bfs(S.x,S.y,reach);
  },
  tick(dt){
    RT.navT-=dt; if(RT.navT>0) return; RT.navT=0.25;
    const g=Nav.goal(); RT.navGoal=g; RT.navPath=g&&S.gps!==false?(Nav.pathTo(g)||[]):[];
    UI.miniDraw();
  },
  go(cont){
    if(UI.busy()&&!cont) UI.closePanel();
    const g=Nav.goal(); if(!g){ UI.toast('这个任务没有要去的地方'); return; }
    const p=Nav.pathTo(g); if(!p){ UI.toast('找不到路'); RT.autoNav=false; return; }
    RT.autoNav=true; RT.pending=null; RT.keys=[];
    if(!p.length){ Nav.arrive(); return; }
    setPath(p); if(!cont) UI.toast('自动寻路：'+g.label);
  },
  arrive(){
    RT.autoNav=false; const g=Nav.goal(); if(!g||!g.final) return;
    const o=entAt(g.x,g.y);
    if(o&&(o.type==='npc'||o.act||o.type==='gather')){ face(g.x,g.y); interact(o); }
    else UI.toast('到了：'+g.label);
  },
  drawWorld(g, ox, oy, T, Z){
    const goal=RT.navGoal; if(!goal) return;
    // breadcrumb trail: flowing gold dots
    const path=RT.navPath;
    for(let i=0;i<path.length && i<40;i++){
      const [x,y]=path[i], a=0.35+0.45*Math.max(0,Math.sin(RT.t*5-i*0.6)), r=(i%2?1:1.6)*Z;
      g.fillStyle=`rgba(255,214,90,${a})`; g.beginPath(); g.arc(ox+(x+.5)*T, oy+(y+.55)*T, r, 0, 7); g.fill();
    }
    // target marker
    const mx=ox+(goal.x+.5)*T, my=oy+goal.y*T - (4+Math.abs(Math.sin(RT.t*3))*4)*Z;
    g.fillStyle='rgba(255,214,90,.25)'; g.beginPath(); g.ellipse(ox+(goal.x+.5)*T, oy+(goal.y+.85)*T, 7*Z, 3*Z, 0, 0, 7); g.fill();
    g.fillStyle='#ffd65a'; g.strokeStyle='#5a2e12'; g.lineWidth=Z;
    g.beginPath(); g.moveTo(mx-4*Z,my-6*Z); g.lineTo(mx+4*Z,my-6*Z); g.lineTo(mx,my); g.closePath(); g.fill(); g.stroke();
  },
  drawArrow(g, ox, oy, T, Z){
    const goal=RT.navGoal; if(!goal) return;
    const tx=ox+(goal.x+.5)*T, ty=oy+(goal.y+.5)*T, W=cv.width, H=cv.height, m=40*RT.dpr;
    if(tx>m&&tx<W-m&&ty>m*2.2&&ty<H-m*2.2) return;
    const px=ox+(RT.fx+.5)*T, py=oy+(RT.fy+.2)*T, ang=Math.atan2(ty-py,tx-px);
    // the arrow circles the hero, so it never hides behind the HUD
    const ax=px+Math.cos(ang)*T*1.5, ay=py+Math.sin(ang)*T*1.5, s=5*RT.dpr*Math.max(1,RT.scale/2.5);
    g.save(); g.translate(ax,ay);
    g.globalAlpha=0.75+0.25*Math.sin(RT.t*5); g.fillStyle='rgba(74,35,11,.85)'; g.beginPath(); g.arc(0,0,s*1.6,0,7); g.fill();
    g.rotate(ang); g.fillStyle='#ffd65a'; g.beginPath(); g.moveTo(s,0); g.lineTo(-s*.7,-s*.75); g.lineTo(-s*.3,0); g.lineTo(-s*.7,s*.75); g.closePath(); g.fill();
    g.restore(); g.globalAlpha=1;
  },
};

/* ---------- minimap ---------- */
const TILECOL = {'.':'#6fbf4f',',':'#78c556',':':'#4f9a3a','=':'#d4ae78','#':'#cdbfa6','~':'#4a9fd8','B':'#a8743f','W':'#7d6c58','F':'#b98b5a','f':'#8a5a36'};
const MINIC = {};
function miniBase(id){
  if(MINIC[id]) return MINIC[id]; const m=MAPS[id], s=3, c=document.createElement('canvas'); c.width=m.w*s; c.height=m.h*s; const g=c.getContext('2d');
  for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){ g.fillStyle=TILECOL[m.ground[y][x]]||'#6fbf4f'; g.fillRect(x*s,y*s,s,s); }
  for(const o of m.objects){
    if(o.type==='building'){ g.fillStyle='#7a3d3d'; g.fillRect(o.x*s,o.y*s,o.w*s,o.h*s); g.fillStyle='#f3e3c3'; g.fillRect(o.x*s+1,(o.y+o.h)*s-2,o.w*s-2,2); }
    else if(o.type==='tree'||o.type==='pine'||o.type==='bush'){ g.fillStyle='#2f6b2c'; g.fillRect(o.x*s,o.y*s,s,s); }
    else if(o.type==='rock'){ g.fillStyle='#9aa0a6'; g.fillRect(o.x*s,o.y*s,s,s); }
    else if(o.type==='shrine'){ g.fillStyle='#c8413b'; g.fillRect(o.x*s-1,o.y*s-1,s+2,s+2); }
    else if(o.type==='futon'||o.type==='furnace'){ g.fillStyle='#e8b84a'; g.fillRect(o.x*s,o.y*s,s,s); }
  }
  for(const e of m.exits){ g.fillStyle='#fff3a0'; g.fillRect(e.x*s,e.y*s,s,s); }
  return MINIC[id]=c;
}
UI.miniReset=()=>{ const c=$('#mini'); if(!c||!RT.map) return; const b=miniBase(RT.mapId); c.width=b.width; c.height=b.height; UI.miniDraw(); };
UI.miniDraw=()=>{
  const c=$('#mini'); if(!c||!RT.map) return; const g=c.getContext('2d'), s=3; if(c.width!==miniBase(RT.mapId).width) return UI.miniReset();
  g.drawImage(miniBase(RT.mapId),0,0);
  for(const o of RT.ents) if(o.type==='npc'){ g.fillStyle='#4a7fd0'; g.fillRect(o.x*s,o.y*s,s,s); }
  for(const b of RT.beasts){ g.fillStyle='#e0402e'; g.fillRect(Math.round(b.fx*s),Math.round(b.fy*s),s,s); }
  const goal=RT.navGoal; if(goal){ g.fillStyle=(Math.floor(RT.t*3)%2)?'#ffd65a':'#fff'; g.fillRect(goal.x*s-1,goal.y*s-1,s+2,s+2); }
  g.fillStyle='#fff'; g.fillRect(Math.round(RT.fx*s)-1,Math.round(RT.fy*s)-1,s+2,s+2); g.fillStyle='#c8413b'; g.fillRect(Math.round(RT.fx*s),Math.round(RT.fy*s),s,s);
};

/* ---------- world map ---------- */
UI.worldMap=()=>{
  if(!$('#panel').hidden){ UI.closePanel(); return; }
  const tr=Nav.tracked();
  UI.panel('地图', `<canvas id="wm" class="px wm"></canvas>
    <div class="legend"><span><i style="background:#c8413b"></i>你</span><span><i style="background:#ffd65a"></i>任务目标</span><span><i style="background:#4a7fd0"></i>人物</span><span><i style="background:#e0402e"></i>妖兽</span></div>
    ${tr?`<div class="qcur"><b>${esc(tr.title)}</b><p>${esc(tr.target?tr.target[3]+' · '+MAPS[tr.target[0]].name:'')}</p><button class="btn mini" id="wmGo">寻路</button></div>`:''}`, b=>{
    const c=$('#wm'), s=3; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const id in WORLD){ const [wx,wy]=WORLD[id], m=MAPS[id]; x0=Math.min(x0,wx); y0=Math.min(y0,wy); x1=Math.max(x1,wx+m.w); y1=Math.max(y1,wy+m.h); }
    c.width=(x1-x0)*s; c.height=(y1-y0)*s; const g=c.getContext('2d');
    g.fillStyle='#d9c08a'; g.fillRect(0,0,c.width,c.height);
    for(const id in WORLD){ const [wx,wy]=WORLD[id]; g.drawImage(miniBase(id),(wx-x0)*s,(wy-y0)*s); }
    const t=tr&&tr.target; if(t){ const [wx,wy]=WORLD[t[0]]; g.fillStyle='#ffd65a'; g.strokeStyle='#5a2e12'; g.lineWidth=1; g.fillRect((wx-x0+t[1])*s-2,(wy-y0+t[2])*s-2,s+4,s+4); g.strokeRect((wx-x0+t[1])*s-2.5,(wy-y0+t[2])*s-2.5,s+5,s+5); }
    const [px,py]=WORLD[RT.mapId]; g.fillStyle='#fff'; g.fillRect((px-x0+RT.fx)*s-2,(py-y0+RT.fy)*s-2,s+4,s+4); g.fillStyle='#c8413b'; g.fillRect((px-x0+RT.fx)*s-1,(py-y0+RT.fy)*s-1,s+2,s+2);
    // area names as HTML labels over the canvas
    const wrap=document.createElement('div'); wrap.className='wm-wrap'; c.replaceWith(wrap); wrap.appendChild(c);
    for(const id in WORLD){ const [wx,wy]=WORLD[id], m=MAPS[id]; const l=document.createElement('span'); l.className='wm-label'; l.textContent=m.name.replace(/.*· /,'');
      l.style.left=((wx-x0+m.w/2)/(x1-x0)*100)+'%'; l.style.top=((wy-y0+1.2)/(y1-y0)*100)+'%'; wrap.appendChild(l); }
    const go=$('#wmGo'); if(go) go.onclick=()=>{ UI.closePanel(); Nav.go(); };
  });
};

/* ---------- task list ---------- */
UI.tasks=()=>{
  if(!$('#panel').hidden && UI._panelKind==='tasks'){ UI.closePanel(); return; }
  const q=QUESTS[S.quest], rows=[];
  rows.push(`<div class="task ${S.track==='main'?'on':''}"><div class="tk-head"><span class="tag main">主线</span><b>${esc(q.title)}</b></div><p>${esc(q.desc)}</p>
    ${q.progress?`<p class="muted">进度：${esc(q.progress(S))}</p>`:''}
    <div class="tk-btns"><button class="btn mini" data-track="main">${S.track==='main'?'追踪中':'追踪'}</button>${q.target?'<button class="btn mini main" data-go="main">寻路</button>':''}</div></div>`);
  for(const s of SIDES){ const st=S.side[s.id]; if(st==='done'||!s.unlock(S)) continue;
    const giver=npcAt(s.giver)[3];
    rows.push(`<div class="task ${S.track===s.id?'on':''}"><div class="tk-head"><span class="tag">${st?'支线':'可接取'}</span><b>${esc(s.title)}</b></div>
      <p>${esc(st?s.desc:'去找'+giver+'聊聊，看看有什么能帮忙的。')}</p>${st?`<p class="muted">进度：${esc(sideReady(S,s)?'可以交付给'+giver+'了':sideProgress(S,s))}</p>`:''}
      <div class="tk-btns"><button class="btn mini" data-track="${s.id}">${S.track===s.id?'追踪中':'追踪'}</button><button class="btn mini main" data-go="${s.id}">寻路</button></div></div>`); }
  const done=[...QUESTS.slice(0,S.quest).map(x=>x.title), ...SIDES.filter(s=>S.side[s.id]==='done').map(s=>s.title)];
  UI.panel('任务', rows.join('')+(done.length?`<details class="qdone-d"><summary>已完成（${done.length}）</summary><ul class="qdone">${done.map(t=>`<li>✓ ${esc(t)}</li>`).join('')}</ul></details>`:'')
    +`<label class="gps-t"><input type="checkbox" id="gpsT" ${S.gps!==false?'checked':''}> 显示地面引路光点</label>`, b=>{
    b.querySelectorAll('[data-track]').forEach(x=>x.onclick=()=>{ Sound.tick(); S.track=x.dataset.track; RT.navT=0; UI.hud(); UI._panelKind=''; $('#panel').hidden=true; UI.tasks(); });
    b.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{ Sound.tick(); S.track=x.dataset.go; RT.navT=0; UI.closePanel(); UI.hud(); Nav.go(); });
    $('#gpsT').onchange=e=>{ S.gps=e.target.checked; RT.navT=0; };
  });
  UI._panelKind='tasks';
};

/* ---------- side quests through NPC talk ---------- */
Story.finishSide=(q, after)=>{
  if(q.need) for(const [k,n] of Object.entries(q.need)) addItem(k,-n);
  S.side[q.id]='done'; const r=q.reward||{}; if(r.stones){ S.stones+=r.stones; } if(r.give) for(const k in r.give) addItem(k,r.give[k]);
  if(r.energy){ S.bonusEnergy=(S.bonusEnergy||0)+r.energy; S.energy+=r.energy; }
  if(r.atk) S.bonusAtk=(S.bonusAtk||0)+r.atk;
  if(r.petlv&&S.pet) S.pet.lv+=r.petlv;
  if(r.tianji){ S.flags.tianji_up=true; if(S.fortune===3) S.fortune=2; }
  if(r.heart) for(const k in r.heart) Social.add(k,r.heart[k]);
  if(S.track===q.id) S.track='main'; UI.hud();
  UI.say(q.done.concat([['旁白',`完成支线「${q.title}」`+([r.stones?`灵石 +${r.stones}`:'', ...Object.keys(r.give||{}).map(k=>ITEMS[k].name+'×'+r.give[k]), r.energy?`体力上限 +${r.energy}`:'', ...Object.keys(r.heart||{}).map(k=>NPCS[k].name+'好感 ↑')].filter(Boolean).map((x,i)=>(i?'，':'：')+x).join(''))]]), after);
  Sound.coin(); return true;
};
Story.side=(id, after)=>{
  for(const q of SIDES){ if(q.giver!==id||!q.unlock(S)) continue; const st=S.side[q.id];
    if(st==='active' && sideReady(S,q)){
      if(q.deliverAt==='shrine'){ UI.say([[NPCS[id].name,'灵草带来了？那就去山林南边的青丘狐祠，供在香炉前吧。']], after); return true; }
      return Story.finishSide(q, after);
    }
    if(!st){ S.side[q.id]='active'; if(q.count) S.side[q.id+'_base']=sideCountNow(S,q.count); S.track=q.id; UI.hud(); RT.navT=0;
      UI.say(q.start.concat([['旁白',`接下支线「${q.title}」，已设为追踪。`]]), after); return true; }
  }
  return false;
};

/* ============================================================
   山海问道 · saving: autosave + three manual snapshots per profile + a "测灵根前" snapshot
   Players may save any time outside battles and mini-games (and reroll their roots — that's a feature).
   ============================================================ */
const SaveSys = {
  SNAPS:['m1','m2','m3'],
  key(slot, snap){ return slotKey(slot)+'.'+snap; },
  canSave(){ return !!S && !Battle.s && !UI.fx; },
  meta(s){ const q=QUESTS[s.quest]; return {name:s.name, realm:realmName(s.L), day:s.day, time:fmtTime(s.min), map:MAPS[s.map]?MAPS[s.map].name:'', quest:q?q.title:'', root:s.root?ROOT_KINDS[s.root.n].name+'（'+s.root.els.join('')+'）':'未测', at:Date.now()}; },
  read(slot, snap){ try{ return JSON.parse(localStorage.getItem(SaveSys.key(slot,snap))||'null'); }catch(e){ return null; } },
  write(snap){
    if(!SaveSys.canSave()) return false;
    S.x=S.x; const rec={meta:SaveSys.meta(S), state:S};
    try{ localStorage.setItem(SaveSys.key(RT.slot,snap), JSON.stringify(rec)); save(); return true; }catch(e){ return false; }
  },
  // load a snapshot into this profile's slot and step into it
  load(slot, snap){
    const rec=SaveSys.read(slot,snap); if(!rec) return false;
    RT.slot=slot; S=JSON.parse(JSON.stringify(rec.state)); S=loadFromObject(S);
    Sect.migrate(); Hooks.placeQiyu(); save();
    Battle.s&&Battle.close(); Mini.close(); $('#dlg').hidden=true; UI.dlgQ=null; $('#panel').hidden=true; $('#title').hidden=true; clearInterval(Creator.timer);
    enterMap(S.map,S.x,S.y); RT.dir='down'; UI.hud(); UI.sync();
    SaveSys.resume(); UI.toast('已读取存档'); return true;
  },
  // a save made during the prologue replays it (so the root test can be taken again)
  resume(){
    if(!S.flags.intro_done && S.quest===0){ UI.say(S.root?SCRIPTS.intro_post:SCRIPTS.intro, ()=>{ S.questStarted=0; Story.check(); }); return; }
    Story.check();
  },
  ago(t){ const m=Math.round((Date.now()-t)/60000); return m<1?'刚刚':m<60?m+' 分钟前':m<1440?Math.round(m/60)+' 小时前':Math.round(m/1440)+' 天前'; },
  card(slot, snap, label, canWrite){
    const rec=SaveSys.read(slot,snap), m=rec&&rec.meta;
    return `<div class="savecard"><div class="sc-l"><b>${label}</b>${m?`<span>${esc(m.realm)} · 第 ${m.day} 天 ${esc(m.time)}</span><span class="muted">${esc(m.map)} · ${esc(m.quest)}</span><span class="muted">灵根：${esc(m.root)} · ${SaveSys.ago(m.at)}</span>`:'<span class="muted">（空）</span>'}</div>
      <div class="sc-r">${canWrite?`<button class="btn mini" data-sv="${snap}">${m?'覆盖':'存到这里'}</button>`:''}${m?`<button class="btn mini main" data-ld="${slot}:${snap}">读取</button>`:''}</div></div>`;
  },
  bind(root, after){
    root.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{
      if(b.textContent==='覆盖'){ b.textContent='确定覆盖？'; return; }
      if(!SaveSys.write(b.dataset.sv)) return UI.toast(SaveSys.canSave()?'存档失败（浏览器不允许存储）':'战斗或小游戏中不能存档');
      Sound.coin(); UI.toast('已存档'); after&&after(); });
    root.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{
      if(b.textContent==='读取'){ b.textContent='确定读取？'; setTimeout(()=>{ if(b.isConnected) b.textContent='读取'; },2500); return; }
      const [slot,snap]=b.dataset.ld.split(':'); Sound.tick(); SaveSys.load(+slot,snap); });
  },
  panel(){
    if(!S) return;
    const auto=readSlot(RT.slot);
    UI.panel('存档', `<p class="muted">战斗和小游戏以外，随时都可以存档、读档。每晚睡觉、换地图、完成任务、切出游戏时也会自动存档。</p>
      <div class="savecard auto"><div class="sc-l"><b>自动存档</b>${auto?`<span>${realmName(auto.L)} · 第 ${auto.day} 天 ${fmtTime(auto.min)}</span>`:'<span class="muted">（空）</span>'}</div><div class="sc-r"><button class="btn mini" id="svAuto">立即自动存档</button></div></div>
      ${SaveSys.SNAPS.map((s,i)=>SaveSys.card(RT.slot,s,'手动存档 '+(i+1),true)).join('')}
      ${SaveSys.read(RT.slot,'pre_root')?SaveSys.card(RT.slot,'pre_root','测灵根前（自动）',false):''}
      <p class="muted">想重新测灵根？读取「测灵根前」即可。</p>`, b=>{
        $('#svAuto').onclick=()=>{ if(!SaveSys.canSave()) return UI.toast('战斗或小游戏中不能存档'); UI.toast(save()?'已存档':'存档失败'); Sound.coin(); UI.closePanel(); SaveSys.panel(); };
        SaveSys.bind(b, ()=>{ UI.closePanel(); SaveSys.panel(); });
      });
  },
  // title screen: list a profile's snapshots inline
  titleList(slot, host){
    const list=[...SaveSys.SNAPS.map((s,i)=>[s,'手动存档 '+(i+1)]), ['pre_root','测灵根前']].filter(([s])=>SaveSys.read(slot,s));
    host.innerHTML=list.length?list.map(([s,l])=>SaveSys.card(slot,s,l,false)).join(''):'<p class="muted" style="color:#fff3dc">这个角色还没有手动存档。</p>';
    SaveSys.bind(host);
  },
  autoTick:0,
};
function loadFromObject(s){ s.side=s.side||{}; s.track=s.track||'main'; s.look=s.look||defaultLook('m'); s.name=s.name||'无名'; s.st.meditated=s.st.meditated||0; if(s.quest>0) (s.flags=s.flags||{}).intro_done=true; return s; }

    UI.closePanel(); $('#dlg').hidden=true; UI.dlgQ=null; enterMap(...at); UI.hud(); UI.sync(); save(); UI.toast('已跳到：'+Dev.POINTS[point]);
  },
  POINTS:{forest:'山林怪声', qiongqi:'讨伐穷奇前', zhuji:'筑基突破前', sect:'拜师大典前（已筑基）', huli:'青丘狐影前（已拜师）', end:'第一章结束'},

  cheat(c){

    if(c==='stones'){ S.stones+=1000; }
    if(c==='heal'){ const st=stats(); S.hp=st.hp; S.mp=st.mp; S.energy=maxEnergy(); }
    if(c==='hearts'){ for(const k in NPCS) Social.rel(k).pts=1000; }
    if(c==='god'){ Dev.god=!Dev.god; }

    if(x==='heart_tang'||x==='heart_ge'){ const id=x.slice(6), r=Social.rel(id); r.pts=Math.max(r.pts,450); r.ev={}; return Social.chat(id); }
  },
};
